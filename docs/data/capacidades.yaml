# =============================================================================
# capacidades.yaml — Mapa de Capacidades ConectaFAPES
# Fonte de verdade do grafo de módulos: importância, impacto e habilitação.
# Gera o site (grafo/árvore). Editar AQUI, não no HTML.
# =============================================================================

meta:
  titulo: "Mapa de Capacidades — ConectaFAPES"
  subtitulo: "Como cada módulo habilita os demais"
  versao: "1.0.0"
  atualizado_em: "2026-06-23"
  fonte: "docs/implementation/modules/*/ontology.yaml + README.md"

# -- Domínios = cor do nó -----------------------------------------------------
dominios:
  corporativo: { nome: "IAM / Corporativo", cor: "#3b82f6" }
  plataforma:  { nome: "Plataforma",         cor: "#64748b" }
  pre_award:   { nome: "Pré-Award",          cor: "#8b5cf6" }
  post_award:  { nome: "Post-Award",         cor: "#10b981" }
  financeiro:  { nome: "Financeiro",         cor: "#f59e0b" }
  inteligencia: { nome: "Inteligência",      cor: "#ec4899" }

# -- Níveis = coluna no grafo (cadeia de valor, esquerda → direita) -----------
niveis:
  - { id: fundacao,     ordem: 0, nome: "Fundação" }
  - { id: pre_award,    ordem: 1, nome: "Pré-Award" }
  - { id: contratacao,  ordem: 2, nome: "Contratação" }
  - { id: post_award,   ordem: 3, nome: "Post-Award" }
  - { id: execucao,     ordem: 4, nome: "Execução / Financeiro" }
  - { id: inteligencia, ordem: 5, nome: "Inteligência" }

# -- Legenda das escalas (autorais, 1=apoio .. 5=crítico) ---------------------
escalas:
  importancia:
    1: "Apoio"
    2: "Complementar"
    3: "Relevante"
    4: "Estruturante"
    5: "Crítico — bloqueia o negócio"
  impacto:        # blast radius se o módulo cair
    baixo:   "Degrada uma feature isolada"
    medio:   "Degrada um fluxo"
    alto:    "Para um domínio inteiro"
    critico: "Para a plataforma"
  tipo_aresta:    # natureza da habilitação (estilo da linha no grafo)
    dados:    "Fornece dado mestre / referência"
    evento:   "Emite evento consumido"
    workflow: "Transição de estado / handoff"
    infra:    "Serviço transversal (auth, gateway, notificação)"

# -- Módulos ------------------------------------------------------------------
# Campo `habilita` é a aresta canônica (este módulo VIABILIZA o destino).
# `depende_de` é derivado pelo site invertendo `habilita` — não precisa manter.
# `transversal: true` => infra que conecta quase tudo; arestas ocultas por
# padrão no grafo (toggle), pra não virar emaranhado.
modulos:

  # --- Fundação --------------------------------------------------------------
  - id: M005
    nome: "Autenticação"
    slug: autenticacao
    dominio: corporativo
    nivel: fundacao
    transversal: true
    status: entregue
    importancia: 5
    impacto: critico
    proposito: "Autenticação centralizada via Acesso Cidadão (OIDC)."
    entidades_chave: []
    habilita:
      - { modulo: M020, tipo: infra }
      - { modulo: M023, tipo: infra }
      - { modulo: M024, tipo: infra }
      - { modulo: M019, tipo: infra }

  - id: M006
