ontology: "Shared Geography — Cities and Regions"
namespace: "shared.geography"
imports:
  - namespace: "shared"
    path: path: "base.yaml"
metadata:
  module: "M008"
  source: "docs/implementation/modules/M008-cadastros-corporativos/geografia/modelo-estrutural.md"
  version: "1.0.0"
  description: "Geographic reference data for municipalities (Cidade) and territorial groupings (Regiao) used across ConectaFAPES modules."

entities:
  Cidade:
    description: "Geographic reference for municipalities used in addresses, regions, territorial scope, calls and indicators. Identified uniquely by IBGE code."
    extends: null
    fields:
      id:
        type: uuid
        required: true
        description: "Surrogate primary key."
      nome:
        type: string
        required: true
        description: "Nome da cidade, máximo 200 caracteres. Ex: Vitória."
      codigoIBGE:
        type: string
        required: true
        unique: true
        description: "Código IBGE da cidade, máximo 10 caracteres. Ex: 3205309. Deve ser único."
      regiaoId:
        type: uuid
        required: false
        description: "FK para Regiao — região de agrupamento territorial da cidade. Opcional conforme RN09."
      estadoId:
        type: uuid
        required: true
        description: "FK para Estado — UF à qual o município pertence conforme IBGE."
      # Auditavel mixin
      createdAt:
        type: datetime
        required: true
        description: "Timestamp de criação do registro."
      updatedAt:
        type: datetime
        required: true
        description: "Timestamp da última atualização."
      createdBy:
        type: uuid
        required: true
        description: "Identificador do usuário que criou o registro."
      updatedBy:
        type: uuid
        required: true
        description: "Identificador do usuário que realizou a última atualização."

  Regiao:
    description: "Territorial grouping of cities for regional analyses, call configurations, coverage monitoring and geographic organization of the state."
    extends: null
    fields:
      id:
        type: uuid
        required: true
        description: "Surrogate primary key."
      nome:
        type: string
        required: true
        unique: true
        description: "Nome da região, máximo 200 caracteres. Ex: Grande Vitória. Deve ser único."
      descricao:
        type: string
        required: false
        description: "Descrição da região, máximo 500 caracteres."
      # Auditavel mixin
      createdAt:
        type: datetime
        required: true
        description: "Timestamp de criação do registro."
      updatedAt:
        type: datetime
        required: true
        description: "Timestamp da última atualização."
      createdBy:
        type: uuid
        required: true
        description: "Identificador do usuário que criou o registro."
      updatedBy:
        type: uuid
        required: true
        description: "Identificador do usuário que realizou a última atualização."

  Estado:
    description: "Unidade Federativa brasileira. Tabela de referência carregada a partir dos dados oficiais do IBGE (estados-brasil.json). Identificada de forma única pela sigla."
    extends: null
    fields:
      id:
        type: uuid
        required: true
        description: "Surrogate primary key."
      codigoIBGE:
        type: string
        required: true
        unique: true
        description: "Código numérico IBGE da UF (ex: '32' para Espírito Santo). Máximo 2 caracteres."
      sigla:
        type: string
        required: true
        unique: true
        description: "Sigla da UF, 2 caracteres maiúsculos. Ex: ES, SP, RJ."
      nome:
        type: string
        required: true
        description: "Nome completo da UF. Ex: Espírito Santo. Máximo 100 caracteres."
      regiaoFederativa:
        type: "enum:RegiaoFederativa"
        required: true
        description: "Macrorregião federativa do IBGE à qual a UF pertence."
      createdAt:
        type: datetime
        required: true
        description: "Timestamp de criação do registro."
      updatedAt:
        type: datetime
        required: true
        description: "Timestamp da última atualização."
      createdBy:
        type: uuid
        required: true
        description: "Identificador do usuário que criou o registro."
      updatedBy:
        type: uuid
        required: true
        description: "Identificador do usuário que realizou a última atualização."

relationships:
  - from: "shared.geography.Regiao"
    relation: "groups"
    to: "shared.geography.Cidade"
    cardinality: "1..*"
    description: "Uma Região agrupa zero ou mais Cidades para organização territorial."
  - from: "shared.geography.Cidade"
    relation: "belongsTo"
    to: "shared.geography.Regiao"
    cardinality: "0..1"
    description: "Uma Cidade pode pertencer a uma Região quando houver agrupamento territorial definido (RN09)."
  - from: "shared.geography.Cidade"
    relation: "pertence a"
    to: "shared.geography.Estado"
    cardinality: "N:1"
    description: "Cada município pertence a uma UF conforme cadastro IBGE."
  - from: "shared.geography.Estado"
    relation: "agrupa municípios"
    to: "shared.geography.Cidade"
    cardinality: "1:N"
    description: "Uma UF possui um ou mais municípios."

axioms:
  - id: "AX-GEO-01"
    natural_language: "Código IBGE uniquely identifies a city."
    formal_rule: "∀c1, c2 ∈ Cidade: c1.codigoIBGE = c2.codigoIBGE → c1 = c2"
  - id: "AX-GEO-02"
    natural_language: "A region name is unique within the system."
    formal_rule: "∀r1, r2 ∈ Regiao: r1.nome = r2.nome → r1 = r2"
  - id: "AX-GEO-03"
    natural_language: "Cities remain queryable for historical records even when no longer used in new operations."
    formal_rule: "∀c ∈ Cidade: HistoricalReference(c) → c.queryable = true"
  - id: "AX-GEO-04"
    natural_language: "Estado.sigla is unique and has exactly 2 uppercase characters."
    formal_rule: "∀e ∈ Estado: e.sigla.length = 2 ∧ isUppercase(e.sigla) ∧ unique(e.sigla)"
  - id: "AX-GEO-05"
    natural_language: "Every Cidade must reference a valid Estado."
    formal_rule: "∀c ∈ Cidade: ∃e ∈ Estado: c.estadoId = e.id"

invariants:
  - id: "INV-GEO-01"
    rule: "Cidade.codigoIBGE.length ≤ 10 ∧ isNumeric(Cidade.codigoIBGE)"
    description: "IBGE code must be numeric and at most 10 characters."
  - id: "INV-GEO-02"
    rule: "Regiao.nome is unique"
    description: "Region name must be unique."
  - id: "INV-GEO-03"
    rule: "Estado.sigla.length = 2 ∧ Estado.sigla = Estado.sigla.toUpperCase()"
    description: "UF sigla must be exactly 2 uppercase characters."

enums:
  RegiaoFederativa:
    description: "Macrorregião federativa do IBGE. Agrupa as 27 Unidades Federativas brasileiras em 5 regiões."
    values:
      NORTE: "Região Norte — AC, AM, AP, PA, RO, RR, TO."
      NORDESTE: "Região Nordeste — AL, BA, CE, MA, PB, PE, PI, RN, SE."
      CENTRO_OESTE: "Região Centro-Oeste — DF, GO, MS, MT."
      SUDESTE: "Região Sudeste — ES, MG, RJ, SP."
      SUL: "Região Sul — PR, RS, SC."

value_objects: null

events: []

workflows: null
policies: null

agent_instructions:
  rules:
    - "Não criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementação deve seguir workflows definidos."
    - "codigoIBGE é o identificador canônico de Cidade; nunca criar duplicata por nome."
    - "Regiao não substitui o cadastro oficial da cidade; apenas organiza agrupamentos territoriais."
    - "Cidade removida de uso ativo deve permanecer consultável para histórico (não aplicar hard delete)."
  notes:
    - "RN09 define que cidades devem pertencer a uma região quando houver agrupamento territorial definido; a associação é opcional."
    - "Regiao.descricao é nullable conforme atributos documentados."
    - "Estado é tabela de referência carregada do IBGE; os 26 estados + DF somam 27 registros fixos. Não permitir criação manual avulsa."
    - "codigoIBGE de Cidade deve ser consistente com o estadoId informado — validar via tabela IBGE."
