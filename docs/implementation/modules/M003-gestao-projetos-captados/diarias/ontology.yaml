ontology: "Solicitações de Diária do Projeto"
namespace: "post_award.iniciativas.diarias"
imports:
  - namespace: shared
    path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.iniciativas
    path: "../ontology.yaml"
  - namespace: corporativo.diarias
    path: "../../M008-cadastros-corporativos/diarias/ontology.yaml"
metadata:
  module: "M003"
  source: "docs/implementation/modules/M003-gestao-projetos-captados/diarias/modelo-estrutural.md"
  version: "2.0.0"
  description: "Gerencia solicitações operacionais de diária dentro de um projeto, incluindo aceite dos bolsistas e cancelamento."

entities:

  SolicitacaoDiaria:
    description: "Pedido operacional de diária criado pelo coordenador para um conjunto de bolsistas do projeto. Cada bolsista gera um AceiteViagem próprio dentro da solicitação."
    extends: "shared.Auditavel"
    fields:
      origem:
        type: "ref:post_award.iniciativas.diarias.Cidade"
        required: true
        description: "Cidade de origem da viagem."
      destino:
        type: "ref:post_award.iniciativas.diarias.Localidade"
        required: true
        description: "Destino da viagem. Pode ser uma Cidade ou um Pais."
      tipo:
        type: "ref:M008.TipoDiaria"
        required: true
        description: "Tipo de diária (DENTRO_ESTADO, NACIONAL ou INTERNACIONAL). Referência ao cadastro corporativo do M008."
      dataHoraSaida:
        type: datetime
        required: true
        description: "Data e hora de partida. Deve ser anterior a dataHoraChegada."
      dataHoraChegada:
        type: datetime
        required: true
        description: "Data e hora de chegada. Deve ser posterior a dataHoraSaida."
      dataHoraCriacao:
        type: datetime
        required: true
        description: "Data e hora em que a solicitação foi criada."
      motivo:
        type: string
        required: true
        description: "Motivo da viagem declarado pelo coordenador."
      quantidadeDiariasCalculada:
        type: decimal
        required: true
        description: "Quantidade de diárias calculada pelo sistema a partir do período e parâmetros vigentes. Snapshot imutável após criação."
      valorTotalCalculado:
        type: decimal
        required: true
        description: "Valor total calculado pelo sistema. Snapshot imutável após criação."
      estado:
        type: "enum:EstadoSolicitacaoDiaria"
        required: true
        description: "Estado atual da solicitação."
      projeto:
        type: "ref:post_award.iniciativas.Iniciativa"
        required: true
        description: "Projeto ao qual a solicitação pertence."
      listaAceiteViagem:
        type: "AceiteViagem[]"
        required: true
        description: "Lista de aceites, um por bolsista. Mínimo 1. Todos viram CANCELADO quando a solicitação é cancelada. Ao criar cada AceiteViagem, o sistema envia uma notificação de diária para o bolsista correspondente."

  Localidade:
    description: "Tipo abstrato que representa a origem ou o destino de uma viagem. Pode ser Cidade ou Pais."
    abstract: true
    fields:
      nome:
        type: string
        required: true
        description: "Nome da localidade."
      pais:
        type: string
        required: true
        description: "País onde a localidade está situada."

  Cidade:
    description: "Localidade do tipo cidade. Usada como origem da viagem e como destino quando o destino for uma cidade específica."
    extends: "Localidade"
    fields:
      estado:
        type: string
        required: true
        description: "Estado (UF) onde a cidade está localizada."

  Pais:
    description: "Localidade do tipo país. Usada como destino em viagens internacionais sem cidade específica."
    extends: "Localidade"

  AceiteViagem:
    description: "Registra a manifestação de um bolsista sobre uma SolicitacaoDiaria. Entidade embarcada — persiste dentro da SolicitacaoDiaria."
    fields:
      bolsista:
        type: "ref:M009.AlocacaoBolsista"
        required: true
        description: "Bolsista que deve aceitar ou recusar a viagem."
      dataAceite:
        type: datetime
        required: false
        description: "Data e hora em que o bolsista registrou a manifestação. Nulo enquanto estado = AGUARDANDO_ACEITE."
      estado:
        type: "enum:EstadoAceiteViagem"
        required: true
        description: "Estado do aceite pelo bolsista."

relationships:
  - from: "post_award.iniciativas.diarias.SolicitacaoDiaria"
    relation: "pertence a"
    to: "post_award.iniciativas.Iniciativa"
    cardinality: "N:1"

  - from: "post_award.iniciativas.diarias.SolicitacaoDiaria"
    relation: "usa tipo de diária"
    to: "M008.TipoDiaria"
    cardinality: "N:1"
    note: "Entidade externa — referenciada por uuid opaco."

  - from: "post_award.iniciativas.diarias.SolicitacaoDiaria"
    relation: "contém aceites"
    to: "post_award.iniciativas.diarias.AceiteViagem"
    cardinality: "1:N"
    note: "Composição — AceiteViagem não existe fora da SolicitacaoDiaria."

  - from: "post_award.iniciativas.diarias.AceiteViagem"
    relation: "referencia bolsista"
    to: "M009.AlocacaoBolsista"
    cardinality: "N:1"
    note: "Entidade externa — referenciada por uuid opaco."

axioms:
  - id: "AX-M003-D001"
    natural_language: "A data/hora de chegada deve ser posterior à data/hora de partida."
    formal_rule: "∀s ∈ SolicitacaoDiaria: s.dataHoraChegada > s.dataHoraSaida"

  - id: "AX-M003-D002"
    natural_language: "Uma SolicitacaoDiaria deve ter pelo menos um AceiteViagem."
    formal_rule: "∀s ∈ SolicitacaoDiaria: |s.listaAceiteViagem| ≥ 1"

  - id: "AX-M003-D003"
    natural_language: "Ao cancelar uma SolicitacaoDiaria, todos os AceiteViagem são automaticamente marcados como CANCELADO."
    formal_rule: "∀s ∈ SolicitacaoDiaria: s.estado = CANCELADA → ∀a ∈ s.listaAceiteViagem: a.estado = CANCELADO"

  - id: "AX-M003-D004"
    natural_language: "dataAceite só pode ser preenchida quando estado do AceiteViagem for ACEITO ou NAO_ACEITO."
    formal_rule: "∀a ∈ AceiteViagem: a.dataAceite ≠ null → a.estado ∈ {ACEITO, NAO_ACEITO}"

  - id: "AX-M003-D005"
    natural_language: "SolicitacaoDiaria só pode passar para ATIVA a partir de RASCUNHO."
    formal_rule: "∀s ∈ SolicitacaoDiaria: TRANSITION(s, ATIVA) → s.estadoAnterior = RASCUNHO"

invariants:
  - id: "INV-M003-D001"
    rule: "SolicitacaoDiaria.dataHoraChegada > SolicitacaoDiaria.dataHoraSaida"
    description: "A chegada deve ser posterior à partida."

  - id: "INV-M003-D002"
    rule: "SolicitacaoDiaria.listaAceiteViagem não pode ser vazia"
    description: "Toda solicitação deve ter ao menos um aceite associado."

  - id: "INV-M003-D003"
    rule: "AceiteViagem.estado = CANCELADO quando SolicitacaoDiaria.estado = CANCELADA"
    description: "Cancelamento da solicitação propaga para todos os aceites."

enums:
  EstadoSolicitacaoDiaria:
    description: "Estado operacional de uma solicitação de diária."
    values:
      RASCUNHO: "Solicitação iniciada pelo coordenador mas ainda não enviada aos bolsistas."
      ATIVA: "Solicitação enviada. Aceites podem estar pendentes, aceitos ou recusados."
      CANCELADA: "Solicitação cancelada pelo coordenador. Todos os AceiteViagem viram CANCELADO automaticamente."

  EstadoAceiteViagem:
    description: "Estado do aceite da viagem pelo bolsista."
    values:
      AGUARDANDO_ACEITE: "Bolsista ainda não se manifestou."
      ACEITO: "Bolsista confirmou a viagem."
      NAO_ACEITO: "Bolsista recusou a viagem."
      CANCELADO: "Aceite cancelado por consequência do cancelamento da SolicitacaoDiaria."

workflows:
  SolicitacaoDiaria:
    description: "Ciclo de vida de uma solicitação de diária."
    states:
      - RASCUNHO
      - ATIVA
      - CANCELADA
    transitions:
      - from: RASCUNHO
        to: ATIVA
        trigger: "Coordenador envia a solicitação aos bolsistas."
      - from: RASCUNHO
        to: CANCELADA
        trigger: "Coordenador descarta o rascunho."
      - from: ATIVA
        to: CANCELADA
        trigger: "Coordenador cancela a solicitação. Propaga CANCELADO para todos os AceiteViagem."

  AceiteViagem:
    description: "Ciclo de vida do aceite de um bolsista."
    states:
      - AGUARDANDO_ACEITE
      - ACEITO
      - NAO_ACEITO
      - CANCELADO
    transitions:
      - from: AGUARDANDO_ACEITE
        to: ACEITO
        trigger: "Bolsista confirma a viagem."
      - from: AGUARDANDO_ACEITE
        to: NAO_ACEITO
        trigger: "Bolsista recusa a viagem."
      - from: AGUARDANDO_ACEITE
        to: CANCELADO
        trigger: "SolicitacaoDiaria é cancelada."
      - from: ACEITO
        to: CANCELADO
        trigger: "SolicitacaoDiaria é cancelada após aceite."

policies:
  permissions:
    Coordenador:
      can:
        - "criar SolicitacaoDiaria em RASCUNHO"
        - "enviar SolicitacaoDiaria (RASCUNHO → ATIVA)"
        - "cancelar SolicitacaoDiaria em RASCUNHO ou ATIVA"
    Bolsista:
      can:
        - "aceitar AceiteViagem (AGUARDANDO_ACEITE → ACEITO)"
        - "recusar AceiteViagem (AGUARDANDO_ACEITE → NAO_ACEITO)"
    Sistema:
      can:
        - "propagar CANCELADO para todos os AceiteViagem ao cancelar SolicitacaoDiaria"

events:
  - name: "AceiteViagemCriado"
    description: "Emitido quando um AceiteViagem é criado dentro de uma SolicitacaoDiaria. Dispara envio de notificação de diária para o bolsista correspondente."
    payload_entity: "post_award.iniciativas.diarias.AceiteViagem"
    trigger: "AceiteViagem criado com estado = AGUARDANDO_ACEITE"

agent_instructions:
  rules:
    - "Não criar entidades fora da ontologia."
    - "TipoDiaria pertence ao M008 — M003 apenas referencia por uuid."
    - "AlocacaoBolsista pertence ao M009 — M003 apenas referencia por uuid."
    - "AceiteViagem é entidade embarcada — não existe nem persiste fora da SolicitacaoDiaria."
    - "Cancelar SolicitacaoDiaria deve propagar CANCELADO para todos os AceiteViagem na mesma operação."
