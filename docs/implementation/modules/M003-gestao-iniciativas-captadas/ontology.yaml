ontology: "Gestão de Projetos Captados"
namespace: "post_award.iniciativas"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: shared.people
    path: path: "../../../ontology/shared/people.yaml"
  - namespace: corporativo.instituicoes
    path: path: "../M008-cadastros-corporativos/instituicoes/ontology.yaml"
  - namespace: corporativo.diarias
    path: path: "../M008-cadastros-corporativos/diarias/ontology.yaml"
  - namespace: corporativo.rubricas
    path: path: "../M008-cadastros-corporativos/rubricas/ontology.yaml"
  - namespace: pre_award.captacao
    path: path: "../M011-configuracao-captacao/ontology.yaml"
  - namespace: post_award.contratacao
    path: path: "../M022-contratacao-outorga/ontology.yaml"
metadata:
  module: "M003"
  source: "docs/implementation/modules/M003-gestao-iniciativas-captadas/modelo-estrutural.md"
  version: "1.0.0"
  description: "Gerencia projetos captados (projetos apoiados pela FAPES) desde a contratação até a conclusão, incluindo versões de plano, equipe, cronograma, orçamento e ciclo de fomento."

entities:

  Projeto:
    description: "Agregado central do módulo. Representa o item apoiado pela agência após a contratação — projeto de pesquisa, inovação, visita técnica ou outro tipo definido em TipoProjeto. Criada a partir de ContratacaoOutorga formalizada no M022."
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: string
        required: true
        unique: true
        description: "Código identificador gerado pelo sistema. Formato: PRJ-YYYY-NNN."
      titulo:
        type: string
        required: true
        max_length: 300
        description: "Título principal do projeto."
      resumo:
        type: string
        required: true
        max_length: 2000
        description: "Resumo descritivo do projeto contratado."
      restricoes:
        type: string
        required: false
        max_length: 2000
        description: "Restrições conhecidas para execução do projeto."
      viabilidadeTecnica:
        type: string
        required: false
        max_length: 2000
        description: "Análise ou justificativa da viabilidade técnica do projeto."
      tipo:
        type: "ref:post_award.iniciativas.TipoProjeto"
        required: false
        description: "Tipo do projeto. Obrigatório quando a captação exigir classificação por TipoProjeto (condicional via M011)."
      dataInicio:
        type: date
        required: true
        description: "Data prevista ou efetiva de início do projeto."
      dataFim:
        type: date
        required: false
        description: "Data prevista ou efetiva de encerramento do projeto."
      dataContratacao:
        type: date
        required: true
        description: "Data em que o projeto foi formalmente contratado."
      valorAprovado:
        type: decimal
        required: false
        description: "Valor financeiro aprovado para o projeto, quando aplicável."
      estado:
        type: "enum:EstadoIniciativa"
        required: true
        description: "Estado atual do projeto no ciclo operacional. Gerado pelo sistema."

  TipoProjeto:
    description: "Cadastro controlado dos tipos de projeto apoiados pela agência (ex.: Projeto de Pesquisa, Projeto de Inovação, Visita Técnica)."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        unique: true
        max_length: 150
        description: "Nome do tipo de projeto."
      descricao:
        type: string
        required: false
        max_length: 500
        description: "Descrição do tipo de projeto e sua finalidade."

  Ortogado:
    description: "Papel operacional assumido por uma PessoaFisica cadastrada no M008 que recebe a outorga de um projeto. Registra código, data da outorga e situação ativa."
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: string
        required: true
        unique: true
        description: "Código identificador gerado pelo sistema. Formato: ORT-YYYY-NNN."
      dataOutorga:
        type: date
        required: true
        description: "Data em que o projeto foi outorgado ao ortogado."
      ativo:
        type: boolean
        required: true
        description: "Indica se o ortogado está ativo para operações no projeto. Gerado/mantido pelo sistema."
      pessoaFisicaRef:
        type: uuid
        required: true
        description: "Referência à PessoaFisica do M008 que assume o papel de ortogado."

  VersaoPlanoIniciativa:
    description: "Versão do plano de execução de um projeto. Permite evoluir o plano sem apagar histórico; cada alteração em blocos configuráveis gera nova versão com justificativa."
    extends: "shared.Auditavel"
    fields:
      numero:
        type: integer
        required: true
        description: "Número sequencial da versão do plano por projeto. Obrigatório quando houver plano configurado."
      dataCriacao:
        type: date
        required: true
        description: "Data em que a versão do plano foi criada. Gerado pelo sistema."
      dataVigenciaInicio:
        type: date
        required: true
        description: "Data a partir da qual a versão do plano passa a valer."
      justificativa:
        type: string
        required: false
        max_length: 2000
        description: "Justificativa para criação ou alteração da versão do plano."
      estado:
        type: "enum:EstadoVersaoPlano"
        required: true
        description: "Estado atual da versão do plano. Gerado pelo sistema."

  Objetivo:
    description: "Objetivo geral ou específico de uma versão do plano do projeto. Condicional: obrigatório apenas quando a captação (M011) exigir objetivos."
    extends: "shared.Auditavel"
    fields:
      descricao:
        type: string
        required: true
        max_length: 1000
        description: "Texto do objetivo declarado para o projeto."
      tipo:
        type: "enum:TipoObjetivo"
        required: true
        description: "Tipo do objetivo: GERAL ou ESPECIFICO."
      percentualImportancia:
        type: decimal
        required: false
        description: "Percentual de importância do objetivo específico em relação aos demais específicos (0 a 100). Aplicável somente a objetivos ESPECIFICO."

  Resultado:
    description: "Entrega esperada do projeto. Condicional: obrigatório apenas quando a captação (M011) exigir resultados."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        max_length: 200
        description: "Nome do resultado esperado do projeto."
      descricao:
        type: string
        required: true
        max_length: 1000
        description: "Descrição do resultado esperado."
      tipo:
        type: "ref:post_award.iniciativas.TipoResultado"
        required: false
        description: "Classificação do resultado. Obrigatório quando a captação exigir classificação do resultado."
      beneficiosEsperados:
        type: "list:ref:post_award.iniciativas.Beneficio"
        required: false
        description: "Benefícios esperados que este resultado deve gerar — sociais, econômicos, ambientais, tecnológicos ou científicos."
      indicadores:
        type: "list:ref:post_award.iniciativas.IndicadorBeneficio"
        required: false
        description: "Indicadores de medição que verificam se este resultado foi alcançado. Compartilham a mesma estrutura dos indicadores de benefício."

  TipoResultado:
    description: "Cadastro controlado dos tipos de resultado (ex.: Serviço, Processo, Produto)."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        unique: true
        max_length: 150
        description: "Nome do tipo de resultado."
      descricao:
        type: string
        required: false
        max_length: 500
        description: "Descrição do tipo de resultado e sua finalidade."

  Risco:
    description: "Risco identificado para a execução do projeto, vinculado a uma versão do plano. Condicional: obrigatório apenas quando a captação (M011) exigir matriz de riscos."
    extends: "shared.Auditavel"
    fields:
      descricao:
        type: string
        required: true
        max_length: 1000
        description: "Descrição do risco identificado."
      impacto:
        type: "ref:post_award.iniciativas.NivelRisco"
        required: false
        description: "Nível de impacto previsto caso o risco ocorra. Obrigatório quando a captação exigir impacto."
      probabilidade:
        type: "ref:post_award.iniciativas.NivelRisco"
        required: false
        description: "Nível de probabilidade estimada de ocorrência. Obrigatório quando a captação exigir probabilidade."
      planoMitigacao:
        type: string
        required: false
        max_length: 1000
        description: "Plano de mitigação ou resposta ao risco."

  NivelRisco:
    description: "Cadastro controlado dos níveis de risco usados para impacto e probabilidade (ex.: Pequeno, Médio, Grande). A mesma classe serve impacto e probabilidade."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        unique: true
        max_length: 100
        description: "Nome do nível de risco."
      descricao:
        type: string
        required: false
        max_length: 500
        description: "Descrição do nível e seus critérios de enquadramento."

  Beneficio:
    description: "Ganho esperado ou gerado pelo projeto. Condicional: obrigatório apenas quando a captação (M011) exigir benefícios."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        max_length: 200
        description: "Nome do benefício esperado ou gerado pelo projeto."
      descricao:
        type: string
        required: true
        max_length: 1000
        description: "Descrição do benefício esperado ou gerado."
      publicoBeneficiado:
        type: string
        required: false
        max_length: 300
        description: "Público, instituição ou grupo beneficiado."

  IndicadorBeneficio:
    description: "Indicador de medição de um benefício do projeto. Condicional: obrigatório apenas quando a captação (M011) exigir indicadores."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        max_length: 200
        description: "Nome do indicador usado para medir o benefício."
      descricao:
        type: string
        required: false
        max_length: 1000
        description: "Descrição do que o indicador mede."
      unidadeMedida:
        type: string
        required: true
        max_length: 50
        description: "Unidade usada na medição do indicador."
      valorBase:
        type: decimal
        required: false
        description: "Valor de referência antes do projeto ou no início da medição."
      valorMeta:
        type: decimal
        required: true
        description: "Valor esperado para demonstrar o alcance do benefício."
      periodicidadeMedicao:
        type: string
        required: false
        max_length: 50
        description: "Frequência de medição do indicador (ex.: Mensal, Trimestral, Anual, Final)."
      fonteVerificacao:
        type: string
        required: false
        max_length: 300
        description: "Fonte dos dados usados para verificar o indicador."

  OrcamentoPlanejado:
    description: "Previsão aprovada de recursos necessários para implementar o projeto. Pertence a uma VersaoPlanoIniciativa. Condicional: obrigatório apenas quando a captação exigir orçamento."
    extends: "shared.Auditavel"
    fields:
      valorTotal:
        type: decimal
        required: true
        description: "Valor total planejado para o projeto."
      valorBolsas:
        type: decimal
        required: false
        description: "Valor planejado para bolsas."
      valorCapital:
        type: decimal
        required: false
        description: "Valor planejado para capital."

  ItemOrcamento:
    description: "Item de orçamento planejado em nível inicial dentro de um OrcamentoPlanejado. Deve estar associado a uma RubricaOrcamentaria."
    extends: "shared.Auditavel"
    fields:
      descricao:
        type: string
        required: true
        max_length: 500
        description: "Descrição do item orçamentário planejado."
      valorPrevisto:
        type: decimal
        required: true
        description: "Valor previsto para o item orçamentário."
      rubricaRef:
        type: uuid
        required: true
        description: "Referência à RubricaOrcamentaria do M008 associada ao item."

  OrcamentoExecutado:
    description: "Visão consolidada da execução financeira do projeto. Calculado a partir dos LancamentoExecucao; o total executado não é sobrescrito manualmente."
    extends: "shared.Auditavel"
    fields:
      valorExecutadoTotal:
        type: decimal
        required: true
        description: "Valor total executado consolidado a partir dos lançamentos. Gerado pelo sistema."
      valorExecutadoBolsas:
        type: decimal
        required: true
        description: "Valor executado consolidado em rubricas de bolsa. Gerado pelo sistema."
      valorExecutadoCapital:
        type: decimal
        required: true
        description: "Valor executado consolidado em rubricas de capital. Gerado pelo sistema."
      dataAtualizacao:
        type: date
        required: true
        description: "Data da última atualização da visão consolidada de execução. Gerado pelo sistema."

  LancamentoExecucao:
    description: "Lançamento de execução financeira do projeto. Preserva histórico de movimentos. Todo lançamento deve estar associado a uma RubricaOrcamentaria."
    extends: "shared.Auditavel"
    fields:
      data:
        type: date
        required: true
        description: "Data do lançamento de execução financeira."
      descricao:
        type: string
        required: true
        max_length: 500
        description: "Descrição do movimento financeiro executado."
      valor:
        type: decimal
        required: true
        description: "Valor do lançamento financeiro. Deve ser maior que zero."
      tipo:
        type: "enum:TipoLancamentoExecucao"
        required: true
        description: "Tipo do lançamento de execução."
      origem:
        type: string
        required: false
        max_length: 200
        description: "Origem do lançamento (ex.: Prestacao de contas, extrato bancario, importacao). Formato: ModuloOrigem:Entidade:ID."
      rubricaRef:
        type: uuid
        required: true
        description: "Referência à RubricaOrcamentaria associada ao lançamento."

  SolicitacaoAlteracaoRubrica:
    description: "Solicitação do Ortogado para incluir ou retirar uma rubrica orçamentária do projeto. Não altera automaticamente o OrcamentoPlanejado; passa por análise e, quando aprovada, gera nova VersaoPlanoIniciativa."
    extends: "shared.Auditavel"
    fields:
      dataSolicitacao:
        type: date
        required: true
        description: "Data em que o ortogado solicitou a alteração. Gerado pelo sistema."
      tipoAlteracao:
        type: "enum:TipoAlteracaoRubrica"
        required: true
        description: "Tipo de alteração solicitada: INCLUSAO ou RETIRADA."
      justificativa:
        type: string
        required: true
        max_length: 2000
        description: "Justificativa apresentada pelo ortogado para a alteração."
      estado:
        type: "enum:EstadoSolicitacaoRubrica"
        required: true
        description: "Estado atual da solicitação. Gerado/mantido pelo sistema."
      rubricaRef:
        type: uuid
        required: true
        description: "Referência à RubricaOrcamentaria do M008 a ser incluída ou retirada."

  PapelEquipe:
    description: "Papel planejado para a equipe de um projeto. Define o papel esperado, a quantidade prevista de pessoas e os resultados pelos quais este papel é responsável. Condicional: obrigatório quando a captação exigir equipe."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        max_length: 150
        description: "Nome do papel planejado para a equipe do projeto."
      descricao:
        type: string
        required: false
        max_length: 500
        description: "Descrição das responsabilidades esperadas para o papel."
      quantidadePrevista:
        type: integer
        required: false
        description: "Quantidade prevista de pessoas para este papel. Obrigatório quando a captação definir quantidade por papel."
      resultadosResponsaveis:
        type: "list:ref:post_award.iniciativas.Resultado"
        required: false
        description: "Resultados pelos quais este papel é responsável por entregar. Um papel pode ser responsável por um ou mais resultados do projeto."

  MembroEquipe:
    description: "Associação entre uma PessoaFisica (M008) e um PapelEquipe planejado na versão do plano. Preenche a necessidade definida em PapelEquipe com pessoas reais."
    extends: "shared.Auditavel"
    fields:
      dataInicio:
        type: date
        required: false
        description: "Data de início da participação da pessoa na equipe."
      dataFim:
        type: date
        required: false
        description: "Data de encerramento da participação na equipe."
      ativo:
        type: boolean
        required: true
        description: "Indica se o membro está ativo na equipe. Gerado/mantido pelo sistema."
      pessoaFisicaRef:
        type: uuid
        required: true
        description: "Referência à PessoaFisica do M008 que compõe o papel planejado."

  AtividadeCronograma:
    description: "Atividade planejada no cronograma de uma versão do plano do projeto. Vincula período de execução, resultados a entregar e papéis executores. Condicional: obrigatório quando a captação exigir cronograma."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: string
        required: true
        max_length: 200
        description: "Nome da atividade planejada no cronograma."
      descricao:
        type: string
        required: true
        max_length: 500
        description: "Descrição da atividade planejada."
      dataInicio:
        type: date
        required: false
        description: "Data prevista ou efetiva de início da atividade. Obrigatório quando o cronograma exigir datas."
      dataFim:
        type: date
        required: false
        description: "Data prevista ou efetiva de encerramento da atividade. Obrigatório quando o cronograma exigir datas."
      estado:
        type: "enum:EstadoAtividadeCronograma"
        required: true
        description: "Estado atual da atividade do cronograma. Gerado/mantido pelo sistema."
      resultados:
        type: "list:ref:post_award.iniciativas.Resultado"
        required: false
        description: "Um ou mais resultados do projeto a que esta atividade contribui. Permite rastrear quais atividades constroem cada resultado."
      papeis:
        type: "list:ref:post_award.iniciativas.PapelEquipe"
        required: false
        description: "Um ou mais papéis da equipe responsáveis por executar esta atividade."

  EstagioCicloFomento:
    description: "Read model de timeline transversal do projeto, desde a submissão até a conclusão, suspensão ou cancelamento. Cada módulo dono registra seus próprios marcos sem transferir ownership. Deve aparecer no máximo uma vez por marco por projeto."
    extends: "shared.Auditavel"
    fields:
      ordem:
        type: integer
        required: true
        description: "Posição do estágio na timeline do projeto. Sequência iniciando em 1. Único por projeto."
      fase:
        type: "enum:FaseCicloFomento"
        required: true
        description: "Macrofase do ciclo de fomento: PRE_AWARD, AWARD ou POST_AWARD."
      marco:
        type: "enum:MarcoCicloFomento"
        required: true
        description: "Marco específico exibido na timeline. Único por projeto."
      estado:
        type: "enum:EstadoEstagioCiclo"
        required: true
        description: "Estado atual do marco na timeline. Gerado/mantido pelo sistema."
      dataPrevistaInicio:
        type: date
        required: false
        description: "Data planejada para início do marco, quando houver cronograma."
      dataPrevistaFim:
        type: date
        required: false
        description: "Data planejada para conclusão do marco, quando houver cronograma."
      dataInicio:
        type: date
        required: false
        description: "Data efetiva em que o marco foi iniciado ou atingido."
      dataFim:
        type: date
        required: false
        description: "Data efetiva em que o marco foi concluído."
      moduloOrigem:
        type: string
        required: true
        max_length: 20
        description: "Módulo dono do evento que originou o marco (ex.: M011, M022, M003, M014, M015)."
      referenciaOrigemId:
        type: string
        required: false
        max_length: 100
        description: "Identificador do objeto dono no módulo de origem (ex.: propostaId, termoOutorgaId)."
      observacao:
        type: string
        required: false
        max_length: 1000
        description: "Detalhe opcional para exibição ou auditoria do marco."

relationships:
  - from: "post_award.iniciativas.Iniciativa"
    relation: "classificada por"
    to: "post_award.iniciativas.TipoProjeto"
    cardinality: "N:1"
    optional: true
    note: "Condicional: apenas quando a captação exigir classificação por tipo."

  - from: "post_award.iniciativas.Iniciativa"
    relation: "outorgada a"
    to: "post_award.iniciativas.Ortogado"
    cardinality: "N:1"

  - from: "post_award.iniciativas.Iniciativa"
    relation: "possui versões do plano"
    to: "post_award.iniciativas.VersaoPlanoIniciativa"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.Iniciativa"
    relation: "possui estágios de ciclo"
    to: "post_award.iniciativas.EstagioCicloFomento"
    cardinality: "1:N"

  - from: "post_award.iniciativas.Iniciativa"
    relation: "possui orçamento executado"
    to: "post_award.iniciativas.OrcamentoExecutado"
    cardinality: "1:1"

  - from: "post_award.iniciativas.Iniciativa"
    relation: "possui solicitações de alteração de rubrica"
    to: "post_award.iniciativas.SolicitacaoAlteracaoRubrica"
    cardinality: "1:N"

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui objetivo geral"
    to: "post_award.iniciativas.Objetivo"
    cardinality: "1:1"
    optional: true
    note: "Condicional: somente quando captação exigir objetivos."

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui objetivos específicos"
    to: "post_award.iniciativas.Objetivo"
    cardinality: "1:N"
    optional: true
    note: "Condicional: somente quando captação exigir objetivos."

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui resultados"
    to: "post_award.iniciativas.Resultado"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui riscos"
    to: "post_award.iniciativas.Risco"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui benefícios"
    to: "post_award.iniciativas.Beneficio"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui orçamento planejado"
    to: "post_award.iniciativas.OrcamentoPlanejado"
    cardinality: "1:1"
    optional: true
    note: "Condicional: somente quando captação exigir orçamento."

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "possui cronograma"
    to: "post_award.iniciativas.AtividadeCronograma"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.VersaoPlanoIniciativa"
    relation: "define papéis de equipe"
    to: "post_award.iniciativas.PapelEquipe"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.Objetivo"
    relation: "associado a resultados"
    to: "post_award.iniciativas.Resultado"
    cardinality: "1:N"
    optional: true

  - from: "post_award.iniciativas.Resultado"
    relation: "classificado por"
    to: "post_award.iniciativas.TipoResultado"
    cardinality: "N:1"
    optional: true

  - from: "post_award.iniciativas.Risco"
    relation: "ameaça"
