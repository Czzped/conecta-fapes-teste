axioms:
  - id: "AX-M003-001"
    natural_language: "Um Projeto só pode ser criado a partir de uma ContratacaoOutorga com estado FORMALIZADA no M022."
    formal_rule: "∀i ∈ Projeto: ∃c ∈ post_award.contratacao.ContratacaoOutorga: c.estado = FORMALIZADA ∧ i.origemContratacao = c.id"

  - id: "AX-M003-002"
    natural_language: "Apenas uma versão do plano pode estar com estado VIGENTE por projeto em qualquer momento."
    formal_rule: "∀i ∈ Projeto: |{v ∈ i.versoesPlano | v.estado = VIGENTE}| ≤ 1"

  - id: "AX-M003-003"
    natural_language: "Alterações em blocos configuráveis (resultados, cronograma, objetivos, riscos, benefícios, orçamento ou papéis planejados) devem gerar nova VersaoPlanoIniciativa quando esses blocos existirem."
    formal_rule: "∀i ∈ Projeto: CHANGE(i.versoesPlano[VIGENTE].{objetivos, resultados, riscos, beneficios, orcamento, papeis, cronograma}) → NEW(VersaoPlanoIniciativa)"

  - id: "AX-M003-004"
    natural_language: "Apenas um EstagioCicloFomento por projeto pode estar com estado ATUAL em qualquer momento."
    formal_rule: "∀i ∈ Projeto: |{e ∈ i.estagios | e.estado = ATUAL}| ≤ 1"

  - id: "AX-M003-005"
    natural_language: "Cada marco do EstagioCicloFomento deve aparecer no máximo uma vez por projeto."
    formal_rule: "∀i ∈ Projeto: ∀m ∈ MarcoCicloFomento: |{e ∈ i.estagios | e.marco = m}| ≤ 1"

  - id: "AX-M003-006"
    natural_language: "Um projeto não pode possuir simultaneamente os marcos CONCLUIDO e CANCELADA ambos com estado CONCLUIDO."
    formal_rule: "∀i ∈ Projeto: ¬(∃e1, e2 ∈ i.estagios: e1.marco = CONCLUIDO ∧ e2.marco = CANCELADA ∧ e1.estado = CONCLUIDO ∧ e2.estado = CONCLUIDO)"

  - id: "AX-M003-007"
    natural_language: "Todo LancamentoExecucao deve estar associado a uma RubricaOrcamentaria."
    formal_rule: "∀l ∈ LancamentoExecucao: l.rubricaRef ≠ null"

  - id: "AX-M003-008"
    natural_language: "O valor executado consolidado considera lançamentos EXECUCAO e DEBITO, deduz CREDITO e ESTORNO, e preserva COMPROMETIMENTO e RENDIMENTO como movimentos identificáveis."
    formal_rule: "OrcamentoExecutado.valorExecutadoTotal = SUM(l.valor | l.tipo ∈ {EXECUCAO, DEBITO}) − SUM(l.valor | l.tipo ∈ {CREDITO, ESTORNO})"

  - id: "AX-M003-009"
    natural_language: "Somente o Ortogado ativo do projeto pode solicitar inclusão ou retirada de rubrica orçamentária."
    formal_rule: "∀s ∈ SolicitacaoAlteracaoRubrica: s.ortogado.ativo = true ∧ s.ortogado ∈ s.projeto.ortogados"

  - id: "AX-M003-010"
    natural_language: "Aprovação de solicitação de alteração de rubrica deve gerar nova VersaoPlanoIniciativa."
    formal_rule: "∀s ∈ SolicitacaoAlteracaoRubrica: s.estado = APROVADA → NEW(VersaoPlanoIniciativa)"

  - id: "AX-M003-011"
    natural_language: "Retirada de rubrica deve ser bloqueada quando houver lançamento de execução impeditivo para a rubrica."
    formal_rule: "∀s ∈ SolicitacaoAlteracaoRubrica: s.tipoAlteracao = RETIRADA ∧ ∃l ∈ LancamentoExecucao: l.rubricaRef = s.rubricaRef ∧ l.tipo ∈ {COMPROMETIMENTO, EXECUCAO, DEBITO} → BLOCKED(s)"

  - id: "AX-M003-012"
    natural_language: "Quando a captação definir quantidade prevista por papel de equipe, o número de membros vinculados não deve exceder a quantidade prevista."
    formal_rule: "∀p ∈ PapelEquipe: p.quantidadePrevista ≠ null → |p.membros| ≤ p.quantidadePrevista"

invariants:
  - id: "INV-M003-001"
    rule: "EstagioCicloFomento.dataFim ≥ EstagioCicloFomento.dataInicio when both non-null"
    description: "Data de fim de um estágio não pode ser anterior à data de início quando ambas existirem."

  - id: "INV-M003-002"
    rule: "EstagioCicloFomento.estado = CONCLUIDO → (dataInicio ≠ null ∨ dataFim ≠ null)"
    description: "Estágio com estado CONCLUIDO deve possuir dataInicio ou dataFim."

  - id: "INV-M003-003"
    rule: "VersaoPlanoIniciativa.numero unique per Projeto"
    description: "O número da versão do plano deve ser único por projeto."

  - id: "INV-M003-004"
    rule: "EstagioCicloFomento.ordem unique per Projeto"
    description: "A ordem do estágio deve ser única por projeto."

  - id: "INV-M003-005"
    rule: "LancamentoExecucao.valor > 0"
    description: "O valor do lançamento de execução deve ser maior que zero."

  - id: "INV-M003-006"
    rule: "Objetivo.percentualImportancia ∈ [0, 100] when non-null"
    description: "O percentual de importância do objetivo específico deve estar entre 0 e 100."

  - id: "INV-M003-007"
    rule: "Projeto.dataFim ≥ Projeto.dataInicio when both non-null"
    description: "A data de fim do projeto não pode ser anterior à data de início."

enums:
  EstadoIniciativa:
    description: "Estado operacional do projeto no ciclo de execução."
    values:
      CONTRATADA: "Projeto formalmente contratado, ainda não em execução."
      EM_EXECUCAO: "Projeto em execução ativa."
      SUSPENSA: "Projeto com execução temporariamente suspensa."
      CONCLUIDA: "Projeto concluído com todas as obrigações cumpridas."
      CANCELADA: "Projeto cancelado em qualquer fase do ciclo."

  EstadoVersaoPlano:
    description: "Estado do ciclo de vida de uma versão do plano do projeto."
    values:
      RASCUNHO: "Versão em elaboração, não vigente."
      VIGENTE: "Versão atualmente válida para o projeto."
      SUBSTITUIDA: "Versão substituída por uma versão mais recente."
      CANCELADA: "Versão cancelada sem ter entrado em vigor."

  TipoObjetivo:
    description: "Classificação do objetivo do projeto."
    values:
      GERAL: "Objetivo geral do projeto."
      ESPECIFICO: "Objetivo específico, podendo ter percentual de importância."

  TipoAlteracaoRubrica:
    description: "Tipo de alteração solicitada para uma rubrica orçamentária."
    values:
      INCLUSAO: "Solicitação de inclusão de nova rubrica no plano."
      RETIRADA: "Solicitação de retirada de rubrica existente do plano."

  EstadoSolicitacaoRubrica:
    description: "Estado do ciclo de vida de uma solicitação de alteração de rubrica."
    values:
      SOLICITADA: "Solicitação registrada, aguardando análise."
      EM_ANALISE: "Solicitação em análise pela equipe responsável."
      APROVADA: "Solicitação aprovada; deve gerar nova VersaoPlanoIniciativa."
      REJEITADA: "Solicitação rejeitada."
      CANCELADA: "Solicitação cancelada pelo ortogado."

  EstadoAtividadeCronograma:
    description: "Estado de execução de uma atividade do cronograma."
    values:
      PREVISTA: "Atividade planejada, ainda não iniciada."
      EM_EXECUCAO: "Atividade em andamento."
      CONCLUIDA: "Atividade concluída."
      CANCELADA: "Atividade cancelada."

  FaseCicloFomento:
    description: "Macrofase do ciclo de fomento de um projeto."
    values:
      PRE_AWARD: "Fase anterior à contratação (submissão, avaliação)."
      AWARD: "Fase de contratação e outorga."
      POST_AWARD: "Fase de execução, acompanhamento e encerramento."

  MarcoCicloFomento:
    description: "Marco específico exibido na timeline transversal do projeto."
    values:
      SUBMISSAO: "Proposta submetida pelo pesquisador."
      AVALIACAO_DOCUMENTOS: "Documentação em avaliação."
      AVALIACAO_AD_HOC: "Avaliação técnica ad hoc."
      EM_CONTRATACAO: "Processo de contratação em andamento."
      CONTRATADO: "Projeto formalmente contratado."
      EM_EXECUCAO: "Projeto em execução."
      SUSPENSA: "Execução suspensa temporariamente."
      EM_APROVACAO_CONTAS: "Prestação de contas em análise."
      CONCLUIDO: "Projeto concluído."
      CANCELADA: "Projeto cancelado."

  EstadoEstagioCiclo:
    description: "Estado atual de um estágio na timeline de ciclo de fomento."
    values:
      PENDENTE: "Estágio ainda não atingido."
      ATUAL: "Estágio em andamento no momento presente."
      CONCLUIDO: "Estágio concluído."
      CANCELADO: "Estágio cancelado."

  TipoLancamentoExecucao:
    description: "Tipo do lançamento de execução financeira do projeto."
    values:
      COMPROMETIMENTO: "Saldo comprometido/alocado mas não executado."
      CREDITO: "Crédito ou reversão de valor."
      DEBITO: "Débito direto na rubrica."
      EXECUCAO: "Execução financeira efetiva."
      ESTORNO: "Estorno de lançamento anterior."
      RENDIMENTO: "Rendimento financeiro gerado."

value_objects: {}

events:
  - name: "ProjetoCriado"
    description: "Emitido quando um Projeto é criado a partir de ContratacaoOutorga formalizada no M022."
    payload_entity: "post_award.iniciativas.Projeto"
    trigger: "post_award.contratacao.ContratacaoOutorga.FORMALIZADA"

  - name: "VersaoPlanoAtivada"
    description: "Emitido quando uma nova VersaoPlanoIniciativa passa para estado VIGENTE, substituindo a anterior."
    payload_entity: "post_award.iniciativas.VersaoPlanoIniciativa"
    trigger: "VersaoPlanoIniciativa.estado → VIGENTE"

  - name: "EstagioCicloAvancado"
    description: "Emitido quando um EstagioCicloFomento passa para estado ATUAL ou CONCLUIDO."
    payload_entity: "post_award.iniciativas.EstagioCicloFomento"
    trigger: "EstagioCicloFomento.estado ∈ {ATUAL, CONCLUIDO}"

  - name: "SolicitacaoRubricaAprovada"
    description: "Emitido quando uma SolicitacaoAlteracaoRubrica é aprovada, disparando geração de nova VersaoPlanoIniciativa."
    payload_entity: "post_award.iniciativas.SolicitacaoAlteracaoRubrica"
    trigger: "SolicitacaoAlteracaoRubrica.estado → APROVADA"

workflows:
  Projeto:
    description: "Ciclo de vida operacional de um Projeto."
    states:
      - CONTRATADA
      - EM_EXECUCAO
      - SUSPENSA
      - CONCLUIDA
      - CANCELADA
    transitions:
      - from: CONTRATADA
        to: EM_EXECUCAO
        trigger: "Início formal da execução registrado pelo M003 ou M022."
      - from: EM_EXECUCAO
        to: SUSPENSA
        trigger: "Suspensão registrada pelo M015."
      - from: SUSPENSA
        to: EM_EXECUCAO
        trigger: "Reativação registrada pelo M015."
      - from: EM_EXECUCAO
        to: CONCLUIDA
        trigger: "Conclusão após aprovação de contas pelo M014/M015."
      - from: SUSPENSA
        to: CONCLUIDA
        trigger: "Conclusão de projeto suspenso via M015."
      - from: CONTRATADA
        to: CANCELADA
        trigger: "Cancelamento registrado pelo módulo responsável."
      - from: EM_EXECUCAO
        to: CANCELADA
        trigger: "Cancelamento registrado pelo módulo responsável."
      - from: SUSPENSA
        to: CANCELADA
        trigger: "Cancelamento registrado pelo módulo responsável."

  VersaoPlanoIniciativa:
    description: "Ciclo de vida de uma versão do plano do projeto."
    states:
      - RASCUNHO
      - VIGENTE
      - SUBSTITUIDA
      - CANCELADA
    transitions:
      - from: RASCUNHO
        to: VIGENTE
        trigger: "Ativação da versão do plano."
      - from: VIGENTE
        to: SUBSTITUIDA
        trigger: "Nova versão do plano ativada."
      - from: RASCUNHO
        to: CANCELADA
        trigger: "Cancelamento antes de entrar em vigor."

  SolicitacaoAlteracaoRubrica:
    description: "Fluxo de análise de uma solicitação de alteração de rubrica."
    states:
      - SOLICITADA
      - EM_ANALISE
      - APROVADA
      - REJEITADA
      - CANCELADA
    transitions:
      - from: SOLICITADA
        to: EM_ANALISE
        trigger: "Analista inicia avaliação da solicitação."
      - from: EM_ANALISE
        to: APROVADA
        trigger: "Analista aprova; gera nova VersaoPlanoIniciativa."
      - from: EM_ANALISE
        to: REJEITADA
        trigger: "Analista rejeita a solicitação."
      - from: SOLICITADA
        to: CANCELADA
        trigger: "Ortogado cancela antes do início da análise."

policies:
  permissions:
    Coordenador:
      can:
        - "criar SolicitacaoDiaria para bolsistas do projeto"
        - "remover SolicitacaoDiaria ALOCADA ou APROVADA antes da dataHoraPartida com justificativa"
        - "solicitar inclusão ou retirada de rubrica (SolicitacaoAlteracaoRubrica)"
        - "editar VersaoPlanoIniciativa em estado RASCUNHO"
    FAPES:
      can:
        - "analisar e aprovar/rejeitar SolicitacaoAlteracaoRubrica"
        - "registrar EstagioCicloFomento"
        - "criar TipoProjeto, TipoResultado, NivelRisco"
    Sistema:
      can:
        - "gerar código de Projeto e Ortogado"
        - "calcular OrcamentoExecutado a partir de LancamentoExecucao"
        - "avançar EstagioCicloFomento conforme eventos de outros módulos"

agent_instructions:
  rules:
    - "Não criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementação deve seguir workflows definidos."
    - "Projeto é criado exclusivamente a partir de ContratacaoOutorga formalizada no M022."
    - "A obrigatoriedade dos blocos (objetivos, resultados, riscos, benefícios, equipe, cronograma, orçamento) é condicional à configuração da captação no M011 — nunca fixar obrigatoriedade no M003."
    - "Alterações em qualquer bloco configurável de VersaoPlanoIniciativa VIGENTE devem gerar nova versão com justificativa."
    - "OrcamentoExecutado é sempre calculado a partir de LancamentoExecucao — nunca atualizado manualmente."
    - "EstagioCicloFomento é read model de timeline; M003 não é o único dono dos marcos — M011, M022, M014 e M015 registram seus próprios marcos."
    - "SolicitacaoDiaria é gerenciada pelo submódulo diarias.yaml (post_award.iniciativas.diarias)."
    - "Aditivos de vigência e financeiros são gerenciados pelo submódulo aditivos.yaml (post_award.iniciativas.aditivos)."
    - "Consumers de M003: M009 (bolsista), M012 (acompanhamento), M013 (orcamentaria), M014 (prestacao contas), M022 (contratacao)."
  notes:
    - "TipoProjeto, TipoResultado e NivelRisco são cadastros controlados pela FAPES."
    - "Abrangencia, TipoDiaria e ParametroCalculoDiaria são entidades do M008 — não modelar no M003."
    - "AlocacaoBolsista pertence ao M009 — M003 referencia apenas por ID."
    - "RubricaOrcamentaria é referenciada do M008/M013 — M003 armazena apenas a referência (uuid)."
    - "PessoaFisica é gerenciada pelo M008 — M003 referencia por pessoaFisicaRef (uuid)."
