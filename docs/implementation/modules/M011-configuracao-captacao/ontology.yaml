  - from: "pre_award.captacao.DocumentoExigido"
    relation: "formatos permitidos"
    to: "pre_award.captacao.FormatoArquivo"
    cardinality: "N:N"

axioms:
  - id: "AX-M011-001"
    natural_language: "O cronograma deve conter os periodos obrigatorios antes da publicacao. Quando exigeAprovacaoInstitucional = true, a assinatura do ResponsavelInstitucional deve ocorrer dentro do periodo RECEBIMENTO_PROPOSTAS — nao ha periodo separado para aprovacao institucional."
    formal_rule: "Captacao.estadoConfiguracao = PUBLICADO → periodosObrigatorios ⊆ CronogramaCaptacao.periodos ∧ (exigeAprovacaoInstitucional = true → assinaturaInstitucional.data <= RECEBIMENTO_PROPOSTAS.dataFim)"
  - id: "AX-M011-002"
    natural_language: "Um AporteFomento deve referenciar exatamente uma origem: Programa quando origemTipo = PROGRAMA, Parceria quando origemTipo = PARCERIA."
    formal_rule: "(origemTipo = PROGRAMA → programa ≠ null ∧ parceria = null) ∧ (origemTipo = PARCERIA → parceria ≠ null ∧ programa = null)"
  - id: "AX-M011-003"
    natural_language: "A soma dos valorAportado das FaixasInvestimento nao deve ultrapassar a soma dos valorAportado de todos os AporteFomento do fomento."
    formal_rule: "∑FaixaInvestimento.valorAportado ≤ ∑AporteFomento.valorAportado"
  - id: "AX-M011-004"
    natural_language: "Quando tipoCaptacao = DEMANDA_INDUZIDA, o campo outorgadoDestinatario deve ser preenchido."
    formal_rule: "Captacao.tipoCaptacao = DEMANDA_INDUZIDA → Captacao.outorgadoDestinatario ≠ null"
  - id: "AX-M011-005"
    natural_language: "ProponenteEscolhido e usado somente quando RegraSubmissao.submissaoRestritaAEscolhidos = true."
    formal_rule: "∃ProponenteEscolhido → RegraSubmissao.submissaoRestritaAEscolhidos = true"
  - id: "AX-M011-006"
    natural_language: "ProponenteEscolhido deve apontar para exatamente uma Instituicao ou PessoaFisica, nunca ambas ou nenhuma."
    formal_rule: "(tipo = INSTITUICAO → instituicao ≠ null ∧ pessoa = null) ∧ (tipo = PESSOA → pessoa ≠ null ∧ instituicao = null)"
  - id: "AX-M011-007"
    natural_language: "Um adiamento desloca todas as etapas posteriores pelo mesmo numero de dias."
    formal_rule: "∀p_i: adiado → ∀p_j onde ordem(p_j) > ordem(p_i): p_j.dataInicio += dias ∧ p_j.dataFim += dias"
  - id: "AX-M011-008"
    natural_language: "RubricaPermitidaFaixa que representa subrubrica deve ter rubricaPai preenchido; rubrica raiz tem rubricaPai nulo."
    formal_rule: "(rubricaPai ≠ null → rubricaPai.permiteSubrubricas = true) ∧ (rubricaPai = null → registro e raiz)"
  - id: "AX-M011-009"
    natural_language: "BolsaPermitidaFaixa so pode ser configurada quando a RubricaPermitidaFaixa referenciada for do tipo Bolsa."
    formal_rule: "BolsaPermitidaFaixa.rubricaPermitida → corporativo.rubricas.Rubrica.tipo = BOLSA"
  - id: "AX-M011-010"
    natural_language: "FaixaInvestimento.valorMaximo deve ser maior ou igual ao valorMinimo."
    formal_rule: "FaixaInvestimento.valorMaximo >= FaixaInvestimento.valorMinimo"
  - id: "AX-M011-011"
    natural_language: "Quando a RubricaPermitidaFaixa configurada for DOACI (RUB-DOACI), o campo limitePercentual representa o teto imposto pelo edital e nunca pode exceder o percentual maximo da tabela normativa da Resolucao CCAF no 309/2022, item 2.4.8.1, para o valorMaximo da faixa. Se omitido, o M013 aplica a tabela normativa diretamente."
    formal_rule: "RubricaPermitidaFaixa.rubrica = RUB-DOACI → (limitePercentual = null ∨ limitePercentual ≤ tabelaDOACI(FaixaInvestimento.valorMaximo))"
  - id: "AX-M011-012"
    natural_language: "Uma Captacao somente pode ser criada a partir de um Fomento com estado APROVADO."
    formal_rule: "Captacao.fomento → Fomento.estado = APROVADO"
  - id: "AX-M011-032"
    natural_language: "Enquanto a Captacao estiver no estado PAUSADO, nenhuma operacao do processo de selecao pode ser executada: proponentes nao podem submeter nem solicitar revisao, revisores ad hoc nao podem registrar parecer, e o AnalistaTecnico nao pode avancar etapas do cronograma. O contador de dias dos periodos do cronograma nao avanca automaticamente durante a pausa — a responsabilidade de aditamento do cronograma caso necessario e do GestorFAPES ao retomar."
    formal_rule: "Captacao.estadoConfiguracao = PAUSADO → operacoesSelecao.bloqueadas = true ∧ cronograma.avancaAutomatico = false"
  - id: "AX-M011-034"
    natural_language: "Uma Captacao pode ser encerrada de tres formas: (1) encerramento normal — AnalistaTecnico aciona apos publicar o resultado final; (2) expiração automatica — Sistema encerra quando RESULTADO_FINAL.dataFim e atingida sem publicacao manual; (3) cancelamento administrativo — GestorFAPES cancela a partir de PUBLICADO ou PAUSADO com justificativa obrigatoria. Em qualquer caso, o estado final e ENCERRADO e nenhuma nova operacao de selecao e permitida."
    formal_rule: "Captacao.estadoConfiguracao = ENCERRADO ← (trigger = encerrar ∧ actor = AnalistaTecnico ∧ RESULTADO_FINAL.publicado = true) ∨ (trigger = expirar ∧ actor = Sistema ∧ hoje >= RESULTADO_FINAL.dataFim) ∨ (trigger = cancelar ∧ actor = GestorFAPES ∧ justificativa ≠ null)"
  - id: "AX-M011-033"
    natural_language: "A retomada de uma Captacao PAUSADO e bloqueada enquanto existir qualquer PeriodoCronograma futuro (nao concluido) com dataFim anterior a data de retomada. O GestorFAPES deve registrar AdiamentoPeriodoCronograma para cada periodo afetado antes de acionar a retomada. O sistema deve validar esta condicao e rejeitar a retomada se houver periodos expirados nao aditados."
    formal_rule: "retomar(Captacao) → ∀p ∈ CronogramaCaptacao.periodos where nao_concluido(p): p.dataFim >= dataRetomada"
  - id: "AX-M011-031"
    natural_language: "Quando tipoCaptacao = DEMANDA_INDUZIDA, o tipoOutorgado da Captacao deve coincidir com o tipo do outorgadoDestinatario."
    formal_rule: "tipoCaptacao = DEMANDA_INDUZIDA → tipoOutorgado = outorgadoDestinatario.tipo"
  - id: "AX-M011-029"
    natural_language: "Todas as faixas selecionadas em uma Captacao devem pertencer ao Fomento referenciado por essa Captacao."
    formal_rule: "∀f ∈ Captacao.faixasSelecionadas: f ∈ Captacao.fomento.faixasInvestimento"
  - id: "AX-M011-030"
    natural_language: "Uma Captacao deve selecionar ao menos uma faixa do Fomento."
    formal_rule: "|Captacao.faixasSelecionadas| >= 1"
  - id: "AX-M011-013"
    natural_language: "OutorgadoDestinatario do tipo PESSOA_FISICA deve ter cpf e nome preenchidos; cnpj, razaoSocial e contatoPF devem ser nulos."
    formal_rule: "(tipo = PESSOA_FISICA → cpf ≠ null ∧ nome ≠ null ∧ cnpj = null ∧ razaoSocial = null ∧ contatoPF = null)"
  - id: "AX-M011-014"
    natural_language: "OutorgadoDestinatario do tipo PESSOA_JURIDICA deve ter cnpj, razaoSocial e contatoPF preenchidos; cpf e nome devem ser nulos."
    formal_rule: "(tipo = PESSOA_JURIDICA → cnpj ≠ null ∧ razaoSocial ≠ null ∧ contatoPF ≠ null ∧ cpf = null ∧ nome = null)"
  - id: "AX-M011-015"
    natural_language: "Todo tipo de projeto declarado em FaixaInvestimento.tiposProjeto deve constar em Fomento.tiposProjetoFomentados."
    formal_rule: "∀f ∈ FaixaInvestimento: ∀t ∈ f.tiposProjeto: t ∈ Fomento.tiposProjetoFomentados"
  - id: "AX-M011-016"
    natural_language: "Cada FaixaInvestimento deve ter ao menos um tipo de projeto associado."
    formal_rule: "|FaixaInvestimento.tiposProjeto| >= 1"
  - id: "AX-M011-019"
    natural_language: "AditivoFomento so pode ser registrado em Fomento com estado APROVADO."
    formal_rule: "AditivoFomento → Fomento.estado = APROVADO"
  - id: "AX-M011-026"
    natural_language: "Quando Fomento transita para INTERROMPIDO, todas as Captacoes vinculadas devem ser suspensas e nenhuma nova proposta pode ser submetida enquanto o Fomento estiver neste estado."
    formal_rule: "Fomento.estado = INTERROMPIDO → ∀c ∈ Captacoes(Fomento): c.operacoesSuspensas = true"
  - id: "AX-M011-027"
    natural_language: "Quando Fomento transita para ENCERRADO, todas as Captacoes e projetos vinculados sao cancelados."
    formal_rule: "Fomento.estado = ENCERRADO → ∀c ∈ Captacoes(Fomento): c.cancelada = true"
  - id: "AX-M011-028"
    natural_language: "Fomento transita automaticamente para CONCLUIDO quando a dataFim efetiva e atingida. Nenhuma nova Captacao pode ser criada apos a conclusao."
    formal_rule: "hoje >= Fomento.dataFimEfetiva ∧ Fomento.estado = APROVADO → Fomento.estado = CONCLUIDO"
  - id: "AX-M011-023"
    natural_language: "RemanejamentoFaixas so pode ser registrado em Fomento com estado APROVADO."
    formal_rule: "RemanejamentoFaixas → Fomento.estado = APROVADO"
  - id: "AX-M011-024"
    natural_language: "faixaOrigem e faixaDestino de um RemanejamentoFaixas devem pertencer ao mesmo Fomento e ser diferentes entre si."
    formal_rule: "RemanejamentoFaixas.faixaOrigem.fomento = RemanejamentoFaixas.faixaDestino.fomento ∧ faixaOrigem ≠ faixaDestino"
  - id: "AX-M011-025"
    natural_language: "O valor remanejado nao pode exceder o valorAportado efetivo da faixaOrigem no momento do remanejamento."
    formal_rule: "RemanejamentoFaixas.valor ≤ valorAportadoEfetivo(faixaOrigem)"
  - id: "AX-M011-020"
    natural_language: "AditivoFomento com tipo DATA deve ter novaDataFim posterior a dataFim vigente do Fomento no momento do registro."
    formal_rule: "tipo = DATA → novaDataFim > Fomento.dataFim"
  - id: "AX-M011-021"
    natural_language: "AditivoFomento com tipo VALOR deve ter valorAdicionado preenchido e maior que zero."
    formal_rule: "tipo = VALOR → valorAdicionado ≠ null ∧ valorAdicionado > 0"
  - id: "AX-M011-022"
    natural_language: "Apos aditivo de DATA, a dataFim efetiva do Fomento passa a ser a novaDataFim do aditivo mais recente. Os axioms AX-017 e AX-018 usam sempre a dataFim efetiva."
    formal_rule: "Fomento.dataFimEfetiva = max(dataFim, max(aditivos where tipo = DATA: novaDataFim))"
  - id: "AX-M011-017"
    natural_language: "O cronograma de uma Captacao nao pode ter datas fora da vigencia do Fomento referenciado. A data do primeiro periodo deve ser >= Fomento.dataInicio e a data do ultimo periodo deve ser <= Fomento.dataFim."
    formal_rule: "∀p ∈ CronogramaCaptacao.periodos: p.dataInicio >= Fomento.dataInicio ∧ p.dataFim <= Fomento.dataFim"
  - id: "AX-M011-018"
    natural_language: "Projetos gerados por uma Captacao nao podem ter data de inicio anterior a Fomento.dataInicio nem data de fim posterior a Fomento.dataFim."
    formal_rule: "Projeto.dataInicio >= Fomento.dataInicio ∧ Projeto.dataFim <= Fomento.dataFim"

invariants:
  - id: "INV-M011-001"
    rule: "PeriodoCronograma.dataFim >= PeriodoCronograma.dataInicio"
    description: "A data de fim de um periodo deve ser posterior ou igual a data de inicio."
  - id: "INV-M011-002"
    rule: "AdiamentoPeriodoCronograma.dias > 0"
    description: "Um adiamento deve acrescentar pelo menos 1 dia."
  - id: "INV-M011-003"
    rule: "AporteFomento.valorAportado > 0"
    description: "O valor aportado deve ser estritamente positivo."
  - id: "INV-M011-004"
    rule: "FaixaInvestimento.duracaoMaximaMeses > 0"
    description: "A duracao maxima de uma faixa deve ser de pelo menos 1 mes."
  - id: "INV-M011-005"
    rule: "RegraAvaliacao.quantidadeMinimaRevisores >= 0"
    description: "A quantidade minima de revisores nao pode ser negativa."
  - id: "INV-M011-006"
    rule: "Captacao.estadoConfiguracao = PUBLICADO → Captacao.edital ≠ null ∧ (Captacao.edital.link ≠ null ∨ Captacao.edital.urlArquivo ≠ null)"
    description: "Uma captacao publicada deve ter edital com ao menos um link externo ou arquivo anexado."
  - id: "INV-M011-007"
    rule: "RubricaPermitidaFaixa.limitePercentual = null ∨ (RubricaPermitidaFaixa.limitePercentual >= 0 ∧ RubricaPermitidaFaixa.limitePercentual <= 100)"
    description: "O limite percentual de rubrica, quando informado, deve estar entre 0 e 100."
  - id: "INV-M011-008"
    rule: "Fomento.estado = APROVADO → |Fomento.aportes| >= 1 ∧ |Fomento.faixasInvestimento| >= 1"
    description: "Um fomento aprovado deve ter ao menos um aporte e uma faixa de investimento."
  - id: "INV-M011-009"
    rule: "Fomento.dataFim > Fomento.dataInicio"
    description: "A data de fim do fomento deve ser posterior a data de inicio."

enums:
  ObrigatoriedadeBloco:
    description: "Visibilidade e obrigatoriedade de um bloco fixo da proposta na captacao."
    values:
      EXIGIDO: "Bloco aparece na proposta e o proponente deve preenche-lo obrigatoriamente para submeter."
      DISPENSADO: "Bloco nao aparece para o proponente. Nao e solicitado nem exibido no formulario de submissao desta captacao."

  TipoAditivoFomento:
    description: "Tipo de aditivo aplicavel a um Fomento aprovado."
    values:
      VALOR: "Aditivo que amplia o valor total disponivel do fomento."
      DATA: "Aditivo que prorroga a data de fim do fomento."

  EstadoFomento:
    description: "Estado do ciclo de vida do fomento."
    values:
      EM_ELABORACAO: "Fomento em elaboracao, ainda nao aprovado."
      APROVADO: "Fomento aprovado e ativo — captacoes e projetos vinculados operam normalmente."
      INTERROMPIDO: "Fomento suspenso temporariamente pelo GestorFomento. Captacoes e projetos vinculados sao suspensos enquanto o fomento estiver neste estado."
      ENCERRADO: "Fomento cancelado pelo GestorFomento antes do prazo. Captacoes e projetos vinculados sao cancelados."
      CONCLUIDO: "Fomento concluido naturalmente ao atingir a dataFim. Nao aceita novos projetos."

  TipoResultado:
    description: "Tipo de resultado esperado do fomento."
    values:
      PRODUTO: "Resultado tangivel gerado pelos projetos fomentados (ex: software, equipamento, publicacao)."
      SERVICO: "Servico prestado ou capacidade instalada gerada pelos projetos fomentados."
      PROCESSO: "Processo ou metodologia desenvolvida ou melhorada pelos projetos fomentados."

  TipoOutorgado:
    description: "Tipo do destinatario de uma demanda induzida."
    values:
      PESSOA_FISICA: "Destinatario pessoa fisica — identificado por CPF e nome."
      PESSOA_JURIDICA: "Destinatario pessoa juridica — identificado por CNPJ, razao social e contato PF."

  TipoCaptacao:
    description: "Tipo da captacao de propostas."
    values:
      CHAMADA_PUBLICA: "Chamada aberta ao publico para submissao de propostas, regida por edital."
      DEMANDA_INDUZIDA: "Captacao direcionada a um outorgado destinatario especifico pre-definido."

  EstadoConfiguracaoCaptacao:
    description: "Estado do ciclo de vida da configuracao de uma captacao."
    values:
      EM_ANDAMENTO: "Captacao em processo de configuracao, ainda nao publicada."
      PUBLICADO: "Captacao publicada e disponivel para execucao do processo de selecao."
      NAO_PUBLICADO: "Captacao despublicada apos ter sido publicada."
      PAUSADO: "Captacao com processo de selecao temporariamente interrompido pelo GestorFAPES. Nenhuma acao de proponente, revisor ou analistaTecnico e permitida ate retomada. O periodo do cronograma em andamento nao avanca automaticamente."
      ENCERRADO: "Captacao encerrada. Pode ocorrer de tres formas: (1) encerramento natural — AnalistaTecnico publica o resultado final; (2) expiracao automatica — Sistema encerra ao atingir RESULTADO_FINAL.dataFim sem publicacao manual; (3) cancelamento administrativo — GestorFAPES cancela com justificativa a partir de PUBLICADO ou PAUSADO."

  TipoPeriodo:
    description: "Tipo de periodo obrigatorio do cronograma de uma captacao. Os 8 valores definem a ordem sequencial do fluxo."
    values:
      PUBLICACAO_CAPTACAO: "Periodo de publicacao da captacao (1o periodo — inicio do fluxo)."
      RECEBIMENTO_PROPOSTAS: "Periodo de recebimento de propostas dos proponentes (2o periodo)."
      AVALIACAO_DOCUMENTAL: "Periodo de analise documental das propostas recebidas (3o periodo)."
      AVALIACAO_AD_HOC: "Periodo de analise de merito por revisores especializados (4o periodo)."
      RESULTADO_PRELIMINAR: "Periodo de divulgacao do resultado preliminar (5o periodo)."
      RECEBIMENTO_REVISAO: "Periodo de recebimento de pedidos de revisao pelos proponentes (6o periodo)."
      RESULTADO_APOS_REVISAO: "Periodo de divulgacao do resultado apos analise das revisoes (7o periodo)."
      RESULTADO_FINAL: "Periodo de divulgacao do resultado final da captacao (8o periodo — fim do fluxo)."

  TipoOrigemAporte:
    description: "Tipo da origem do aporte financeiro para o fomento."
    values:
      PROGRAMA: "Aporte originado de um Programa (M010)."
      PARCERIA: "Aporte originado de uma Parceria (M010)."

  TipoProponenteEscolhido:
    description: "Tipo do proponente pre-selecionado para submissao restrita."
    values:
      INSTITUICAO: "Proponente do tipo pessoa juridica/instituicao."
      PESSOA: "Proponente do tipo pessoa fisica."

  TipoDirecionamentoProposta:
    description: "Define o direcionamento das propostas aceitas pela captacao."
    values:
      ABERTA: "Captacao aceita propostas de qualquer proponente habilitado."
      INSTITUICAO: "Captacao direcionada a uma instituicao especifica."
      TIPO_INSTITUICAO: "Captacao direcionada a um tipo de instituicao especifico."

value_objects: {}

events:
  - name: "FomentoAprovado"
    description: "Emitido quando o Fomento transita para o estado APROVADO."
    payload_entity: "pre_award.captacao.Fomento"
    trigger: "Transicao de EM_ELABORACAO para APROVADO com ao menos um aporte e uma faixa de investimento."
  - name: "CaptacaoPublicada"
    description: "Emitido quando a captacao transita para o estado PUBLICADO."
    payload_entity: "pre_award.captacao.Captacao"
    trigger: "Transicao de EM_ANDAMENTO para PUBLICADO com cronograma completo e link do edital preenchido."
  - name: "CaptacaoEncerrada"
    description: "Emitido quando a captacao transita para o estado ENCERRADO apos publicacao do resultado final."
    payload_entity: "pre_award.captacao.Captacao"
    trigger: "Publicacao do periodo RESULTADO_FINAL e transicao para ENCERRADO."
  - name: "PeriodoCronogramaAdiado"
    description: "Emitido quando um periodo do cronograma e adiado e as etapas posteriores sao deslocadas."
    payload_entity: "pre_award.captacao.AdiamentoPeriodoCronograma"
    trigger: "Registro de AdiamentoPeriodoCronograma com dias > 0 e justificativa."

workflows:
  FomentoStateMachine:
    states:
      - EM_ELABORACAO
      - APROVADO
      - INTERROMPIDO
      - ENCERRADO
      - CONCLUIDO
    transitions:
      - from: EM_ELABORACAO
        to: APROVADO
        trigger: "aprovar"
        actor: "GestorFomento"
        guard: "Ao menos um AporteFomento, uma FaixaInvestimento e um tipo de projeto cadastrados."
      - from: APROVADO
        to: INTERROMPIDO
        trigger: "interromper"
        actor: "GestorFomento"
        guard: "Justificativa informada. Captacoes e projetos vinculados sao suspensos em cascata."
      - from: INTERROMPIDO
        to: APROVADO
        trigger: "retomar"
        actor: "GestorFomento"
        guard: "Motivo da interrupcao resolvido."
      - from: INTERROMPIDO
        to: ENCERRADO
        trigger: "encerrar"
        actor: "GestorFomento"
        guard: "Justificativa de cancelamento informada. Captacoes e projetos vinculados sao cancelados em cascata."
      - from: APROVADO
        to: ENCERRADO
        trigger: "encerrar"
        actor: "GestorFomento"
        guard: "Justificativa de cancelamento informada. Captacoes e projetos vinculados sao cancelados em cascata."
      - from: APROVADO
        to: CONCLUIDO
        trigger: "concluir"
        actor: "Sistema"
        guard: "dataFim efetiva do Fomento atingida. Nenhuma nova captacao pode ser criada."

  CaptacaoStateMachine:
    states:
      - EM_ANDAMENTO
      - PUBLICADO
      - NAO_PUBLICADO
      - PAUSADO
      - ENCERRADO
    transitions:
      - from: EM_ANDAMENTO
        to: PUBLICADO
        trigger: "publicar"
        actor: "AnalistaTecnico"
        guard: "Fomento APROVADO, cronograma completo (8 periodos), linkEdital preenchido, formularios de submissao/avaliacao/revisao referenciados."
      - from: PUBLICADO
        to: NAO_PUBLICADO
        trigger: "despublicar"
        actor: "AnalistaTecnico"
        guard: "Nenhuma proposta submetida no periodo de recebimento ainda ativo."
      - from: NAO_PUBLICADO
        to: EM_ANDAMENTO
        trigger: "reabrir"
        actor: "AnalistaTecnico"
        guard: "Configuracao ainda valida."
      - from: PUBLICADO
        to: PAUSADO
        trigger: "pausar"
        actor: "GestorFAPES"
        guard: "Justificativa informada. Captacao deve estar PUBLICADO. Fomento nao pode estar ENCERRADO ou CONCLUIDO."
      - from: PAUSADO
        to: PUBLICADO
        trigger: "retomar"
        actor: "GestorFAPES"
        guard: "Fomento ainda APROVADO. Todos os PeriodoCronograma futuros com dataFim >= data de retomada — se algum periodo tiver expirado, o GestorFAPES deve registrar AdiamentoPeriodoCronograma para cada periodo afetado antes de retomar. Retomada bloqueada enquanto existir periodo futuro com dataFim < hoje."
      - from: PUBLICADO
        to: ENCERRADO
        trigger: "encerrar"
        actor: "AnalistaTecnico"
        guard: "Periodo RESULTADO_FINAL concluido e resultado final publicado. Encerramento normal ao fim do fluxo de selecao."
      - from: PUBLICADO
        to: ENCERRADO
        trigger: "expirar"
        actor: "Sistema"
        guard: "RESULTADO_FINAL.dataFim atingida e resultado final nao publicado manualmente. Sistema encerra automaticamente."
      - from: PUBLICADO
        to: ENCERRADO
        trigger: "cancelar"
        actor: "GestorFAPES"
        guard: "Justificativa de cancelamento informada. Nenhuma proposta aprovada e consumida pelo M022 apos cancelamento."
      - from: PAUSADO
        to: ENCERRADO
        trigger: "cancelar"
        actor: "GestorFAPES"
        guard: "Justificativa de cancelamento informada. Captacao cancelada enquanto pausada."

  CronogramaPeriodosSequencia:
    description: "Ordem obrigatoria dos 8 TipoPeriodo no fluxo da captacao."
    states:
      - PUBLICACAO_CAPTACAO
      - RECEBIMENTO_PROPOSTAS
      - AVALIACAO_DOCUMENTAL
      - AVALIACAO_AD_HOC
      - RESULTADO_PRELIMINAR
      - RECEBIMENTO_REVISAO
      - RESULTADO_APOS_REVISAO
      - RESULTADO_FINAL
    transitions:
      - from: PUBLICACAO_CAPTACAO
        to: RECEBIMENTO_PROPOSTAS
        trigger: "inicio recebimento"
        actor: "AnalistaTecnico"
      - from: RECEBIMENTO_PROPOSTAS
        to: AVALIACAO_DOCUMENTAL
        trigger: "encerramento recebimento"
        actor: "AnalistaTecnico"
      - from: AVALIACAO_DOCUMENTAL
        to: AVALIACAO_AD_HOC
        trigger: "inicio analise de merito"
        actor: "AnalistaTecnico"
      - from: AVALIACAO_AD_HOC
        to: RESULTADO_PRELIMINAR
        trigger: "publicacao resultado preliminar"
        actor: "AnalistaTecnico"
      - from: RESULTADO_PRELIMINAR
        to: RECEBIMENTO_REVISAO
        trigger: "abertura periodo de revisao"
        actor: "AnalistaTecnico"
      - from: RECEBIMENTO_REVISAO
        to: RESULTADO_APOS_REVISAO
        trigger: "publicacao resultado apos revisao"
        actor: "AnalistaTecnico"
      - from: RESULTADO_APOS_REVISAO
        to: RESULTADO_FINAL
        trigger: "publicacao resultado final"
        actor: "AnalistaTecnico"

policies:
  permissions:
    GestorFomento:
      description: "Papel atribuivel a qualquer funcionario da FAPES autorizado a buscar e gerir aportes de Programas e Parcerias para fomentar projetos."
      can:
        - criar Fomento
        - editar Fomento em EM_ELABORACAO
        - aprovar Fomento
        - registrar AditivoFomento em Fomento APROVADO
        - registrar RemanejamentoFaixas em Fomento APROVADO
        - interromper Fomento APROVADO
        - retomar Fomento INTERROMPIDO
        - encerrar Fomento APROVADO ou INTERROMPIDO
    GestorFAPES:
      can:
        - criar Captacao
        - editar Captacao em EM_ANDAMENTO
        - publicar Captacao
        - despublicar Captacao
        - reabrir Captacao para EM_ANDAMENTO
        - pausar Captacao PUBLICADO (requer justificativa)
        - retomar Captacao PAUSADO
        - cancelar Captacao PUBLICADO (requer justificativa)
        - cancelar Captacao PAUSADO (requer justificativa)
    AnalistaTecnico:
      can:
        - visualizar Fomento
        - visualizar Captacao
        - encerrar Captacao PUBLICADO apos publicacao do resultado final
        - configurar CronogramaCaptacao
        - configurar RubricaPermitidaFaixa
        - configurar BolsaPermitidaFaixa
        - configurar DocumentoExigido
        - adicionar RevisorAdHoc
        - registrar AdiamentoPeriodoCronograma
        - conferir DocumentacaoProposta
        - habilitar Proposta
        - inabilitar Proposta
        - distribuir PropostaParaRevisores
        - consolidar Pareceres
        - classificar Propostas
        - publicar ResultadoPreliminar
        - analisar SolicitacaoRevisao
        - atualizar Classificacao
        - publicar ResultadoAposRevisao
        - publicar ResultadoFinal
    Proponente:
      can:
        - submeter Proposta
        - solicitar RevisaoResultadoPreliminar
    RevisorAdHoc:
      can:
        - registrar PareceAdHoc
    ResponsavelInstitucional:
      description: "Responsavel pela instituicao ou setor do proponente. Aprova ou recusa a submissao do projeto em nome da instituicao quando exigeAprovacaoInstitucional = true."
      can:
        - aprovar SubmissaoProposta
        - recusar SubmissaoProposta

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms e invariants."
    - "Toda implementacao deve seguir workflows definidos."
    - "Fomento deve ser APROVADO antes de ser referenciado por uma Captacao (AX-M011-012)."
    - "AporteFomento deve referenciar exatamente um de: Programa (PROGRAMA) ou Parceria (PARCERIA) (AX-M011-002)."
    - "O total financeiro do fomento e calculado pela soma dos aportes; nao aceitar entrada manual de total."
    - "FaixaInvestimento pertence ao Fomento, nao a Captacao — rubricas e bolsas sao configuradas por faixa."
    - "BolsaPermitidaFaixa so pode ser configurada via RubricaPermitidaFaixa do tipo Bolsa (AX-M011-009)."
    - "RubricaPermitidaFaixa: rubricaPai = null indica raiz; subrubricas so possiveis quando permiteSubrubricas = true na rubrica pai (AX-M011-008)."
    - "CronogramaCaptacao deve sempre conter exatamente 8 PeriodoCronograma, um por TipoPeriodo, antes da publicacao (AX-M011-001)."
    - "Ordem dos TipoPeriodo obrigatoria: PUBLICACAO_CAPTACAO → RECEBIMENTO_PROPOSTAS → AVALIACAO_DOCUMENTAL → AVALIACAO_AD_HOC → RESULTADO_PRELIMINAR → RECEBIMENTO_REVISAO → RESULTADO_APOS_REVISAO → RESULTADO_FINAL."
    - "AdiamentoPeriodoCronograma deve deslocar todas as etapas posteriores pelo mesmo numero de dias (AX-M011-007)."
    - "OutorgadoDestinatario tipo PESSOA_FISICA: apenas cpf+nome; tipo PESSOA_JURIDICA: cnpj+razaoSocial+contatoPF (AX-M011-013 e AX-M011-014)."
    - "ProponenteEscolhido so e valido quando RegraSubmissao.submissaoRestritaAEscolhidos = true (AX-M011-005)."
    - "EixoEstrategico, Programa, Parceria, AreaTecnica, TipoIniciativa, Instituicao, TipoInstituicao, NivelAcademico, PessoaFisica e Rubrica sao referencias externas — nao modelar aqui."
    - "Formularios (FormularioSubmissaoRef, FormularioAvaliacaoRef, FormularioRevisaoRef, FormularioAnexoRef) sao referencias ao M021 — apenas formularioId e versaoFormularioId."
    - "M011 termina no ResultadoFinal. Assinatura do termo de outorga e contratacao pertencem ao M022."
    - "Captacao PAUSADO bloqueia todas as operacoes do processo de selecao (submissao, parecer, avanco de cronograma). Ao retomar, o GestorFAPES deve avaliar se as datas dos PeriodoCronograma ainda sao validas e, se necessario, registrar AdiamentoPeriodoCronograma antes de retomar (AX-M011-032)."
    - "DOACI (RUB-DOACI): limitePercentual na RubricaPermitidaFaixa e o teto do edital — nao pode superar a tabela normativa (Resolucao CCAF no 309/2022, item 2.4.8.1) para o valorMaximo da faixa (AX-M011-011)."
  notes:
    - "CategoriaProjeto e gerenciada dentro deste modulo e permite selecao multipla no cadastro da captacao."
    - "OutorgadoDestinatario e um registro desnormalizado — captura o destinatario da demanda induzida no momento da configuracao. Para PJ, o contatoPF e a referencia viva ao M008."
    - "Tabela DOACI normativa (Resolucao CCAF no 309/2022, 2.4.8.1): ate R$50k=15%; R$50k-R$100k=10%; R$100k-R$150k=5%; R$150k-R$300k=3%; R$300k-R$500k=1%; acima R$500k=0.5%. Base de calculo: valor total aprovado excluindo bolsas."
    - "Duvida em aberto: validar se todo comprovante deve ser DocumentoExigido ou se parte deles deve ser derivada de RequisitoProponente como evidencia documental de um requisito."
