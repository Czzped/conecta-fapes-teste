ontology: "Configuracao de Captacao"
namespace: "pre_award.captacao"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: shared.people
    path: path: "../../../ontology/shared/people.yaml"
  - namespace: corporativo.instituicoes
    path: path: "../M008-cadastros-corporativos/instituicoes/ontology.yaml"
  - namespace: corporativo.modalidade_bolsa
    path: path: "../M001-modalidade-bolsa/ontology.yaml"
  - namespace: corporativo.rubricas
    path: path: "../M008-cadastros-corporativos/rubricas/ontology.yaml"
  - namespace: planejamento.programas
    path: path: "../M010-planejamento-estrategia/programas/ontology.yaml"
  - namespace: planejamento.parcerias
    path: path: "../M010-planejamento-estrategia/parcerias/ontology.yaml"
  - namespace: planejamento.eixos
    path: path: "../M010-planejamento-estrategia/eixos/ontology.yaml"
  - namespace: financeiro.contabilidade
    path: path: "../M016-contabilidade-financeiro/ontology.yaml"
  - namespace: shared.documents
    path: path: "../../../ontology/shared/documents.yaml"
metadata:
  module: "M011"
  source: "docs/implementation/modules/M011-configuracao-captacao/modelo-estrutural.md"
  version: "2.0.0"
  description: >
    Define tres processos sequenciais: (1) Fomento — aporte financeiro de Programa, Parceria ou recurso interno
    para um eixo estrategico, com faixas de investimento, rubricas por faixa e resultados esperados;
    (2) Configuracao da Selecao — a Area Tecnica define tipo de chamamento, cronograma e regras;
    (3) Selecao dos Projetos — execucao da captacao, recebimento de propostas, analise, resultado final.

# ─────────────────────────────────────────────────────────────
# PROCESSO 1 — FOMENTO
# Responsavel: GestorFomento (criar/aprovar/encerrar), AnalistaTecnico (rubricas/bolsas por faixa)
# ─────────────────────────────────────────────────────────────

entities:
  Fomento:
    description: >
      Agregado raiz do Processo 1. Representa o aporte financeiro de Programas, Parcerias
      ou recursos internos para fomentar projetos de um eixo estrategico. Define faixas de investimento — cada faixa
      e a regua de valor e duracao para um ou mais tipos de projeto especificos. O conjunto de tipos
      apoiados pelo Fomento e derivado dos tipos associados as suas faixas.
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        generated: true
        unique: true
        description: "Codigo unico gerado automaticamente."
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo do fomento."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao do objetivo e escopo do fomento."
      eixoEstrategico:
        type: "ref:planejamento.eixos.EixoEstrategico"
        required: true
        description: "Eixo do planejamento estrategico atingido por este fomento."
      estado:
        type: "enum:EstadoFomento"
        required: true
        description: "Estado corrente do fomento."
      dataInicio:
        type: "date"
        required: true
        description: "Data de inicio do periodo de vigencia do fomento."
      dataFim:
        type: "date"
        required: true
        description: "Data de fim do periodo de vigencia do fomento. Deve ser posterior a dataInicio."
      areaTecnica:
        type: "ref:corporativo.instituicoes.AreaTecnica"
        required: true
        description: "Area Tecnica da FAPES responsavel pela gestao deste fomento."
      aportes:
        type: "list:ref:pre_award.captacao.AporteFomento"
        required: true
        description: "Um ou mais aportes financeiros de Programas, Parcerias ou recursos internos."
      tiposProjeto:
        type: "list:ref:corporativo.instituicoes.TipoProjeto"
        required: true
        description: "Um ou mais tipos de projeto aceitos pelo fomento."
      faixas:
        type: "list:ref:pre_award.captacao.Faixa"
        required: true
        description: "Uma ou mais faixas do fomento."
      resultadosEsperados:
        type: "list:ref:pre_award.captacao.ResultadoEsperadoFomento"
        required: false
        description: "Produtos, servicos ou processos esperados do fomento."
      remanejamentos:
        type: "list:ref:pre_award.captacao.RemanejamentoFaixas"
        required: false
        description: "Historico de remanejamentos de valor entre faixas apos selecao dos projetos."

  RemanejamentoFaixas:
    description: >
      Registro imutavel de um remanejamento de valor entre duas faixas de investimento do mesmo
      Fomento. Ocorre apos a selecao dos projetos, quando a demanda real de uma faixa supera
      ou nao atinge o valor originalmente alocado. Preserva historico com valores anteriores
      de cada faixa.
    extends: "shared.Auditavel"
    fields:
      faixaOrigem:
        type: "ref:pre_award.captacao.Faixa"
        required: true
        description: "Faixa que cede valor. Deve pertencer ao mesmo Fomento que a faixaDestino."
      faixaDestino:
        type: "ref:pre_award.captacao.Faixa"
        required: true
        description: "Faixa que recebe valor. Deve ser diferente da faixaOrigem."
      valor:
        type: "decimal"
        required: true
        description: "Valor remanejado da faixaOrigem para a faixaDestino. Deve ser maior que zero e nao pode exceder o valorAportado efetivo da faixaOrigem."
        domain: "> 0"
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo do remanejamento — geralmente excesso ou falta de demanda em uma faixa."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o remanejamento foi registrado. Gerada automaticamente."
      valorOrigemAnterior:
        type: "decimal"
        required: true
        description: "valorAportado efetivo da faixaOrigem imediatamente antes do remanejamento. Preenchido automaticamente para historico."
      valorDestinoAnterior:
        type: "decimal"
        required: true
        description: "valorAportado efetivo da faixaDestino imediatamente antes do remanejamento. Preenchido automaticamente para historico."

  AporteFomento:
    description: "Aporte financeiro de um Programa, Parceria ou recurso interno para o Fomento. Exatamente uma origem por registro."
    extends: "shared.Auditavel"
    fields:
      origemTipo:
        type: "enum:TipoOrigemAporte"
        required: true
        description: "Tipo da origem: PROGRAMA, PARCERIA ou RECURSO_INTERNO."
      valorAportado:
        type: "decimal"
        required: true
        description: "Valor financeiro aportado. Deve ser maior que zero."
        domain: "> 0"
      dataAporte:
        type: "date"
        required: true
        description: "Data em que o aporte financeiro foi registrado para o fomento."
      isAditivo:
        type: "boolean"
        required: true
        description: "Indica se o aporte e aditivo em relacao ao aporte original da mesma origem."
      justificativa:
        type: "string"
        required: false
        max_length: 500
        description: "Motivo do aporte. Obrigatorio quando isAditivo = true ou origemTipo = RECURSO_INTERNO."
      programa:
        type: "ref:planejamento.programas.Programa"
        required: false
        description: "Programa que aporta recurso. Obrigatorio quando origemTipo = PROGRAMA."
      parceria:
        type: "ref:planejamento.parcerias.Parceria"
        required: false
        description: "Parceria que aporta recurso. Obrigatoria quando origemTipo = PARCERIA."
      contaContabil:
        type: "ref:financeiro.contabilidade.ContaContabil"
        required: false
        description: "Conta contabil interna da FAPES. Obrigatoria quando origemTipo = RECURSO_INTERNO."

  Faixa:
    description: >
      Recorte de configuracao do Fomento usado para organizar rubricas e bolsas permitidas para propostas de projeto.
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome da faixa (ex: Pesquisa — Faixa A, Visita Tecnica)."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao da faixa."
      rubricasPermitidas:
        type: "list:ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: false
        description: "Rubricas autorizadas para o orcamento de projetos nesta faixa."
      bolsasPermitidas:
        type: "list:ref:pre_award.captacao.BolsaPermitidaFaixa"
        required: false
        description: "Versoes de nivel de bolsa permitidas nesta faixa."

  RubricaPermitidaFaixa:
    description: "Rubrica autorizada para o orcamento de projetos em uma Faixa, com percentuais, restricoes e orientacoes."
    extends: "shared.Auditavel"
    fields:
      rubrica:
        type: "ref:corporativo.rubricas.Rubrica"
        required: true
        description: "Rubrica do cadastro corporativo M008 autorizada para esta faixa."
      percentualMinimo:
        type: "decimal"
        required: false
        description: "Percentual minimo permitido para esta rubrica na faixa."
        domain: "0 a 100"
      percentualMaximo:
        type: "decimal"
        required: false
        description: "Percentual maximo do valor da faixa permitido para esta rubrica."
        domain: "0 a 100"
      restricoes:
        type: "string"
        required: false
        max_length: 1000
        description: "Exclusoes ou restricoes especificas para esta rubrica na faixa."
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da rubrica nesta faixa."
      rubricaPai:
        type: "ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: false
        description: "RubricaPermitidaFaixa pai quando este registro representa uma subrubrica. Nulo para raiz."

  BolsaPermitidaFaixa:
    description: "Versao de nivel de bolsa permitida em uma Faixa, com limites operacionais de cotas e bolsistas."
    extends: "shared.Auditavel"
    fields:
      versaoNivel:
        type: "ref:corporativo.modalidade_bolsa.VersaoNivel"
        required: true
        description: "Versao do nivel de bolsa do M001 permitida nesta faixa."
      quantidadeMinimaCotas:
        type: "integer"
        required: true
        description: "Quantidade minima de cotas para esta versao de nivel na faixa."
        domain: ">= 0"
      minimoBolsistas:
        type: "integer"
        required: true
        description: "Quantidade minima de bolsistas para esta versao de nivel na faixa."
        domain: ">= 0"
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da versao de bolsa na faixa."

  ResultadoEsperadoFomento:
    description: "Produto, servico ou processo esperado como resultado dos projetos financiados pelo fomento."
    extends: null
    fields:
      tipo:
        type: "enum:shared.TipoResultado"
        required: true
        description: "Tipo do resultado esperado: PRODUTO, SERVICO ou PROCESSO. Ver shared.TipoResultado."
      descricao:
        type: "string"
        required: true
        max_length: 500
        description: "Descricao do resultado esperado."
      indicador:
        type: "string"
        required: false
        max_length: 300
        description: "Indicador de medicao ou criterio de alcance do resultado."

# ─────────────────────────────────────────────────────────────
# PROCESSO 2 — CONFIGURACAO DA SELECAO
# Responsavel: AnalistaTecnico (da Area Tecnica)
# ─────────────────────────────────────────────────────────────

  Captacao:
    description: >
      Agregado raiz dos Processos 2 e 3. Representa a configuracao e a execucao da selecao de
      projetos sobre um Fomento aprovado. A Area Tecnica configura tipo de chamamento, cronograma,
      formularios e regras de selecao. O processo de selecao e executado a partir da publicacao.
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        generated: true
        unique: true
        description: "Codigo unico gerado automaticamente."
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo da captacao."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao resumida do objetivo e escopo."
      fomento:
        type: "ref:pre_award.captacao.Fomento"
        required: true
        description: "Fomento aprovado que financia esta captacao. Estado = APROVADO."
      faixasSelecionadas:
        type: "list:ref:pre_award.captacao.Faixa"
        required: true
        description: "Faixas do Fomento ativadas nesta captacao."
      tipoCaptacao:
        type: "enum:TipoCaptacao"
        required: true
        description: "CHAMADA_PUBLICA ou DEMANDA_INDUZIDA."
      tipoOutorgado:
        type: "enum:TipoOutorgado"
        required: true
        description: "PESSOA_FISICA ou PESSOA_JURIDICA."
      estadoConfiguracao:
        type: "enum:EstadoConfiguracaoCaptacao"
        required: true
        description: "Estado corrente da configuracao."
      editalLink:
        type: "string"
        required: false
        max_length: 500
        description: "URL externa do edital. Ao menos editalLink ou editalNomeArquivo obrigatorio antes da publicacao."
      editalNomeArquivo:
        type: "string"
        required: false
        max_length: 300
        description: "Nome do arquivo do edital anexado."
      editalVersao:
        type: "string"
        required: false
        max_length: 50
        description: "Versao do edital; incrementada a cada retificacao."
      exigePrestacaoTecnica:
        type: "boolean"
        required: true
        description: "Indica se os projetos gerados exigirao prestacao tecnica."
      exigePrestacaoFinanceira:
        type: "boolean"
        required: true
        description: "Indica se os projetos gerados exigirao prestacao financeira."
      periodosCronograma:
        type: "list:ref:pre_award.captacao.PeriodoCronograma"
        required: true
        description: "Lista de exatamente 8 periodos, um por TipoPeriodo, formando cadeia via precede."
      regraSubmissao:
        type: "ref:pre_award.captacao.RegraSubmissao"
        required: true
        description: "Regras de submissao e requisitos do proponente."
      proponentesEscolhidos:
        type: "list:ref:pre_award.captacao.ProponenteEscolhido"
        required: false
        description: "Proponentes autorizados quando regraSubmissao.submissaoRestritaAEscolhidos=true."
      documentosExigidos:
        type: "list:ref:pre_award.captacao.DocumentoExigido"
        required: false
        description: "Documentos exigidos do proponente na submissao."
      formularioSubmissao:
        type: "ref:pre_award.captacao.FormularioRef"
        required: true
        description: "Formulario de submissao da proposta no M021."
      formularioAvaliacao:
        type: "ref:pre_award.captacao.FormularioRef"
        required: true
        description: "Formulario de avaliacao ad hoc no M021."
      formularioRevisao:
        type: "ref:pre_award.captacao.FormularioRef"
        required: true
        description: "Formulario de revisao de resultado no M021."
      formularioAnexo:
        type: "ref:pre_award.captacao.FormularioRef"
        required: false
        description: "Formulario de anexos no M021. Opcional."
      matrizConfiguracao:
        type: "ref:pre_award.captacao.MatrizConfiguracaoProjeto"
        required: true
        description: "Define quais blocos fixos da proposta sao EXIGIDO ou DISPENSADO."

# ─────────────────────────────────────────────────────────────
# ENTIDADES DE SUPORTE — COMPARTILHADAS ENTRE PROCESSOS 2 E 3
# ─────────────────────────────────────────────────────────────

  MatrizConfiguracaoProjeto:
    description: >
      Define quais blocos fixos da proposta/projeto sao exigidos, opcionais ou dispensados
      nesta captacao. Evita que o M003 trate todos os blocos como obrigatorios — a obrigatoriedade
      concreta nasce aqui.
    extends: "shared.Auditavel"
    fields:
      equipe:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar equipe (papeis, quantidade prevista ou membros)."
      resultados:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar resultados esperados (entregas)."
      riscos:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar riscos, impacto, probabilidade e mitigacao."
      cronogramaProj:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar cronograma de atividades com datas."
      orcamento:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar valores planejados por rubrica."
      objetivos:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar objetivo geral e/ou objetivos especificos."
      beneficios:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar beneficios e indicadores."

  PeriodoCronograma:
    description: "Card operacional de uma fase do cronograma da captacao com data de inicio e fim."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome descritivo da fase (ex: Periodo de Recebimento de Propostas)."
      tipo:
        type: "enum:TipoPeriodo"
        required: true
        description: "Tipo da fase no fluxo. Define a ordem obrigatoria."
      dataInicio:
        type: "date"
        required: true
        description: "Data de inicio do periodo."
      dataFim:
        type: "date"
        required: true
        description: "Data de fim do periodo."
      proximo:
        type: "ref:pre_award.captacao.PeriodoCronograma"
        required: false
        description: "Proximo periodo na cadeia do cronograma. Nulo para o periodo final (RESULTADO_FINAL)."
      adiamentos:
        type: "list:ref:pre_award.captacao.AdiamentoPeriodoCronograma"
        required: false
        description: "Historico de adiamentos aplicados a este periodo."

  AdiamentoPeriodoCronograma:
    description: "Registro imutavel de um adiamento aplicado a um periodo do cronograma com justificativa, datas originais e novas."
    extends: "shared.Auditavel"
    fields:
      dias:
        type: "integer"
        required: true
        description: "Quantidade de dias acrescida ao periodo e a todos os periodos posteriores."
        domain: "> 0"
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo informado para o adiamento."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o adiamento foi registrado. Gerada automaticamente."
      dataInicioOriginal:
        type: "date"
        required: true
        description: "Data inicial da etapa antes do adiamento."
      dataFimOriginal:
        type: "date"
        required: true
        description: "Data final da etapa antes do adiamento."
      dataInicioNova:
        type: "date"
        required: true
        description: "Data inicial da etapa apos o adiamento."
      dataFimNova:
        type: "date"
        required: true
        description: "Data final da etapa apos o adiamento."

  RegraSubmissao:
    description: "Regras que governam quem pode submeter propostas e sob quais condicoes de acumulacao."
    extends: "shared.Auditavel"
    fields:
      permiteMultiplasPropostas:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode enviar mais de uma proposta."
      permiteParticiparEmOutraProposta:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode participar de outra proposta da mesma captacao."
      permiteAcumularBolsa:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode acumular bolsa ativa em outro projeto."
      submissaoRestritaAEscolhidos:
        type: "boolean"
        required: true
        description: "Indica se apenas proponentes previamente escolhidos podem submeter proposta."
      exigeAprovacaoInstitucional:
        type: "boolean"
        required: true
        description: "Indica se a proposta submetida deve ser aprovada pelo responsavel da instituicao ou setor do proponente antes de seguir para analise documental."
      direcionamento:
        type: "enum:TipoDirecionamentoProposta"
        required: true
        description: "Define se a proposta e aberta, direcionada a instituicao ou tipo de instituicao."
      permiteParceriaInstituicoes:
        type: "boolean"
        required: true
        description: "Proposta pode envolver mais de uma instituicao."
      exigeVinculoEmpregaticio:
        type: "boolean"
        required: true
        description: "Proponente deve ter vinculo empregaticio ativo."
      exigeGestorInstitucional:
        type: "boolean"
        required: true
        description: "Proposta deve informar gestor institucional."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao permitida quando direcionamento=INSTITUICAO."
      tipoInstituicao:
        type: "ref:corporativo.instituicoes.TipoInstituicao"
        required: false
        description: "Tipo de instituicao quando direcionamento=TIPO_INSTITUICAO."
      nivelAcademicoMinimo:
        type: "ref:corporativo.instituicoes.NivelAcademico"
        required: false
        description: "Nivel academico minimo exigido do proponente."

  FormularioRef:
    description: "Referencia a um formulario publicado no M021. Usado para submissao, avaliacao ad hoc, revisao de resultado e anexos."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  ProponenteEscolhido:
    description: "Proponente autorizado a submeter quando submissaoRestritaAEscolhidos = true. Aponta para exatamente uma Instituicao ou PessoaFisica."
    extends: null
    fields:
      tipo:
        type: "enum:TipoProponenteEscolhido"
        required: true
        description: "Tipo do proponente escolhido: INSTITUICAO ou PESSOA."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao autorizada. Obrigatoria quando tipo = INSTITUICAO."
      pessoa:
        type: "ref:shared.people.PessoaFisica"
        required: false
        description: "Pessoa fisica autorizada. Obrigatoria quando tipo = PESSOA."

  DocumentoExigido:
    description: "Documento exigido do proponente na submissao, com regras de reaproveitamento do cadastro corporativo."
    extends: "shared.Auditavel"
    fields:
      tipoDocumento:
        type: "ref:shared.documents.TipoDocumento"
        required: true
        description: "Tipo do documento exigido, ancorado no catalogo compartilhado."
      nome:
        type: "string"
        required: false
        max_length: 200
        description: "Label especifico do edital; sobrescreve o nome do TipoDocumento quando preenchido."
      descricao:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao ou orientacao de envio do documento."
      obrigatorio:
        type: "boolean"
        required: true
        description: "Indica se o documento e obrigatorio na submissao."
      reutilizarCadastroCorporativo:
        type: "boolean"
        required: true
        description: "Indica se o documento deve ser reaproveitado do cadastro corporativo quando existir e estiver valido."
      exigirNovoEnvioSeVencido:
        type: "boolean"
        required: true
        description: "Indica se o proponente deve reenviar o documento quando o cadastro corporativo possuir documento vencido ou invalido."
      formatos:
        type: "list:string"
        required: true
        description: "Extensoes de arquivo aceitas. Ex: PDF, DOCX, XLSX."

# ─────────────────────────────────────────────────────────────
# PROCESSO 3 — SELECAO DOS PROJETOS
# Responsavel: Proponente (submeter), AnalistaTecnico (avaliar/publicar), RevisorAdHoc (parecer)
# Nota: Projeto e entidade externa (M008). Este processo opera sobre projetos captados.
# ─────────────────────────────────────────────────────────────

  RespostaFormularioSubmissao:
    description: "Snapshot imutavel das respostas preenchidas pelo proponente no formulario de submissao do M021. Registrado no momento da submissao formal."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Versao do formulario usada na submissao."
      respostas:
        type: "json"
        required: true
        description: "Conteudo das respostas em formato estruturado. Imutavel apos submissao."
      dataSubmissao:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora em que a proposta foi submetida formalmente."

  DocumentacaoProjeto:
    description: "Registro da analise documental realizada pelo AnalistaTecnico sobre a documentacao entregue pelo proponente."
    extends: "shared.Auditavel"
    fields:
      estado:
        type: "enum:EstadoDocumentacao"
        required: true
        description: "Estado da analise documental: PENDENTE, HABILITADA ou INABILITADA."
      justificativa:
        type: "string"
        required: false
        max_length: 500
        description: "Justificativa da inabilitacao. Obrigatoria quando estado=INABILITADA."
      dataInicioAvaliacao:
        type: "date"
        required: false
        description: "Data de inicio da analise documental."
      dataFimAvaliacao:
        type: "date"
        required: false
        description: "Data de conclusao da analise documental."

  AssinaturaInstitucional:
    description: "Solicitacao de aprovacao institucional enviada ao ResponsavelInstitucional durante o periodo de submissao. Criada apenas quando exigeAprovacaoInstitucional=true."
    extends: "shared.Auditavel"
    fields:
      estado:
        type: "enum:EstadoAssinatura"
        required: true
        description: "Estado: SOLICITADA, ASSINADA, RECUSADA ou EXPIRADA."
      dataSolicitacao:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora em que a assinatura foi solicitada ao responsavel."
      dataDecisao:
        type: "datetime"
        required: false
        description: "Data e hora em que o responsavel assinou ou recusou."
      justificativaRecusa:
        type: "string"
        required: false
        max_length: 500
        description: "Motivo da recusa. Obrigatorio quando estado=RECUSADA."

  DistribuicaoAvaliacao:
    description: "Registro da distribuicao de um projeto a um RevisorAdHoc para analise de merito."
    extends: "shared.Auditavel"
    fields:
      dataDistribuicao:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora em que o AnalistaTecnico distribuiu o projeto ao revisor."
      dataLimiteResposta:
        type: "date"
        required: true
        description: "Prazo para o revisor aceitar, recusar ou registrar parecer. Definido pelo AnalistaTecnico no momento da distribuicao."
      estado:
        type: "enum:EstadoDistribuicao"
        required: true
        description: "Estado: DISTRIBUIDA, RECUSADA, NAO_RESPONDEU, AVALIADA ou CANCELADA."
      justificativaRecusa:
        type: "string"
        required: false
        max_length: 500
        description: "Motivo informado pelo revisor ao recusar. Obrigatorio quando estado=RECUSADA. Nao aplicavel para NAO_RESPONDEU — a nao resposta e o proprio motivo."
      dataRecusa:
        type: "datetime"
        required: false
        description: "Data e hora em que o revisor registrou a recusa."

  AvaliacaoAdHoc:
    description: "Parecer tecnico registrado por um RevisorAdHoc sobre um projeto durante o periodo de avaliacao de merito."
    extends: "shared.Auditavel"
    fields:
      nota:
        type: "decimal"
        required: true
        description: "Nota atribuida pelo revisor ao projeto."
        domain: ">= 0"
      parecer:
        type: "string"
        required: true
        max_length: 3000
        description: "Texto do parecer tecnico do revisor."
      recomendacao:
        type: "string"
        required: true
        max_length: 200
        description: "Recomendacao do revisor. Ex: Aprovada, Reprovada, Aprovada com ressalvas."
      dataRegistro:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora do registro da avaliacao."
      respostasFormulario:
        type: "json"
        required: true
        description: "Snapshot das respostas do revisor no formulario de avaliacao do M021. Imutavel apos registro."

  ResultadoSelecao:
    description: "Publicacao de resultado de uma etapa do processo de selecao (preliminar, apos revisao ou final) para um ou mais projetos."
    extends: "shared.Auditavel"
    fields:
      tipo:
        type: "enum:TipoResultadoSelecao"
        required: true
        description: "Tipo do resultado: PRELIMINAR, APOS_REVISAO ou FINAL."
      dataPublicacao:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora de publicacao do resultado."
      classificacao:
        type: "integer"
        required: false
        description: "Posicao do projeto no resultado. Nulo para projetos reprovados."
        domain: ">= 1"
      decisao:
        type: "string"
        required: true
        max_length: 200
        description: "Decisao registrada. Ex: Aprovado, Reprovado, Em lista de espera."

  RevisaoResultado:
    description: "Solicitacao de revisao do resultado preliminar submetida por um proponente dentro do periodo de recursos."
    extends: "shared.Auditavel"
    fields:
      motivo:
        type: "string"
        required: true
        max_length: 200
        description: "Motivo principal da solicitacao de revisao."
      descricao:
        type: "string"
        required: true
        max_length: 3000
        description: "Descricao detalhada da contestacao."
      estado:
        type: "enum:EstadoRevisao"
        required: true
        description: "Estado: SUBMETIDA, ADMISSIVEL, INADMISSIVEL, DEFERIDA ou INDEFERIDA."
      decisao:
        type: "string"
        required: false
        max_length: 200
        description: "Decisao final da revisao. Obrigatoria quando estado=DEFERIDA ou INDEFERIDA."
      justificativaDecisao:
        type: "string"
        required: false
        max_length: 1000
        description: "Justificativa da decisao sobre a revisao."
      dataSolicitacao:
        type: "datetime"
        required: true
        generated: true
        description: "Data e hora da submissao da solicitacao."
      dataDecisao:
        type: "datetime"
        required: false
        description: "Data e hora em que a decisao foi registrada."

  AnexoRevisao:
    description: "Arquivo anexado a uma RevisaoResultado como evidencia ou suporte da contestacao."
    extends: null
    fields:
      nomeArquivo:
        type: "string"
        required: true
        max_length: 300
        description: "Nome do arquivo anexado."
      urlArquivo:
        type: "string"
        required: true
        max_length: 500
        description: "URL de acesso ao arquivo armazenado."

