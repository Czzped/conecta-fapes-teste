ontology: "Configuracao de Captacao"
namespace: "pre_award.captacao"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: shared.people
    path: path: "../../../ontology/shared/people.yaml"
  - namespace: corporativo.instituicoes
    path: path: "../M008-cadastros-corporativos/instituicoes/ontology.yaml"
  - namespace: corporativo.modalidade_bolsa
    path: path: "../M001-modalidade-bolsa/ontology.yaml"
  - namespace: corporativo.rubricas
    path: path: "../M008-cadastros-corporativos/rubricas/ontology.yaml"
  - namespace: planejamento.programas
    path: path: "../M010-planejamento-estrategia/programas/ontology.yaml"
  - namespace: planejamento.parcerias
    path: path: "../M010-planejamento-estrategia/parcerias/ontology.yaml"
metadata:
  module: "M011"
  source: "docs/implementation/modules/M011-configuracao-captacao/modelo-estrutural.md"
  version: "1.0.0"
  description: "Define a configuracao completa de uma captacao de propostas, incluindo cronograma obrigatorio, regras de submissao e avaliacao, faixas de financiamento, rubricas e bolsas permitidas."

entities:
  Captacao:
    description: "Agregado raiz que representa uma chamada ou demanda induzida configurada pela FAPES para recepcao de propostas."
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        generated: true
        unique: true
        description: "Codigo unico gerado automaticamente para a captacao."
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo da captacao."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao resumida do objetivo e escopo da captacao."
      linkEdital:
        type: "string"
        required: true
        description: "Link ou referencia ao documento do edital."
      tipoCaptacao:
        type: "enum:TipoCaptacao"
        required: true
        description: "Tipo da captacao: chamada publica ou demanda induzida."
      estadoConfiguracao:
        type: "enum:EstadoConfiguracaoCaptacao"
        required: true
        description: "Estado corrente da configuracao da captacao."
      cronograma:
        type: "ref:pre_award.captacao.CronogramaCaptacao"
        required: true
        description: "Cronograma obrigatorio com os 8 periodos do fluxo da captacao."
      aportes:
        type: "list:ref:pre_award.captacao.AporteFinanceiroCaptacao"
        required: true
        description: "Um ou mais aportes financeiros que totalizam o valor da captacao."
      areaTecnica:
        type: "ref:corporativo.instituicoes.AreaTecnica"
        required: true
        description: "Area tecnica responsavel pela gestao das iniciativas captadas."
      outorgadoDestinatario:
        type: "ref:pre_award.captacao.OutorgadoDestinatario"
        required: false
        description: "Pessoa destinataria de uma demanda induzida. Obrigatorio quando tipoCaptacao = DEMANDA_INDUZIDA."
      tiposIniciativa:
        type: "list:ref:corporativo.instituicoes.TipoIniciativa"
        required: true
        description: "Um ou mais tipos de iniciativa aceitos pela captacao."
      categoriasIniciativa:
        type: "list:ref:pre_award.captacao.CategoriaIniciativa"
        required: true
        description: "Uma ou mais categorias de iniciativa aceitas pela captacao."
      formularioSubmissao:
        type: "ref:pre_award.captacao.FormularioSubmissaoRef"
        required: true
        description: "Referencia ao formulario de submissao publicado no M021."
      formularioAvaliacao:
        type: "ref:pre_award.captacao.FormularioAvaliacaoRef"
        required: true
        description: "Referencia ao formulario de avaliacao ad hoc publicado no M021."
      formularioRevisao:
        type: "ref:pre_award.captacao.FormularioRevisaoRef"
        required: true
        description: "Referencia ao formulario de revisao de resultado publicado no M021."
      formularioAnexo:
        type: "ref:pre_award.captacao.FormularioAnexoRef"
        required: false
        description: "Referencia opcional ao formulario de anexos publicado no M021."
      faixasFinanciamento:
        type: "list:ref:pre_award.captacao.FaixaFinanciamento"
        required: false
        description: "Faixas de financiamento disponiveis na captacao."
      regraSubmissao:
        type: "ref:pre_award.captacao.RegraSubmissao"
        required: true
        description: "Regras de submissao de propostas para esta captacao."
      proponentesEscolhidos:
        type: "list:ref:pre_award.captacao.ProponenteEscolhido"
        required: false
        description: "Lista de proponentes autorizados quando submissaoRestritaAEscolhidos = true."
      requisitoProponente:
        type: "ref:pre_award.captacao.RequisitoProponente"
        required: true
        description: "Requisitos impostos ao proponente da captacao."
      regraAvaliacao:
        type: "ref:pre_award.captacao.RegraAvaliacao"
        required: true
        description: "Regras de avaliacao ad hoc das propostas."
      prestacaoExigida:
        type: "ref:pre_award.captacao.PrestacaoExigida"
        required: true
        description: "Define se as iniciativas geradas exigem prestacao tecnica e/ou financeira."
      revisoresAdHoc:
        type: "list:ref:pre_award.captacao.RevisorAdHoc"
        required: true
        description: "Pool de revisores ad hoc disponivel para a captacao."
      rubricasPermitidas:
        type: "list:ref:pre_award.captacao.RubricaPermitida"
        required: false
        description: "Rubricas autorizadas para o orcamento das propostas."
      bolsasPermitidas:
        type: "list:ref:pre_award.captacao.BolsaPermitida"
        required: false
        description: "Versoes de niveis de bolsa permitidas na captacao."
      documentosExigidos:
        type: "list:ref:pre_award.captacao.DocumentoExigido"
        required: false
        description: "Documentos exigidos do proponente na submissao."

  AporteFinanceiroCaptacao:
    description: "Registro de aporte financeiro de um programa ou parceria para a captacao. Exatamente uma origem deve ser preenchida por registro."
    extends: "shared.Auditavel"
    fields:
      origemTipo:
        type: "enum:TipoOrigemAporte"
        required: true
        description: "Tipo da origem do aporte: PROGRAMA ou PARCERIA."
      valorAportado:
        type: "decimal"
        required: true
        description: "Valor financeiro aportado pela origem. Deve ser maior que zero."
        domain: "> 0"
      programa:
        type: "ref:planejamento.programas.Programa"
        required: false
        description: "Programa que aporta recurso. Obrigatorio quando origemTipo = PROGRAMA."
      parceria:
        type: "ref:planejamento.parcerias.Parceria"
        required: false
        description: "Parceria que aporta recurso. Obrigatoria quando origemTipo = PARCERIA."

  OutorgadoDestinatario:
    description: "Pessoa destinataria de uma demanda induzida, referenciada a partir do M008."
    extends: null
    fields:
      cpf:
        type: "value_object:shared.CPF"
        required: true
        description: "CPF da pessoa para a qual a demanda induzida e direcionada."
      nome:
        type: "string"
        required: true
        max_length: 300
        description: "Nome da pessoa destinataria."

  CategoriaIniciativa:
    description: "Categoria de iniciativa aceita pela captacao, com indicador de disponibilidade para selecao multipla."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        unique: true
        max_length: 200
        description: "Nome da categoria (ex: Pesquisa, Inovacao, Extensao, Difusao, Capacitacao)."
      descricao:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao da categoria."
      selecionavelNoCadastro:
        type: "boolean"
        required: true
        description: "Indica se a categoria esta disponivel para selecao multipla no cadastro da captacao."

  CronogramaCaptacao:
    description: "Cronograma da captacao composto exatamente pelos 8 periodos obrigatorios do fluxo."
    extends: "shared.Auditavel"
    fields:
      descricao:
        type: "string"
        required: true
        max_length: 500
        description: "Descricao geral do cronograma da captacao."
      periodos:
        type: "list:ref:pre_award.captacao.PeriodoCronograma"
        required: true
        description: "Lista de exatamente 8 periodos, um para cada TipoPeriodo obrigatorio, em ordem sequencial."

  PeriodoCronograma:
    description: "Card operacional de uma fase do cronograma da captacao com data de inicio e fim."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome descritivo da fase (ex: Periodo de Recebimento de Propostas)."
      tipo:
        type: "enum:TipoPeriodo"
        required: true
        description: "Tipo da fase no fluxo da captacao. Define a ordem obrigatoria."
      dataInicio:
        type: "date"
        required: true
        description: "Data de inicio do periodo."
      dataFim:
        type: "date"
        required: true
        description: "Data de fim do periodo."
      adiamentos:
        type: "list:ref:pre_award.captacao.AdiamentoPeriodoCronograma"
        required: false
        description: "Historico de adiamentos aplicados a este periodo."

  AdiamentoPeriodoCronograma:
    description: "Registro imutavel de um adiamento aplicado a um periodo do cronograma com justificativa e datas originais e novas."
    extends: "shared.Auditavel"
    fields:
      dias:
        type: "integer"
        required: true
        description: "Quantidade de dias acrescida ao periodo e a todos os periodos posteriores."
        domain: "> 0"
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo informado para o adiamento da etapa."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o adiamento foi registrado. Gerada automaticamente."
      dataInicioOriginal:
        type: "date"
        required: true
        description: "Data inicial da etapa antes do adiamento."
      dataFimOriginal:
        type: "date"
        required: true
        description: "Data final da etapa antes do adiamento."
      dataInicioNova:
        type: "date"
        required: true
        description: "Data inicial da etapa apos o adiamento."
      dataFimNova:
        type: "date"
        required: true
        description: "Data final da etapa apos o adiamento."

  FormularioSubmissaoRef:
    description: "Referencia ao formulario de submissao publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioAvaliacaoRef:
    description: "Referencia ao formulario de avaliacao ad hoc publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioRevisaoRef:
    description: "Referencia ao formulario de revisao de resultado publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioAnexoRef:
    description: "Referencia opcional ao formulario de anexos publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: false
        description: "Identificador do formulario de anexos no M021."
      versaoFormularioId:
        type: "string"
        required: false
        description: "Identificador da versao publicada selecionada no M021."

  FaixaFinanciamento:
    description: "Faixa de valor para financiamento de iniciativas dentro da captacao, com duracao maxima e parcela do aporte reservada."
    extends: "shared.Auditavel"
    fields:
      duracaoMaximaMeses:
        type: "integer"
        required: true
        description: "Duracao maxima da iniciativa nessa faixa em meses."
        domain: "> 0"
      valorMinimo:
        type: "decimal"
        required: true
        description: "Valor financeiro minimo da faixa."
        domain: ">= 0"
      valorMaximo:
        type: "decimal"
        required: true
        description: "Valor financeiro maximo da faixa. Deve ser >= valorMinimo."
        domain: ">= valorMinimo"
      valorAportado:
        type: "decimal"
        required: true
        description: "Parcela do total aportado na captacao reservada para esta faixa."
        domain: ">= 0"

  RegraSubmissao:
    description: "Regras que governam quem pode submeter propostas e sob quais condicoes de acumulacao."
    extends: "shared.Auditavel"
    fields:
      permiteMultiplasPropostas:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode enviar mais de uma proposta."
      permiteParticiparEmOutraProposta:
        type: "boolean"
        required: true
        description: "Indica se o coordenador/proponente pode participar de outra proposta da mesma captacao."
      permiteAcumularBolsa:
        type: "boolean"
        required: true
        description: "Indica se o coordenador/proponente pode acumular bolsa ativa em outro projeto."
      submissaoRestritaAEscolhidos:
        type: "boolean"
        required: true
        description: "Indica se apenas pessoas/instituicoes previamente escolhidas podem submeter proposta."

  ProponenteEscolhido:
    description: "Proponente autorizado a submeter quando submissaoRestritaAEscolhidos = true. Aponta para exatamente uma Instituicao ou PessoaFisica."
    extends: null
    fields:
      tipo:
        type: "enum:TipoProponenteEscolhido"
        required: true
        description: "Tipo do proponente escolhido: INSTITUICAO ou PESSOA."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao autorizada. Obrigatoria quando tipo = INSTITUICAO."
      pessoa:
        type: "ref:shared.people.PessoaFisica"
        required: false
        description: "Pessoa fisica autorizada. Obrigatoria quando tipo = PESSOA."

  RequisitoProponente:
    description: "Requisitos impostos ao proponente: direcionamento, vinculo, gestor institucional e nivel academico minimo."
    extends: "shared.Auditavel"
    fields:
      direcionamento:
        type: "enum:TipoDirecionamentoProposta"
        required: true
        description: "Define se a proposta e aberta, direcionada a instituicao ou a tipo de instituicao."
      permiteParceriaInstituicoes:
        type: "boolean"
        required: true
        description: "Indica se a proposta pode envolver mais de uma instituicao."
      exigeVinculoEmpregaticio:
        type: "boolean"
        required: true
        description: "Indica se o proponente deve possuir vinculo empregaticio ativo."
      exigeGestorInstitucional:
        type: "boolean"
        required: true
        description: "Indica se a proposta deve informar gestor institucional."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao permitida quando direcionamento = INSTITUICAO."
      tipoInstituicao:
        type: "ref:corporativo.instituicoes.TipoInstituicao"
        required: false
        description: "Tipo de instituicao permitido quando direcionamento = TIPO_INSTITUICAO."
      nivelAcademicoMinimo:
        type: "ref:corporativo.instituicoes.NivelAcademico"
        required: false
        description: "Nivel academico minimo exigido do proponente/coordenador."

  RegraAvaliacao:
    description: "Configuracao das regras de avaliacao ad hoc das propostas recebidas."
    extends: "shared.Auditavel"
    fields:
      exigeAvaliacaoAdHoc:
        type: "boolean"
        required: true
        description: "Indica se a captacao exige avaliacao ad hoc."
      quantidadeMinimaRevisores:
        type: "integer"
        required: true
        description: "Quantidade minima de revisores ad hoc por proposta."
        domain: ">= 0"

  PrestacaoExigida:
    description: "Define se as iniciativas geradas por esta captacao exigirao prestacao tecnica e/ou financeira."
    extends: "shared.Auditavel"
    fields:
      exigePrestacaoTecnica:
        type: "boolean"
        required: true
        description: "Indica se as iniciativas geradas exigirao prestacao tecnica."
      exigePrestacaoFinanceira:
        type: "boolean"
        required: true
        description: "Indica se as iniciativas geradas exigirao prestacao financeira."

  RevisorAdHoc:
    description: "Papel operacional assumido por uma PessoaFisica como revisor ad hoc nesta captacao."
    extends: "shared.Auditavel"
    fields:
      pessoa:
        type: "ref:shared.people.PessoaFisica"
        required: true
        description: "Pessoa fisica que assume o papel de revisor ad hoc. Localizada por CPF ou nome na interface."
      dataInclusao:
        type: "date"
        required: true
        generated: true
        description: "Data em que a pessoa foi incluida no pool de revisores da captacao."
      areaAtuacao:
        type: "string"
        required: true
        max_length: 200
        description: "Area de conhecimento considerada para distribuicao das propostas."
      titulacao:
        type: "string"
        required: true
        max_length: 100
        description: "Titulacao academica do revisor (ex: Doutor, Mestre)."

  RubricaPermitida:
    description: "Rubrica autorizada para o orcamento das propostas desta captacao, com limites e orientacoes especificas."
    extends: "shared.Auditavel"
    fields:
      rubrica:
        type: "ref:corporativo.rubricas.Rubrica"
        required: true
        description: "Rubrica do cadastro corporativo M008 autorizada para esta captacao."
      permiteSubrubricas:
        type: "boolean"
        required: true
        description: "Indica se a rubrica pode possuir subrubricas permitidas na captacao."
      obrigatoria:
        type: "boolean"
        required: true
        description: "Indica se a proposta deve usar esta rubrica quando informar orcamento."
      limiteValor:
        type: "decimal"
        required: false
        description: "Valor maximo permitido para a rubrica na captacao."
        domain: ">= 0"
      limitePercentual:
        type: "decimal"
        required: false
        description: "Percentual maximo da faixa de financiamento permitido para a rubrica."
        domain: "0 a 100"
      comprovantesEsperados:
        type: "string"
        required: false
        max_length: 1000
        description: "Orientacao de comprovantes esperados para prestacao de contas."
      restricoes:
        type: "string"
        required: false
        max_length: 1000
        description: "Exclusoes ou restricoes especificas do edital para esta rubrica."
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da rubrica na captacao."
      rubricaPai:
        type: "ref:pre_award.captacao.RubricaPermitida"
        required: false
        description: "RubricaPermitida pai quando este registro representa uma subrubrica. Nulo para rubrica raiz."
      subRubricas:
        type: "list:ref:pre_award.captacao.RubricaPermitida"
        required: false
        description: "Subrubricas permitidas vinculadas a esta rubrica, quando permiteSubrubricas = true."
      bolsasPermitidas:
        type: "list:ref:pre_award.captacao.BolsaPermitida"
        required: false
        description: "Configuracoes de bolsa habilitadas quando esta rubrica for do tipo Bolsa."

  BolsaPermitida:
    description: "Versao de nivel de bolsa permitida na captacao, com limites operacionais de cotas e bolsistas."
    extends: "shared.Auditavel"
    fields:
      versaoNivel:
        type: "ref:corporativo.modalidade_bolsa.VersaoNivel"
        required: true
        description: "Versao do nivel de bolsa do M001 permitida nesta captacao."
      rubricaPermitida:
        type: "ref:pre_award.captacao.RubricaPermitida"
        required: true
        description: "Rubrica Bolsa que habilita a configuracao desta modalidade/nivel."
      quantidadeCotas:
        type: "integer"
        required: true
        description: "Quantidade de cotas disponiveis para a versao de nivel na captacao."
        domain: ">= 0"
      maximoBolsistas:
        type: "integer"
        required: true
        description: "Quantidade maxima de bolsistas que podem usar essa versao de nivel na captacao."
        domain: ">= 0"
      obrigatoria:
        type: "boolean"
        required: true
        description: "Indica se a proposta deve usar esta bolsa quando informar orcamento de bolsas."
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da versao de bolsa na captacao."

  DocumentoExigido:
    description: "Documento exigido do proponente na submissao, com regras de reaproveitamento do cadastro corporativo."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome do documento exigido."
      descricao:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao ou orientacao de envio do documento."
      obrigatorio:
        type: "boolean"
        required: true
        description: "Indica se o documento e obrigatorio na submissao."
      reutilizarCadastroCorporativo:
        type: "boolean"
        required: true
        description: "Indica se o documento deve ser reaproveitado do cadastro corporativo quando existir e estiver valido."
      exigirNovoEnvioSeVencido:
        type: "boolean"
        required: true
        description: "Indica se o proponente deve reenviar o documento quando o cadastro corporativo possuir documento vencido ou invalido."
      formatosPermitidos:
        type: "list:ref:pre_award.captacao.FormatoArquivo"
        required: false
        description: "Formatos de arquivo aceitos para este documento."

  FormatoArquivo:
    description: "Extensao de arquivo aceita para um DocumentoExigido."
    extends: null
    fields:
      extensao:
        type: "string"
        required: true
        max_length: 20
        description: "Extensao permitida (ex: PDF, DOCX, XLSX)."

relationships:
  - from: "pre_award.captacao.Captacao"
    relation: "configurada por"
    to: "pre_award.captacao.CronogramaCaptacao"
    cardinality: "1:1"
    description: "Cada captacao possui exatamente um cronograma com os 8 periodos obrigatorios."
  - from: "pre_award.captacao.Captacao"
    relation: "possui aportes"
    to: "pre_award.captacao.AporteFinanceiroCaptacao"
    cardinality: "1:N"
    description: "A captacao e financiada por um ou mais aportes de programas ou parcerias."
  - from: "pre_award.captacao.AporteFinanceiroCaptacao"
    relation: "origem programa"
    to: "planejamento.programas.Programa"
    cardinality: "N:1"
    description: "Aporte oriundo de um Programa (M010). Exclusivo com parceria."
  - from: "pre_award.captacao.AporteFinanceiroCaptacao"
    relation: "origem parceria"
    to: "planejamento.parcerias.Parceria"
    cardinality: "N:1"
    description: "Aporte oriundo de uma Parceria (M010). Exclusivo com programa."
  - from: "pre_award.captacao.Captacao"
    relation: "possui faixas"
    to: "pre_award.captacao.FaixaFinanciamento"
    cardinality: "1:N"
