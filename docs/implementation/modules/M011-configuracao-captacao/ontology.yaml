  - from: "pre_award.captacao.Captacao"
    relation: "pool de revisores"
    to: "pre_award.captacao.RevisorAdHoc"
    cardinality: "1:N"
  - from: "pre_award.captacao.Captacao"
    relation: "documentos exigidos"
    to: "pre_award.captacao.DocumentoExigido"
    cardinality: "1:N"
  - from: "pre_award.captacao.CronogramaCaptacao"
    relation: "composta por"
    to: "pre_award.captacao.PeriodoCronograma"
    cardinality: "1:8"
    description: "Exatamente 8 periodos obrigatorios, um por TipoPeriodo, em ordem sequencial."
  - from: "pre_award.captacao.PeriodoCronograma"
    relation: "historico de adiamentos"
    to: "pre_award.captacao.AdiamentoPeriodoCronograma"
    cardinality: "1:N"
  - from: "pre_award.captacao.RequisitoProponente"
    relation: "instituicao direcionada"
