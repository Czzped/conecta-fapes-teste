    cardinality: "N:1"
  - from: "pre_award.captacao.RequisitoProponente"
    relation: "tipo de instituicao"
    to: "corporativo.instituicoes.TipoInstituicao"
    cardinality: "N:1"
  - from: "pre_award.captacao.RequisitoProponente"
    relation: "nivel academico minimo"
    to: "corporativo.instituicoes.NivelAcademico"
    cardinality: "N:1"
  - from: "pre_award.captacao.ProponenteEscolhido"
    relation: "instituicao autorizada"
    to: "corporativo.instituicoes.Instituicao"
