  - from: "pre_award.captacao.Captacao"
    relation: "define requisito proponente"
    to: "pre_award.captacao.RequisitoProponente"
    cardinality: "1:1"
  - from: "pre_award.captacao.Captacao"
    relation: "define regra de avaliacao"
    to: "pre_award.captacao.RegraAvaliacao"
    cardinality: "1:1"
  - from: "pre_award.captacao.Captacao"
