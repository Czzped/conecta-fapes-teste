axioms:
  - id: "AX-M011-001"
    natural_language: "O cronograma de uma captacao deve conter exatamente 8 periodos, um para cada TipoPeriodo obrigatorio, antes da publicacao."
    formal_rule: "Captacao.estadoConfiguracao = PUBLICADO → |CronogramaCaptacao.periodos| = 8 ∧ ∀t ∈ TipoPeriodo: ∃p ∈ periodos: p.tipo = t"
  - id: "AX-M011-002"
    natural_language: "Um AporteFinanceiroCaptacao deve referenciar exatamente uma origem: Programa quando origemTipo = PROGRAMA, Parceria quando origemTipo = PARCERIA."
    formal_rule: "(origemTipo = PROGRAMA → programa ≠ null ∧ parceria = null) ∧ (origemTipo = PARCERIA → parceria ≠ null ∧ programa = null)"
  - id: "AX-M011-003"
    natural_language: "O total dos valorAportado das FaixaFinanciamento nao deve ultrapassar a soma dos valorAportado de todos os AporteFinanceiroCaptacao da captacao."
    formal_rule: "∑FaixaFinanciamento.valorAportado ≤ ∑AporteFinanceiroCaptacao.valorAportado"
  - id: "AX-M011-004"
    natural_language: "Quando tipoCaptacao = DEMANDA_INDUZIDA, o campo outorgadoDestinatario deve ser preenchido."
    formal_rule: "Captacao.tipoCaptacao = DEMANDA_INDUZIDA → Captacao.outorgadoDestinatario ≠ null"
  - id: "AX-M011-005"
    natural_language: "ProponenteEscolhido e usado somente quando RegraSubmissao.submissaoRestritaAEscolhidos = true."
    formal_rule: "∃ProponenteEscolhido → RegraSubmissao.submissaoRestritaAEscolhidos = true"
  - id: "AX-M011-006"
    natural_language: "ProponenteEscolhido deve apontar para exatamente uma Instituicao ou PessoaFisica, nunca ambas ou nenhuma."
    formal_rule: "(tipo = INSTITUICAO → instituicao ≠ null ∧ pessoa = null) ∧ (tipo = PESSOA → pessoa ≠ null ∧ instituicao = null)"
  - id: "AX-M011-007"
    natural_language: "Um adiamento desloca todas as etapas posteriores pelo mesmo numero de dias."
    formal_rule: "∀p_i: adiado → ∀p_j onde ordem(p_j) > ordem(p_i): p_j.dataInicio += dias ∧ p_j.dataFim += dias"
  - id: "AX-M011-008"
    natural_language: "RubricaPermitida que representa subrubrica deve ter rubricaPai preenchido; rubrica raiz tem rubricaPai nulo."
    formal_rule: "(rubricaPai ≠ null → rubricaPai.permiteSubrubricas = true) ∧ (rubricaPai = null → registro e raiz)"
  - id: "AX-M011-009"
    natural_language: "BolsaPermitida so pode ser configurada quando a RubricaPermitida referenciada for do tipo Bolsa."
    formal_rule: "BolsaPermitida.rubricaPermitida → corporativo.rubricas.Rubrica.tipo = BOLSA"
  - id: "AX-M011-010"
    natural_language: "FaixaFinanciamento.valorMaximo deve ser maior ou igual ao valorMinimo."
    formal_rule: "FaixaFinanciamento.valorMaximo >= FaixaFinanciamento.valorMinimo"
  - id: "AX-M011-011"
    natural_language: "Quando a RubricaPermitida configurada for DOACI (RUB-DOACI), o campo limitePercentual representa o teto imposto pelo edital e nunca pode exceder o percentual maximo da tabela normativa da Resolucao CCAF no 309/2022, item 2.4.8.1, para a faixa de valor maxima da captacao. Se o edital omitir limitePercentual para DOACI, o M013 aplica a tabela normativa diretamente no momento da validacao orcamentaria."
    formal_rule: "RubricaPermitida.rubrica = RUB-DOACI → (limitePercentual = null ∨ limitePercentual ≤ tabelaDOACI(FaixaFinanciamento.valorMaximo))"

invariants:
  - id: "INV-M011-001"
    rule: "PeriodoCronograma.dataFim >= PeriodoCronograma.dataInicio"
    description: "A data de fim de um periodo deve ser posterior ou igual a data de inicio."
  - id: "INV-M011-002"
    rule: "AdiamentoPeriodoCronograma.dias > 0"
    description: "Um adiamento deve acrescentar pelo menos 1 dia."
  - id: "INV-M011-003"
    rule: "AporteFinanceiroCaptacao.valorAportado > 0"
    description: "O valor aportado deve ser estritamente positivo."
  - id: "INV-M011-004"
    rule: "FaixaFinanciamento.duracaoMaximaMeses > 0"
    description: "A duracao maxima de uma faixa deve ser de pelo menos 1 mes."
  - id: "INV-M011-005"
    rule: "RegraAvaliacao.quantidadeMinimaRevisores >= 0"
    description: "A quantidade minima de revisores nao pode ser negativa."
  - id: "INV-M011-006"
    rule: "Captacao.estadoConfiguracao = PUBLICADO → Captacao.linkEdital ≠ null"
    description: "Uma captacao publicada deve ter o link do edital preenchido."
  - id: "INV-M011-007"
    rule: "RubricaPermitida.limitePercentual = null ∨ (RubricaPermitida.limitePercentual >= 0 ∧ RubricaPermitida.limitePercentual <= 100)"
    description: "O limite percentual de rubrica, quando informado, deve estar entre 0 e 100."

enums:
  TipoCaptacao:
    description: "Tipo da captacao de propostas."
    values:
      CHAMADA_PUBLICA: "Chamada aberta ao publico para submissao de propostas."
      DEMANDA_INDUZIDA: "Captacao direcionada a um destinatario especifico pre-definido."

  EstadoConfiguracaoCaptacao:
    description: "Estado do ciclo de vida da configuracao de uma captacao."
    values:
      EM_ANDAMENTO: "Captacao em processo de configuracao, ainda nao publicada."
      PUBLICADO: "Captacao publicada e disponivel para submissao de propostas."
      NAO_PUBLICADO: "Captacao despublicada apos ter sido publicada."
      ENCERRADO: "Captacao encerrada, resultado final publicado."

  TipoPeriodo:
    description: "Tipo de periodo obrigatorio do cronograma de uma captacao. Os 8 valores definem a ordem sequencial do fluxo."
    values:
      PUBLICACAO_CAPTACAO: "Periodo de publicacao da captacao (1o periodo — inicio do fluxo)."
      RECEBIMENTO_PROPOSTAS: "Periodo de recebimento de propostas dos proponentes (2o periodo)."
      AVALIACAO_DOCUMENTAL: "Periodo de avaliacao documental das propostas recebidas (3o periodo)."
      AVALIACAO_AD_HOC: "Periodo de avaliacao ad hoc por revisores especializados (4o periodo)."
      RESULTADO_PRELIMINAR: "Periodo de divulgacao do resultado preliminar (5o periodo)."
      RECEBIMENTO_REVISAO: "Periodo de recebimento de pedidos de revisao pelos proponentes (6o periodo)."
      RESULTADO_APOS_REVISAO: "Periodo de divulgacao do resultado apos analise das revisoes (7o periodo)."
      RESULTADO_FINAL: "Periodo de divulgacao do resultado final da captacao (8o periodo — fim do fluxo)."

  TipoOrigemAporte:
    description: "Tipo da origem do aporte financeiro para a captacao."
    values:
      PROGRAMA: "Aporte originado de um Programa (M010)."
      PARCERIA: "Aporte originado de uma Parceria (M010)."

  TipoProponenteEscolhido:
    description: "Tipo do proponente pre-selecionado para submissao restrita."
    values:
      INSTITUICAO: "Proponente do tipo pessoa juridica/instituicao."
      PESSOA: "Proponente do tipo pessoa fisica."

  TipoDirecionamentoProposta:
    description: "Define o direcionamento das propostas aceitas pela captacao."
    values:
      ABERTA: "Captacao aceita propostas de qualquer proponente habilitado."
      INSTITUICAO: "Captacao direcionada a uma instituicao especifica."
      TIPO_INSTITUICAO: "Captacao direcionada a um tipo de instituicao especifico."

value_objects: {}

events:
  - name: "CaptacaoPublicada"
    description: "Emitido quando a captacao transita para o estado PUBLICADO."
    payload_entity: "pre_award.captacao.Captacao"
    trigger: "Transicao de EM_ANDAMENTO para PUBLICADO com cronograma completo e link do edital preenchido."
  - name: "CaptacaoEncerrada"
    description: "Emitido quando a captacao transita para o estado ENCERRADO apos publicacao do resultado final."
    payload_entity: "pre_award.captacao.Captacao"
    trigger: "Publicacao do periodo RESULTADO_FINAL e transicao para ENCERRADO."
  - name: "PeriodoCronogramaAdiado"
    description: "Emitido quando um periodo do cronograma e adiado e as etapas posteriores sao deslocadas."
    payload_entity: "pre_award.captacao.AdiamentoPeriodoCronograma"
    trigger: "Registro de AdiamentoPeriodoCronograma com dias > 0 e justificativa."

workflows:
  CaptacaoStateMachine:
    states:
      - EM_ANDAMENTO
      - PUBLICADO
      - NAO_PUBLICADO
      - ENCERRADO
    transitions:
      - from: EM_ANDAMENTO
        to: PUBLICADO
        trigger: "publicar"
        guard: "Cronograma completo (8 periodos), linkEdital preenchido e formularios de submissao/avaliacao/revisao referenciados."
      - from: PUBLICADO
        to: NAO_PUBLICADO
        trigger: "despublicar"
        guard: "Nenhuma proposta submetida no periodo de recebimento ainda ativo."
      - from: NAO_PUBLICADO
        to: PUBLICADO
        trigger: "republicar"
        guard: "Ajustes realizados; cronograma e formularios ainda validos."
      - from: PUBLICADO
        to: ENCERRADO
        trigger: "encerrar"
        guard: "Periodo RESULTADO_FINAL concluido e resultado final publicado."

  CronogramaPeriodosSequencia:
    description: "Ordem obrigatoria dos 8 TipoPeriodo no fluxo da captacao."
    states:
      - PUBLICACAO_CAPTACAO
      - RECEBIMENTO_PROPOSTAS
      - AVALIACAO_DOCUMENTAL
      - AVALIACAO_AD_HOC
      - RESULTADO_PRELIMINAR
      - RECEBIMENTO_REVISAO
      - RESULTADO_APOS_REVISAO
      - RESULTADO_FINAL
    transitions:
      - from: PUBLICACAO_CAPTACAO
        to: RECEBIMENTO_PROPOSTAS
        trigger: "inicio recebimento"
      - from: RECEBIMENTO_PROPOSTAS
        to: AVALIACAO_DOCUMENTAL
        trigger: "encerramento recebimento"
      - from: AVALIACAO_DOCUMENTAL
        to: AVALIACAO_AD_HOC
        trigger: "inicio avaliacao ad hoc"
      - from: AVALIACAO_AD_HOC
        to: RESULTADO_PRELIMINAR
        trigger: "publicacao resultado preliminar"
      - from: RESULTADO_PRELIMINAR
        to: RECEBIMENTO_REVISAO
        trigger: "abertura periodo de revisao"
      - from: RECEBIMENTO_REVISAO
        to: RESULTADO_APOS_REVISAO
        trigger: "publicacao resultado apos revisao"
      - from: RESULTADO_APOS_REVISAO
        to: RESULTADO_FINAL
        trigger: "publicacao resultado final"

policies:
  permissions:
    GestorFAPES:
      can:
        - criar Captacao
        - editar Captacao em EM_ANDAMENTO
        - publicar Captacao
        - despublicar Captacao
        - encerrar Captacao
        - adicionar RevisorAdHoc
        - registrar AdiamentoPeriodoCronograma
    AnalistaTecnico:
      can:
        - visualizar Captacao
        - configurar CronogramaCaptacao
        - configurar RubricaPermitida
        - configurar BolsaPermitida
        - configurar DocumentoExigido

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "CronogramaCaptacao deve sempre conter exatamente 8 PeriodoCronograma, um por TipoPeriodo, antes da publicacao."
    - "A ordem dos TipoPeriodo e obrigatoria: PUBLICACAO_CAPTACAO → RECEBIMENTO_PROPOSTAS → AVALIACAO_DOCUMENTAL → AVALIACAO_AD_HOC → RESULTADO_PRELIMINAR → RECEBIMENTO_REVISAO → RESULTADO_APOS_REVISAO → RESULTADO_FINAL."
    - "AporteFinanceiroCaptacao deve referenciar exatamente um de: Programa (PROGRAMA) ou Parceria (PARCERIA)."
    - "O total financeiro da captacao e calculado pela soma dos aportes; nao aceitar entrada manual de total."
    - "ProponenteEscolhido so e valido quando RegraSubmissao.submissaoRestritaAEscolhidos = true."
    - "BolsaPermitida so pode ser configurada via RubricaPermitida do tipo Bolsa."
    - "RubricaPermitida auto-referencia hierarquica: rubricaPai = null indica raiz; subrubricas so possiveis quando permiteSubrubricas = true na rubrica pai."
    - "AdiamentoPeriodoCronograma deve deslocar todas as etapas posteriores pelo mesmo numero de dias."
    - "Programa, Parceria, AreaTecnica, TipoIniciativa, Instituicao, TipoInstituicao, NivelAcademico, PessoaFisica e Rubrica sao referencias externas — nao modelar aqui."
    - "Formularios (FormularioSubmissaoRef, FormularioAvaliacaoRef, FormularioRevisaoRef, FormularioAnexoRef) sao referencias ao M021 — apenas formularioId e versaoFormularioId."
    - "O M022 consome propostas aprovadas desta captacao para contratacao/outorga."
    - "DOACI (RUB-DOACI): quando configurar RubricaPermitida com esta rubrica, limitePercentual e o teto do edital — nao pode superar o limite da tabela normativa (Resolucao CCAF no 309/2022, item 2.4.8.1) para o valor maximo da faixa. Se omitido, a tabela normativa prevalece e o M013 valida."
  notes:
    - "OutorgadoDestinatario e um espelho desnormalizado de PessoaFisica (M008) para capturar o destinatario da demanda induzida no momento da configuracao."
    - "CategoriaIniciativa e gerenciada dentro deste modulo e permite selecao multipla no cadastro da captacao."
    - "Duvida em aberto: validar se todo comprovante deve ser DocumentoExigido ou se parte deles deve ser derivada de RequisitoProponente como evidencia documental de um requisito."
    - "Tabela DOACI normativa (Resolucao CCAF no 309/2022, 2.4.8.1): ate R$50k=15%; R$50k-R$100k=10%; R$100k-R$150k=5%; R$150k-R$300k=3%; R$300k-R$500k=1%; acima R$500k=0.5%. Base de calculo: valor total aprovado excluindo bolsas."
