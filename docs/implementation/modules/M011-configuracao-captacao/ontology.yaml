ontology: "Configuracao de Captacao"
namespace: "pre_award.captacao"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: shared.people
    path: path: "../../../ontology/shared/people.yaml"
  - namespace: corporativo.instituicoes
    path: path: "../M008-cadastros-corporativos/instituicoes/ontology.yaml"
  - namespace: corporativo.modalidade_bolsa
    path: path: "../M001-modalidade-bolsa/ontology.yaml"
  - namespace: corporativo.rubricas
    path: path: "../M008-cadastros-corporativos/rubricas/ontology.yaml"
  - namespace: planejamento.programas
    path: path: "../M010-planejamento-estrategia/programas/ontology.yaml"
  - namespace: planejamento.parcerias
    path: path: "../M010-planejamento-estrategia/parcerias/ontology.yaml"
  - namespace: planejamento.eixos
    path: path: "../M010-planejamento-estrategia/eixos/ontology.yaml"
metadata:
  module: "M011"
  source: "docs/implementation/modules/M011-configuracao-captacao/modelo-estrutural.md"
  version: "2.0.0"
  description: >
    Define tres processos sequenciais: (1) Fomento — aporte financeiro de Programa ou Parceria
    para um eixo estrategico, com faixas de investimento, rubricas por faixa e resultados esperados;
    (2) Configuracao da Selecao — a Area Tecnica define tipo de chamamento, cronograma e regras;
    (3) Selecao dos Projetos — execucao da captacao, recebimento de propostas, analise, resultado final.

# ─────────────────────────────────────────────────────────────
# PROCESSO 1 — FOMENTO
# Responsavel: GestorFomento (criar/aprovar/encerrar), AnalistaTecnico (rubricas/bolsas por faixa)
# ─────────────────────────────────────────────────────────────

entities:
  Fomento:
    description: >
      Agregado raiz do Processo 1. Representa o aporte financeiro de um ou mais Programas ou Parcerias
      do M010 para fomentar projetos de um eixo estrategico. Declara os tipos de projeto que deseja
      apoiar e define faixas de investimento — cada faixa e a regua de valor e duracao para um ou mais
      tipos de projeto especificos.
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        generated: true
        unique: true
        description: "Codigo unico gerado automaticamente."
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo do fomento."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao do objetivo e escopo do fomento."
      eixoEstrategico:
        type: "ref:planejamento.eixos.EixoEstrategico"
        required: true
        description: "Eixo do planejamento estrategico atingido por este fomento."
      estado:
        type: "enum:EstadoFomento"
        required: true
        description: "Estado corrente do fomento."
      dataInicio:
        type: "date"
        required: true
        description: "Data de inicio do periodo de vigencia do fomento."
      dataFim:
        type: "date"
        required: true
        description: "Data de fim do periodo de vigencia do fomento. Deve ser posterior a dataInicio."
      areaTecnica:
        type: "ref:corporativo.instituicoes.AreaTecnica"
        required: true
        description: "Area Tecnica da FAPES responsavel pela gestao deste fomento."
      tiposProjetoFomentados:
        type: "list:ref:corporativo.instituicoes.TipoIniciativa"
        required: true
        description: "Tipos de projeto que este fomento deseja apoiar (ex: Pesquisa, Inovacao, Extensao, Visita Tecnica)."
      aportes:
        type: "list:ref:pre_award.captacao.AporteFomento"
        required: true
        description: "Um ou mais aportes financeiros de Programas ou Parcerias."
      faixasInvestimento:
        type: "list:ref:pre_award.captacao.FaixaInvestimento"
        required: true
        description: "Uma ou mais faixas de investimento, cada uma vinculada a um ou mais tipos de projeto."
      resultadosEsperados:
        type: "list:ref:pre_award.captacao.ResultadoEsperadoFomento"
        required: false
        description: "Produtos, servicos ou processos esperados do fomento."
      aditivos:
        type: "list:ref:pre_award.captacao.AditivoFomento"
        required: false
        description: "Historico de aditivos de valor e/ou data aplicados ao fomento apos aprovacao."
      remanejamentos:
        type: "list:ref:pre_award.captacao.RemanejamentoFaixas"
        required: false
        description: "Historico de remanejamentos de valor entre faixas apos selecao dos projetos."

  RemanejamentoFaixas:
    description: >
      Registro imutavel de um remanejamento de valor entre duas faixas de investimento do mesmo
      Fomento. Ocorre apos a selecao dos projetos, quando a demanda real de uma faixa supera
      ou nao atinge o valor originalmente alocado. Preserva historico com valores anteriores
      de cada faixa.
    extends: "shared.Auditavel"
    fields:
      faixaOrigem:
        type: "ref:pre_award.captacao.FaixaInvestimento"
        required: true
        description: "Faixa que cede valor. Deve pertencer ao mesmo Fomento que a faixaDestino."
      faixaDestino:
        type: "ref:pre_award.captacao.FaixaInvestimento"
        required: true
        description: "Faixa que recebe valor. Deve ser diferente da faixaOrigem."
      valor:
        type: "decimal"
        required: true
        description: "Valor remanejado da faixaOrigem para a faixaDestino. Deve ser maior que zero e nao pode exceder o valorAportado efetivo da faixaOrigem."
        domain: "> 0"
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo do remanejamento — geralmente excesso ou falta de demanda em uma faixa."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o remanejamento foi registrado. Gerada automaticamente."
      valorOrigemAnterior:
        type: "decimal"
        required: true
        description: "valorAportado efetivo da faixaOrigem imediatamente antes do remanejamento. Preenchido automaticamente para historico."
      valorDestinoAnterior:
        type: "decimal"
        required: true
        description: "valorAportado efetivo da faixaDestino imediatamente antes do remanejamento. Preenchido automaticamente para historico."

  AditivoFomento:
    description: >
      Registro imutavel de um aditivo aplicado a um Fomento aprovado. Pode ampliar o valor total
      disponivel, prorrogar a data de fim ou ambos. Preserva historico completo com justificativa
      e valores anteriores.
    extends: "shared.Auditavel"
    fields:
      tipo:
        type: "enum:TipoAditivoFomento"
        required: true
        description: "Tipo do aditivo: VALOR, DATA ou VALOR_E_DATA."
      valorAdicionado:
        type: "decimal"
        required: false
        description: "Valor financeiro acrescentado ao fomento. Obrigatorio quando tipo = VALOR ou VALOR_E_DATA."
        domain: "> 0"
      novaDataFim:
        type: "date"
        required: false
        description: "Nova data de fim do fomento apos prorrogacao. Obrigatoria quando tipo = DATA ou VALOR_E_DATA. Deve ser posterior a dataFim vigente."
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo informado para o aditivo."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o aditivo foi registrado. Gerada automaticamente."
      dataFimAnterior:
        type: "date"
        required: false
        description: "Data de fim do fomento imediatamente antes deste aditivo. Preenchida automaticamente para historico."
      valorTotalAnterior:
        type: "decimal"
        required: false
        description: "Valor total do fomento imediatamente antes deste aditivo. Preenchido automaticamente para historico."

  AporteFomento:
    description: "Aporte financeiro de um Programa ou Parceria para o Fomento. Exatamente uma origem por registro."
    extends: "shared.Auditavel"
    fields:
      origemTipo:
        type: "enum:TipoOrigemAporte"
        required: true
        description: "Tipo da origem: PROGRAMA ou PARCERIA."
      valorAportado:
        type: "decimal"
        required: true
        description: "Valor financeiro aportado. Deve ser maior que zero."
        domain: "> 0"
      programa:
        type: "ref:planejamento.programas.Programa"
        required: false
        description: "Programa que aporta recurso. Obrigatorio quando origemTipo = PROGRAMA."
      parceria:
        type: "ref:planejamento.parcerias.Parceria"
        required: false
        description: "Parceria que aporta recurso. Obrigatoria quando origemTipo = PARCERIA."

  FaixaInvestimento:
    description: >
      Regua de valor e duracao para um ou mais tipos de projeto dentro do fomento. Define quanto
      e por quanto tempo um projeto daquele(s) tipo(s) pode ser financiado. Pode ser direcionada a
      um publico especifico e configura as rubricas permitidas para o orcamento dos projetos.
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome da faixa (ex: Pesquisa — Faixa A, Visita Tecnica)."
      tiposProjeto:
        type: "list:ref:corporativo.instituicoes.TipoIniciativa"
        required: true
        description: "Tipos de projeto para os quais esta faixa define os limites de investimento. Deve ter ao menos um tipo."
      publicoAlvo:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao do publico destinatario desta faixa, quando diferenciado."
      valorMinimo:
        type: "decimal"
        required: true
        description: "Valor financeiro minimo aceito para projetos nesta faixa."
        domain: ">= 0"
      valorMaximo:
        type: "decimal"
        required: true
        description: "Valor financeiro maximo aceito para projetos nesta faixa. Deve ser >= valorMinimo."
        domain: ">= valorMinimo"
      duracaoMaximaMeses:
        type: "integer"
        required: true
        description: "Duracao maxima do projeto nesta faixa, em meses."
        domain: "> 0"
      valorAportado:
        type: "decimal"
        required: true
        description: "Parcela do valor total do fomento alocada para esta faixa. Soma de todas as faixas nao pode ultrapassar o total dos aportes."
        domain: ">= 0"
      rubricasPermitidas:
        type: "list:ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: false
        description: "Rubricas autorizadas para o orcamento de projetos nesta faixa."

  RubricaPermitidaFaixa:
    description: "Rubrica autorizada para o orcamento de projetos em uma FaixaInvestimento, com limites e orientacoes."
    extends: "shared.Auditavel"
    fields:
      rubrica:
        type: "ref:corporativo.rubricas.Rubrica"
        required: true
        description: "Rubrica do cadastro corporativo M008 autorizada para esta faixa."
      obrigatoria:
        type: "boolean"
        required: true
        description: "Indica se o projeto deve usar esta rubrica ao informar orcamento."
      permiteSubrubricas:
        type: "boolean"
        required: true
        description: "Indica se a rubrica pode ter subrubricas permitidas nesta faixa."
      limiteValor:
        type: "decimal"
        required: false
        description: "Valor maximo permitido para esta rubrica na faixa."
        domain: ">= 0"
      limitePercentual:
        type: "decimal"
        required: false
        description: "Percentual maximo do valor da faixa permitido para esta rubrica."
        domain: "0 a 100"
      comprovantesEsperados:
        type: "string"
        required: false
        max_length: 1000
        description: "Orientacao de comprovantes esperados para prestacao de contas."
      restricoes:
        type: "string"
        required: false
        max_length: 1000
        description: "Exclusoes ou restricoes especificas para esta rubrica na faixa."
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da rubrica nesta faixa."
      rubricaPai:
        type: "ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: false
        description: "RubricaPermitidaFaixa pai quando este registro representa uma subrubrica. Nulo para raiz."
      subRubricas:
        type: "list:ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: false
        description: "Subrubricas vinculadas, quando permiteSubrubricas = true."
      bolsasPermitidas:
        type: "list:ref:pre_award.captacao.BolsaPermitidaFaixa"
        required: false
        description: "Configuracoes de bolsa habilitadas quando esta rubrica for do tipo Bolsa."

  BolsaPermitidaFaixa:
    description: "Versao de nivel de bolsa permitida em uma FaixaInvestimento, com limites operacionais de cotas e bolsistas."
    extends: "shared.Auditavel"
    fields:
      versaoNivel:
        type: "ref:corporativo.modalidade_bolsa.VersaoNivel"
        required: true
        description: "Versao do nivel de bolsa do M001 permitida nesta faixa."
      rubricaPermitida:
        type: "ref:pre_award.captacao.RubricaPermitidaFaixa"
        required: true
        description: "Rubrica do tipo Bolsa que habilita esta configuracao de modalidade/nivel."
      quantidadeCotas:
        type: "integer"
        required: true
        description: "Quantidade de cotas disponiveis para esta versao de nivel na faixa."
        domain: ">= 0"
      maximoBolsistas:
        type: "integer"
        required: true
        description: "Quantidade maxima de bolsistas que podem usar esta versao de nivel na faixa."
        domain: ">= 0"
      obrigatoria:
        type: "boolean"
        required: true
        description: "Indica se o projeto deve usar esta bolsa ao informar orcamento de bolsas."
      observacao:
        type: "string"
        required: false
        max_length: 500
        description: "Orientacao de uso da versao de bolsa na faixa."

  ResultadoEsperadoFomento:
    description: "Produto, servico ou processo esperado como resultado dos projetos financiados pelo fomento."
    extends: null
    fields:
      tipo:
        type: "enum:TipoResultado"
        required: true
        description: "Tipo do resultado esperado: PRODUTO, SERVICO ou PROCESSO."
      descricao:
        type: "string"
        required: true
        max_length: 500
        description: "Descricao do resultado esperado."
      indicador:
        type: "string"
        required: false
        max_length: 300
        description: "Indicador de medicao ou criterio de alcance do resultado."

# ─────────────────────────────────────────────────────────────
# PROCESSO 2 — CONFIGURACAO DA SELECAO
# Responsavel: AnalistaTecnico (da Area Tecnica)
# ─────────────────────────────────────────────────────────────

  Captacao:
    description: >
      Agregado raiz dos Processos 2 e 3. Representa a configuracao e a execucao da selecao de
      projetos sobre um Fomento aprovado. A Area Tecnica configura tipo de chamamento, cronograma,
      formularios e regras de selecao. O processo de selecao e executado a partir da publicacao.
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        generated: true
        unique: true
        description: "Codigo unico gerado automaticamente para a captacao."
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo da captacao."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Descricao resumida do objetivo e escopo da captacao."
      fomento:
        type: "ref:pre_award.captacao.Fomento"
        required: true
        description: "Fomento aprovado que financia esta captacao. Deve estar no estado APROVADO."
      faixasSelecionadas:
        type: "list:ref:pre_award.captacao.FaixaInvestimento"
        required: true
        description: "Uma ou mais faixas do Fomento ativadas nesta captacao. Definem os limites de investimento, tipos de projeto, rubricas e bolsas disponiveis para as propostas."
      areaTecnica:
        type: "ref:corporativo.instituicoes.AreaTecnica"
        required: true
        description: "Area Tecnica responsavel pela configuracao e conducao da selecao."
      tipoCaptacao:
        type: "enum:TipoCaptacao"
        required: true
        description: "Tipo da captacao: CHAMADA_PUBLICA ou DEMANDA_INDUZIDA."
      tipoOutorgado:
        type: "enum:TipoOutorgado"
        required: true
        description: "Tipo do outorgado esperado: PESSOA_FISICA ou PESSOA_JURIDICA. Em CHAMADA_PUBLICA define o perfil dos proponentes habilitados a receber outorga. Em DEMANDA_INDUZIDA deve coincidir com o tipo do outorgadoDestinatario."
      estadoConfiguracao:
        type: "enum:EstadoConfiguracaoCaptacao"
        required: true
        description: "Estado corrente da configuracao da captacao."
      edital:
        type: "ref:pre_award.captacao.Edital"
        required: true
        description: "Edital da captacao com as regras, podendo conter link externo e/ou documento anexado."
      outorgadoDestinatario:
        type: "ref:pre_award.captacao.OutorgadoDestinatario"
        required: false
        description: "Destinatario de uma demanda induzida. Obrigatorio quando tipoCaptacao = DEMANDA_INDUZIDA."
      tiposProjeto:
        type: "list:ref:corporativo.instituicoes.TipoIniciativa"
        required: true
        description: "Um ou mais tipos de projeto aceitos pela captacao."
      categoriasProjeto:
        type: "list:ref:pre_award.captacao.CategoriaProjeto"
        required: true
        description: "Uma ou mais categorias de projeto aceitas pela captacao."
      cronograma:
        type: "ref:pre_award.captacao.CronogramaCaptacao"
        required: true
        description: "Cronograma com os 8 periodos obrigatorios do fluxo de selecao."
      regraSubmissao:
        type: "ref:pre_award.captacao.RegraSubmissao"
        required: true
        description: "Regras que governam quem pode submeter propostas e sob quais condicoes."
      proponentesEscolhidos:
        type: "list:ref:pre_award.captacao.ProponenteEscolhido"
        required: false
        description: "Proponentes autorizados quando regraSubmissao.submissaoRestritaAEscolhidos = true."
      requisitoProponente:
        type: "ref:pre_award.captacao.RequisitoProponente"
        required: true
        description: "Requisitos impostos ao proponente desta captacao."
      regraAvaliacao:
        type: "ref:pre_award.captacao.RegraAvaliacao"
        required: true
        description: "Regras de analise de merito das propostas."
      prestacaoExigida:
        type: "ref:pre_award.captacao.PrestacaoExigida"
        required: true
        description: "Define se os projetos gerados exigem prestacao tecnica e/ou financeira."
      revisoresAdHoc:
        type: "list:ref:pre_award.captacao.RevisorAdHoc"
        required: true
        description: "Pool de revisores ad hoc disponivel para analise de merito nesta captacao."
      documentosExigidos:
        type: "list:ref:pre_award.captacao.DocumentoExigido"
        required: false
        description: "Documentos exigidos do proponente na submissao."
      formularioSubmissao:
        type: "ref:pre_award.captacao.FormularioSubmissaoRef"
        required: true
        description: "Referencia ao formulario de submissao publicado no M021."
      formularioAvaliacao:
        type: "ref:pre_award.captacao.FormularioAvaliacaoRef"
        required: true
        description: "Referencia ao formulario de avaliacao ad hoc publicado no M021."
      formularioRevisao:
        type: "ref:pre_award.captacao.FormularioRevisaoRef"
        required: true
        description: "Referencia ao formulario de revisao de resultado publicado no M021."
      formularioAnexo:
        type: "ref:pre_award.captacao.FormularioAnexoRef"
        required: false
        description: "Referencia opcional ao formulario de anexos publicado no M021."
      matrizConfiguracao:
        type: "ref:pre_award.captacao.MatrizConfiguracaoProjeto"
        required: true
        description: "Define quais blocos fixos da proposta sao exigidos, opcionais ou dispensados nesta captacao."

  OutorgadoDestinatario:
    description: >
      Destinatario de uma demanda induzida. Pode ser Pessoa Fisica ou Pessoa Juridica.
      Quando Pessoa Juridica, deve indicar uma Pessoa Fisica como contato responsavel.
    extends: null
    fields:
      tipo:
        type: "enum:TipoOutorgado"
        required: true
        description: "Tipo do destinatario: PESSOA_FISICA ou PESSOA_JURIDICA."
      cpf:
        type: "value_object:shared.CPF"
        required: false
        description: "CPF do destinatario. Obrigatorio quando tipo = PESSOA_FISICA."
      nome:
        type: "string"
        required: false
        max_length: 300
        description: "Nome do destinatario pessoa fisica. Obrigatorio quando tipo = PESSOA_FISICA."
      cnpj:
        type: "value_object:shared.CNPJ"
        required: false
        description: "CNPJ do destinatario. Obrigatorio quando tipo = PESSOA_JURIDICA."
      razaoSocial:
        type: "string"
        required: false
        max_length: 300
        description: "Razao social da pessoa juridica destinataria. Obrigatoria quando tipo = PESSOA_JURIDICA."
      contatoPF:
        type: "ref:shared.people.PessoaFisica"
        required: false
        description: "Pessoa fisica de contato na pessoa juridica destinataria. Obrigatoria quando tipo = PESSOA_JURIDICA."

  CategoriaProjeto:
    description: "Categoria de projeto aceita pela captacao, com indicador de disponibilidade para selecao multipla."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        unique: true
        max_length: 200
        description: "Nome da categoria (ex: Pesquisa, Inovacao, Extensao, Difusao, Capacitacao)."
      descricao:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao da categoria."
      selecionavelNoCadastro:
        type: "boolean"
        required: true
        description: "Indica se a categoria esta disponivel para selecao multipla no cadastro da captacao."

# ─────────────────────────────────────────────────────────────
# ENTIDADES DE SUPORTE — COMPARTILHADAS ENTRE PROCESSOS 2 E 3
# ─────────────────────────────────────────────────────────────

  MatrizConfiguracaoProjeto:
    description: >
      Define quais blocos fixos da proposta/projeto sao exigidos, opcionais ou dispensados
      nesta captacao. Evita que o M003 trate todos os blocos como obrigatorios — a obrigatoriedade
      concreta nasce aqui.
    extends: "shared.Auditavel"
    fields:
      equipe:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar equipe (papeis, quantidade prevista ou membros)."
      resultados:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar resultados esperados (entregas)."
      riscos:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar riscos, impacto, probabilidade e mitigacao."
      cronogramaProj:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar cronograma de atividades com datas."
      orcamento:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar valores planejados por rubrica."
      objetivos:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve informar objetivo geral e/ou objetivos especificos."
      beneficios:
        type: "enum:ObrigatoriedadeBloco"
        required: true
        description: "Define se a proposta deve declarar beneficios e indicadores."

  Edital:
    description: >
      Documento oficial com as regras da captacao. Deve conter ao menos um link externo ou
      um arquivo anexado. Ambos podem ser informados simultaneamente.
    extends: "shared.Auditavel"
    fields:
      titulo:
        type: "string"
        required: true
        max_length: 200
        description: "Titulo ou identificacao do edital."
      descricao:
        type: "string"
        required: false
        max_length: 1000
        description: "Resumo do conteudo ou escopo do edital."
      link:
        type: "string"
        required: false
        description: "URL para o edital publicado externamente (DOU, site da FAPES, etc.)."
      nomeArquivo:
        type: "string"
        required: false
        max_length: 255
        description: "Nome do arquivo do edital anexado. Preenchido quando o documento for carregado diretamente."
      urlArquivo:
        type: "string"
        required: false
        description: "URL de acesso ao arquivo armazenado. Gerada automaticamente apos upload."
      versao:
        type: "string"
        required: false
        max_length: 20
        description: "Versao do edital, quando houver rerratificacoes (ex: 1.0, 1.1)."

  CronogramaCaptacao:
    description: "Cronograma da captacao composto exatamente pelos 8 periodos obrigatorios do fluxo de selecao."
    extends: "shared.Auditavel"
    fields:
      descricao:
        type: "string"
        required: true
        max_length: 500
        description: "Descricao geral do cronograma."
      periodos:
        type: "list:ref:pre_award.captacao.PeriodoCronograma"
        required: true
        description: "Lista de exatamente 8 periodos, um para cada TipoPeriodo obrigatorio, em ordem sequencial."

  PeriodoCronograma:
    description: "Card operacional de uma fase do cronograma da captacao com data de inicio e fim."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome descritivo da fase (ex: Periodo de Recebimento de Propostas)."
      tipo:
        type: "enum:TipoPeriodo"
        required: true
        description: "Tipo da fase no fluxo. Define a ordem obrigatoria."
      dataInicio:
        type: "date"
        required: true
        description: "Data de inicio do periodo."
      dataFim:
        type: "date"
        required: true
        description: "Data de fim do periodo."
      adiamentos:
        type: "list:ref:pre_award.captacao.AdiamentoPeriodoCronograma"
        required: false
        description: "Historico de adiamentos aplicados a este periodo."

  AdiamentoPeriodoCronograma:
    description: "Registro imutavel de um adiamento aplicado a um periodo do cronograma com justificativa, datas originais e novas."
    extends: "shared.Auditavel"
    fields:
      dias:
        type: "integer"
        required: true
        description: "Quantidade de dias acrescida ao periodo e a todos os periodos posteriores."
        domain: "> 0"
      justificativa:
        type: "string"
        required: true
        max_length: 500
        description: "Motivo informado para o adiamento."
      dataRegistro:
        type: "date"
        required: true
        generated: true
        description: "Data em que o adiamento foi registrado. Gerada automaticamente."
      dataInicioOriginal:
        type: "date"
        required: true
        description: "Data inicial da etapa antes do adiamento."
      dataFimOriginal:
        type: "date"
        required: true
        description: "Data final da etapa antes do adiamento."
      dataInicioNova:
        type: "date"
        required: true
        description: "Data inicial da etapa apos o adiamento."
      dataFimNova:
        type: "date"
        required: true
        description: "Data final da etapa apos o adiamento."

  FormularioSubmissaoRef:
    description: "Referencia ao formulario de submissao publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioAvaliacaoRef:
    description: "Referencia ao formulario de avaliacao ad hoc publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioRevisaoRef:
    description: "Referencia ao formulario de revisao de resultado publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: true
        description: "Identificador do formulario no M021."
      versaoFormularioId:
        type: "string"
        required: true
        description: "Identificador da versao publicada selecionada no M021."

  FormularioAnexoRef:
    description: "Referencia opcional ao formulario de anexos publicado no M021."
    extends: null
    fields:
      formularioId:
        type: "string"
        required: false
        description: "Identificador do formulario de anexos no M021."
      versaoFormularioId:
        type: "string"
        required: false
        description: "Identificador da versao publicada selecionada no M021."

  RegraSubmissao:
    description: "Regras que governam quem pode submeter propostas e sob quais condicoes de acumulacao."
    extends: "shared.Auditavel"
    fields:
      permiteMultiplasPropostas:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode enviar mais de uma proposta."
      permiteParticiparEmOutraProposta:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode participar de outra proposta da mesma captacao."
      permiteAcumularBolsa:
        type: "boolean"
        required: true
        description: "Indica se o proponente pode acumular bolsa ativa em outro projeto."
      submissaoRestritaAEscolhidos:
        type: "boolean"
        required: true
        description: "Indica se apenas proponentes previamente escolhidos podem submeter proposta."
      exigeAprovacaoInstitucional:
        type: "boolean"
        required: true
        description: "Indica se a proposta submetida deve ser aprovada pelo responsavel da instituicao ou setor do proponente antes de seguir para analise documental."

  ProponenteEscolhido:
    description: "Proponente autorizado a submeter quando submissaoRestritaAEscolhidos = true. Aponta para exatamente uma Instituicao ou PessoaFisica."
    extends: null
    fields:
      tipo:
        type: "enum:TipoProponenteEscolhido"
        required: true
        description: "Tipo do proponente escolhido: INSTITUICAO ou PESSOA."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao autorizada. Obrigatoria quando tipo = INSTITUICAO."
      pessoa:
        type: "ref:shared.people.PessoaFisica"
        required: false
        description: "Pessoa fisica autorizada. Obrigatoria quando tipo = PESSOA."

  RequisitoProponente:
    description: "Requisitos impostos ao proponente: direcionamento, vinculo, gestor institucional e nivel academico minimo."
    extends: "shared.Auditavel"
    fields:
      direcionamento:
        type: "enum:TipoDirecionamentoProposta"
        required: true
        description: "Define se a proposta e aberta, direcionada a instituicao ou a tipo de instituicao."
      permiteParceriaInstituicoes:
        type: "boolean"
        required: true
        description: "Indica se a proposta pode envolver mais de uma instituicao."
      exigeVinculoEmpregaticio:
        type: "boolean"
        required: true
        description: "Indica se o proponente deve possuir vinculo empregaticio ativo."
      exigeGestorInstitucional:
        type: "boolean"
        required: true
        description: "Indica se a proposta deve informar gestor institucional."
      instituicao:
        type: "ref:corporativo.instituicoes.Instituicao"
        required: false
        description: "Instituicao permitida quando direcionamento = INSTITUICAO."
      tipoInstituicao:
        type: "ref:corporativo.instituicoes.TipoInstituicao"
        required: false
        description: "Tipo de instituicao permitido quando direcionamento = TIPO_INSTITUICAO."
      nivelAcademicoMinimo:
        type: "ref:corporativo.instituicoes.NivelAcademico"
        required: false
        description: "Nivel academico minimo exigido do proponente/coordenador."

  RegraAvaliacao:
    description: "Configuracao das regras de analise de merito (avaliacao ad hoc) das propostas recebidas."
    extends: "shared.Auditavel"
    fields:
      exigeAvaliacaoAdHoc:
        type: "boolean"
        required: true
        description: "Indica se a captacao exige analise de merito por revisores ad hoc."
      quantidadeMinimaRevisores:
        type: "integer"
        required: true
        description: "Quantidade minima de revisores ad hoc por proposta."
        domain: ">= 0"

  PrestacaoExigida:
    description: "Define se os projetos gerados por esta captacao exigirao prestacao tecnica e/ou financeira."
    extends: "shared.Auditavel"
    fields:
      exigePrestacaoTecnica:
        type: "boolean"
        required: true
        description: "Indica se os projetos gerados exigirao prestacao tecnica."
      exigePrestacaoFinanceira:
        type: "boolean"
        required: true
        description: "Indica se os projetos gerados exigirao prestacao financeira."

  RevisorAdHoc:
    description: "Papel operacional assumido por uma PessoaFisica como revisor ad hoc para analise de merito nesta captacao."
    extends: "shared.Auditavel"
    fields:
      pessoa:
        type: "ref:shared.people.PessoaFisica"
        required: true
        description: "Pessoa fisica que assume o papel de revisor ad hoc."
      dataInclusao:
        type: "date"
        required: true
        generated: true
        description: "Data em que a pessoa foi incluida no pool de revisores."
      areaAtuacao:
        type: "string"
        required: true
        max_length: 200
        description: "Area de conhecimento considerada para distribuicao das propostas."
      titulacao:
        type: "string"
        required: true
        max_length: 100
        description: "Titulacao academica do revisor (ex: Doutor, Mestre)."

  DocumentoExigido:
    description: "Documento exigido do proponente na submissao, com regras de reaproveitamento do cadastro corporativo."
    extends: "shared.Auditavel"
    fields:
      nome:
        type: "string"
        required: true
        max_length: 200
        description: "Nome do documento exigido."
      descricao:
        type: "string"
        required: false
        max_length: 500
        description: "Descricao ou orientacao de envio do documento."
      obrigatorio:
        type: "boolean"
        required: true
        description: "Indica se o documento e obrigatorio na submissao."
      reutilizarCadastroCorporativo:
        type: "boolean"
        required: true
        description: "Indica se o documento deve ser reaproveitado do cadastro corporativo quando existir e estiver valido."
      exigirNovoEnvioSeVencido:
        type: "boolean"
        required: true
        description: "Indica se o proponente deve reenviar o documento quando o cadastro corporativo possuir documento vencido ou invalido."
      formatosPermitidos:
        type: "list:ref:pre_award.captacao.FormatoArquivo"
        required: false
        description: "Formatos de arquivo aceitos para este documento."

  FormatoArquivo:
    description: "Extensao de arquivo aceita para um DocumentoExigido."
    extends: null
    fields:
      extensao:
        type: "string"
        required: true
        max_length: 20
        description: "Extensao permitida (ex: PDF, DOCX, XLSX)."

relationships:
  # Fomento
  - from: "pre_award.captacao.Fomento"
    relation: "financiado por"
    to: "pre_award.captacao.AporteFomento"
    cardinality: "1:N"
    description: "O fomento e financiado por um ou mais aportes de Programas ou Parcerias."
  - from: "pre_award.captacao.AporteFomento"
    relation: "origem programa"
    to: "planejamento.programas.Programa"
    cardinality: "N:1"
    description: "Aporte originado de um Programa (M010). Exclusivo com parceria."
  - from: "pre_award.captacao.AporteFomento"
    relation: "origem parceria"
    to: "planejamento.parcerias.Parceria"
    cardinality: "N:1"
    description: "Aporte originado de uma Parceria (M010). Exclusivo com programa."
  - from: "pre_award.captacao.Fomento"
    relation: "gerenciado por"
    to: "corporativo.instituicoes.AreaTecnica"
    cardinality: "N:1"
    description: "Area Tecnica da FAPES responsavel pela gestao do fomento."
  - from: "pre_award.captacao.Fomento"
    relation: "atinge eixo"
    to: "planejamento.eixos.EixoEstrategico"
    cardinality: "N:1"
    description: "O fomento esta vinculado a um eixo do planejamento estrategico."
  - from: "pre_award.captacao.Fomento"
    relation: "fomenta tipos de projeto"
    to: "corporativo.instituicoes.TipoIniciativa"
    cardinality: "N:N"
    description: "Tipos de projeto que o fomento deseja apoiar (ex: Pesquisa, Inovacao, Extensao, Visita Tecnica)."
  - from: "pre_award.captacao.Fomento"
    relation: "possui faixas"
    to: "pre_award.captacao.FaixaInvestimento"
    cardinality: "1:N"
  - from: "pre_award.captacao.FaixaInvestimento"
    relation: "aplica-se a tipos de projeto"
    to: "corporativo.instituicoes.TipoIniciativa"
    cardinality: "N:N"
    description: "Tipos de projeto para os quais esta faixa define os limites de valor e duracao."
  - from: "pre_award.captacao.Fomento"
    relation: "resultados esperados"
    to: "pre_award.captacao.ResultadoEsperadoFomento"
    cardinality: "1:N"
  - from: "pre_award.captacao.Fomento"
    relation: "historico de aditivos"
    to: "pre_award.captacao.AditivoFomento"
    cardinality: "1:N"
    description: "Aditivos de valor e/ou data registrados apos aprovacao do fomento."
  - from: "pre_award.captacao.Fomento"
    relation: "historico de remanejamentos"
    to: "pre_award.captacao.RemanejamentoFaixas"
    cardinality: "1:N"
    description: "Remanejamentos de valor entre faixas registrados apos selecao dos projetos."
  - from: "pre_award.captacao.RemanejamentoFaixas"
    relation: "faixa origem"
    to: "pre_award.captacao.FaixaInvestimento"
    cardinality: "N:1"
  - from: "pre_award.captacao.RemanejamentoFaixas"
    relation: "faixa destino"
    to: "pre_award.captacao.FaixaInvestimento"
    cardinality: "N:1"
  - from: "pre_award.captacao.FaixaInvestimento"
    relation: "rubricas permitidas"
    to: "pre_award.captacao.RubricaPermitidaFaixa"
    cardinality: "1:N"
  - from: "pre_award.captacao.RubricaPermitidaFaixa"
    relation: "referencia rubrica"
    to: "corporativo.rubricas.Rubrica"
    cardinality: "N:1"
  - from: "pre_award.captacao.RubricaPermitidaFaixa"
    relation: "pai de"
    to: "pre_award.captacao.RubricaPermitidaFaixa"
