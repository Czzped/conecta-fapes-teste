      CANCELADO: "Pagamento cancelado."
      SUSPENSAO_POR_SOLICITACAO: "Pagamento suspenso a pedido do bolsista ou projeto."
      FALHA_AGENDAMENTO: "Erro no agendamento bancario. Requer reprocessamento."
