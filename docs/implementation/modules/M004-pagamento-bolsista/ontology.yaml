value_objects: {}

events:
  - name: "FolhaGerada"
    description: "Emitido quando uma Folha e criada no status GERADA."
    payload_entity: "financeiro.pagamento.Folha"
    trigger: "DecisaoFolha.tipoAcao = GERAR"
  - name: "FolhaAutorizada"
    description: "Emitido quando uma Folha tem status alterado para AUTORIZADA."
    payload_entity: "financeiro.pagamento.Folha"
    trigger: "DecisaoFolha.tipoAcao = AUTORIZAR"
  - name: "FolhaCancelada"
    description: "Emitido quando uma Folha e cancelada."
    payload_entity: "financeiro.pagamento.Folha"
    trigger: "DecisaoFolha.tipoAcao = CANCELAR"
  - name: "RemessaProcessada"
    description: "Emitido quando ProcessoRemessa completa com sucesso."
    payload_entity: "financeiro.pagamento.Remessa"
    trigger: "ProcessoRemessa.status = PROCESSADA_COM_SUCESSO"
  - name: "RemessaProcessadaComErro"
    description: "Emitido quando ProcessoRemessa termina com erro."
    payload_entity: "financeiro.pagamento.ProcessoRemessa"
    trigger: "ProcessoRemessa.status = PROCESSADA_COM_ERRO"
  - name: "PagamentoBolsistaEfetuado"
    description: "Emitido quando um PagamentoBolsista atinge status PAGO."
    payload_entity: "financeiro.pagamento.PagamentoBolsista"
    trigger: "PagamentoBolsista.status = PAGO"
  - name: "EditalCompetenciaLiberada"
    description: "Emitido quando uma EditalCompetencia tem decisao de liberacao aprovada."
    payload_entity: "financeiro.pagamento.EditalCompetencia"
    trigger: "DecisaoLiberacao.ehLiberado = true"

workflows:
  CicloMensalPagamento:
    description: "Fluxo principal do ciclo mensal de pagamento de bolsistas."
    states:
      - PLANEJAMENTO
      - LIBERACAO_EDITAIS
      - GERACAO_FOLHA
      - AUTORIZACAO_FOLHA
      - AGENDAMENTO_BANCARIO
      - PAGAMENTO_EFETUADO
    transitions:
      - from: "PLANEJAMENTO"
        to: "LIBERACAO_EDITAIS"
        trigger: "PlanoMensal criado com marcos definidos"
      - from: "LIBERACAO_EDITAIS"
        to: "GERACAO_FOLHA"
        trigger: "Todos EditalCompetencia com status LIBERADO ou NAO_LIBERADO"
      - from: "GERACAO_FOLHA"
        to: "AUTORIZACAO_FOLHA"
        trigger: "Folha gerada — DecisaoFolha.tipoAcao = GERAR"
      - from: "AUTORIZACAO_FOLHA"
        to: "AGENDAMENTO_BANCARIO"
        trigger: "DecisaoFolha.tipoAcao = AUTORIZAR"
      - from: "AUTORIZACAO_FOLHA"
        to: "GERACAO_FOLHA"
        trigger: "DecisaoFolha.tipoAcao = REJEITAR — nova folha necessaria"
      - from: "AGENDAMENTO_BANCARIO"
        to: "PAGAMENTO_EFETUADO"
        trigger: "RemessaPagamento.status = EFETIVADA"

  ProcessoRemessa:
    description: "Fluxo assincrono de processamento de remessa bancaria com retry."
    states:
      - AGUARDANDO_PROCESSAMENTO
      - EM_PROCESSAMENTO
      - PROCESSADA_COM_SUCESSO
      - PROCESSADA_COM_ERRO
    transitions:
      - from: "AGUARDANDO_PROCESSAMENTO"
        to: "EM_PROCESSAMENTO"
        trigger: "Worker disponivel pega processo da fila"
      - from: "EM_PROCESSAMENTO"
        to: "PROCESSADA_COM_SUCESSO"
        trigger: "Processamento concluido sem falhas"
      - from: "EM_PROCESSAMENTO"
        to: "PROCESSADA_COM_ERRO"
        trigger: "Erro no processamento OU tentativa >= limite"
      - from: "PROCESSADA_COM_ERRO"
        to: "AGUARDANDO_PROCESSAMENTO"
        trigger: "Retry manual ou automatico se tentativa < limite"

policies:
  permissions:
    GestorFinanceiro:
      can:
        - "criar PlanoMensal"
        - "registrar DecisaoLiberacao"
        - "gerar Folha"
        - "autorizar Folha"
        - "rejeitar Folha"
        - "cancelar Folha"
        - "criar GuiaDeLiberacao"
        - "enviar RemessaCadastro"
        - "enviar RemessaPagamento"
        - "visualizar todos PagamentoBolsista"
    Coordenador:
      can:
        - "visualizar PlanoMensal"
        - "visualizar EditalCompetencia de seus editais"
        - "visualizar PagamentoBolsista de seus projetos"
    Bolsista:
      can:
        - "visualizar PagamentoBolsista proprios"

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "Pagamentos so podem ocorrer para AlocacaoBolsista no estado IMPLEMENTADA (M009)."
    - "Folha.titulo e Folha.ordem sao campos gerados — nao aceitar input manual."
    - "BonusPagamento.tipoBonus determina qual campo de valor e obrigatorio (valorFixo ou porcentagem)."
    - "Enums marcados com todo: 'Implementation pending' nao devem ser usados em implementacoes ate aprovacao."
    - "ProcessoRemessa usa retry — verificar tentativa vs limite antes de marcar como erro definitivo."
    - "Remessa.numero so e preenchido apos retorno bancario — nao gerar localmente."
    - "Usuario em DecisaoLiberacao e DecisaoFolha e snapshot denormalizado — nao referenciar entidade viva de usuarios."
  notes:
    - "Integra com Banestes via arquivos de remessa e retorno @-EDI. Envio e recebimento atualmente manuais."
    - "GuiaDeLiberacao e gerada apos autorizacao de Folha e enviada ao BANDES."
    - "Arquivos de remessa sao armazenados no MinIO (object storage). Referenciados por pathMinio em ProcessoRemessa."
    - "Contratante contem dados bancarios da FAPES usados nos cabecalhos dos arquivos de remessa."
    - "M002 (Importacao SIGFAPES) pode criar PagamentoBolsista com status PAGAMENTO_EXTERNO para historico legado."
    - "Downstream: M016 (Contabilidade) e M017 (PLD) consomem eventos de pagamento. M018 (BI) consome todos os dados."
