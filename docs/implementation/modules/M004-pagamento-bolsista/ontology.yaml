      LIBERADO: "Edital liberado para inclusao em folha."
      NAO_LIBERADO: "Edital nao liberado para o mes. Requer justificativa."
      INCLUIDO_EM_FOLHA: "Edital ja incluido em folha de pagamento."

  StatusFolha:
    description: "Status do ciclo de vida de uma Folha de pagamento."
    values:
      GERADA: "Folha criada, aguardando autorizacao."
      AUTORIZADA: "Folha autorizada pelo gestor financeiro."
      CANCELADA: "Folha cancelada antes do pagamento."
      REJEITADA: "Folha rejeitada pelo gestor."
      EM_AGENDAMENTO: "Folha em processo de agendamento bancario."
      AGENDADA: "Pagamentos agendados no banco."
      PAGA: "Pagamentos confirmados como efetuados."
      SOLICITADO_AO_BANDES:
        value: "SOLICITADO_AO_BANDES"
        todo: "Implementation pending — previsto no modelo comportamental para o fluxo completo BANDES, ainda nao implementado no codigo."
      REMESSAS_AUTORIZADAS:
        value: "REMESSAS_AUTORIZADAS"
        todo: "Implementation pending — previsto no modelo comportamental para o fluxo completo BANDES, ainda nao implementado no codigo."

  TipoAcaoFolha:
    description: "Tipo de acao registrada em DecisaoFolha."
    values:
      GERAR: "Acao de geracao da folha."
      CANCELAR: "Acao de cancelamento da folha."
      AUTORIZAR: "Acao de autorizacao da folha."
      REJEITAR: "Acao de rejeicao da folha."

  StatusPagamentoBolsista:
    description: "Status do ciclo de vida de um PagamentoBolsista."
    values:
