ontology: "Diarias"
namespace: "corporativo.diarias"
imports:
  - namespace: shared
    path: "../../../ontology/shared/base.yaml"
metadata:
  module: "M008"
  source: "docs/implementation/modules/M008-cadastros-corporativos/diarias/modelo-estrutural.md"
  version: "1.1.0"
  description: "Cadastros corporativos para calculo de diarias: abrangencia, tipos de diaria com valor vigente e parametros normativos. Consumido por M003 para calculo e snapshot de solicitacoes."

entities:
  Abrangencia:
    description: "Classifica o tipo de deslocamento para fins de diaria (DENTRO_ESTADO, NACIONAL, INTERNACIONAL). Codigo deve ser unico."
    fields:
      codigo:
        type: string
        required: true
        description: "Codigo canonico da abrangencia. Unico."
        max_length: 40
        unique: true
        domain: "DENTRO_ESTADO | NACIONAL | INTERNACIONAL"
      nome:
        type: string
        required: true
        description: "Nome de exibicao nos formularios e listagens."
        max_length: 150
      descricao:
        type: string
        required: false
        description: "Descricao operacional da abrangencia."
        max_length: 500
      ativo:
        type: boolean
        required: true
        description: "Indica se a abrangencia aceita novos TipoDiaria."

  TipoDiaria:
    description: "Valor unitario vigente de diaria para uma Abrangencia em um periodo. Quando o valor muda, cria-se novo TipoDiaria com nova vigencia — o anterior e desativado. M003 faz snapshot no momento da criacao da SolicitacaoDiaria."
    fields:
      abrangencia:
        type: "ref:corporativo.diarias.Abrangencia"
        required: true
        description: "Abrangencia a qual este tipo pertence."
      valorUnitario:
        type: decimal
        required: true
        description: "Valor unitario vigente. Deve ser maior que zero."
      vigenciaInicio:
        type: date
        required: true
        description: "Inicio da vigencia do tipo de diaria."
      vigenciaFim:
        type: date
        required: false
        description: "Fim da vigencia. Nulo = vigente."
      ativo:
        type: boolean
        required: true
        description: "Indica se o tipo esta disponivel para novas solicitacoes."

  ParametroCalculoDiaria:
    description: "Parametros normativos usados pelo M003 para calcular quantidade, acrescimos, bloqueios e elegibilidade. Vinculado a um TipoDiaria com vigencia propria — parametros podem mudar sem alterar o valor unitario. M003 faz snapshot no momento da criacao."
    fields:
      tipoDiaria:
        type: "ref:corporativo.diarias.TipoDiaria"
        required: true
        description: "Tipo de diaria ao qual estes parametros pertencem."
      normaReferencia:
        type: string
        required: true
        description: "Decreto, resolucao ou ato normativo que fundamenta os parametros."
        max_length: 200
      horasMinimasSemPernoite:
        type: integer
        required: true
        description: "Horas minimas de afastamento para gerar meia diaria sem pernoite (ex: 6)."
      percentualDiariaSemPernoite:
        type: decimal
        required: true
        description: "Fracao do valor unitario aplicada quando nao ha pernoite e o minimo de horas e atingido (ex: 0.5)."
      horaLimiteRetornoAcrescimo:
        type: integer
        required: true
        description: "Hora de retorno a partir da qual incide acrescimo no ultimo dia (ex: 14)."
      percentualAcrescimoRetorno:
        type: decimal
        required: true
        description: "Fracao do valor unitario acrescida quando retorno ocorre apos o limite (ex: 0.5)."
      distanciaMinimaKm:
        type: integer
        required: false
        description: "Distancia minima em km para elegibilidade. Nulo = sem exigencia. Aplicavel a DENTRO_ESTADO."
      bloqueiaRegiaoMetropolitanaSemPernoite:
        type: boolean
        required: true
        description: "Bloqueia viagem sem pernoite quando origem e destino estao na mesma regiao metropolitana. Aplicavel a DENTRO_ESTADO."
      bloqueiaMunicipioLimitrofeSemPernoite:
        type: boolean
        required: true
        description: "Bloqueia viagem sem pernoite entre municipios limitrofes. Aplicavel a DENTRO_ESTADO."
      estadoOrigemValido:
        type: string
        required: true
        description: "UF valida para a cidade de origem. Parametrizavel para permitir mudancas sem deploy. Aplicavel a DENTRO_ESTADO. (ex: ES)"
        max_length: 2
      percentualComplementoTransporte:
        type: decimal
        required: false
        description: "Percentual adicional sobre o valor total para complemento de transporte urbano. Nulo = sem complemento. Aplicavel a NACIONAL. (ex: 0.2)"
      vigenciaInicio:
        type: date
        required: true
        description: "Inicio da vigencia normativa dos parametros."
      vigenciaFim:
        type: date
        required: false
        description: "Fim da vigencia normativa. Nulo = vigente."
      ativo:
        type: boolean
        required: true
        description: "Indica se estes parametros estao ativos para novas consultas."

relationships:
  - from: "corporativo.diarias.Abrangencia"
    relation: "classifica"
    to: "corporativo.diarias.TipoDiaria"
    cardinality: "1:N"
    description: "Uma Abrangencia pode ter multiplos TipoDiaria ao longo do tempo (historico de valores)."

  - from: "corporativo.diarias.TipoDiaria"
    relation: "possui parametros"
    to: "corporativo.diarias.ParametroCalculoDiaria"
    cardinality: "1:N"
    description: "Um TipoDiaria possui um ou mais ParametroCalculoDiaria (historico normativo)."

axioms:
  - id: "AX001"
    natural_language: "TipoDiaria sempre possui uma abrangencia."
    formal_rule: "TipoDiaria.abrangencia IS NOT NULL"

  - id: "AX002"
    natural_language: "Nao pode haver vigencia ativa sobreposta para a mesma abrangencia."
    formal_rule: "NOT EXISTS t1, t2: TipoDiaria WHERE t1 != t2 AND t1.abrangencia == t2.abrangencia AND t1.ativo AND t2.ativo AND overlaps(t1.vigenciaInicio, t1.vigenciaFim, t2.vigenciaInicio, t2.vigenciaFim)"

  - id: "AX003"
    natural_language: "ParametroCalculoDiaria sempre pertence a exatamente um TipoDiaria."
    formal_rule: "ParametroCalculoDiaria.tipoDiaria IS NOT NULL"

  - id: "AX004"
    natural_language: "Nao pode haver ParametroCalculoDiaria ativo com vigencia sobreposta para o mesmo TipoDiaria."
    formal_rule: "NOT EXISTS p1, p2: ParametroCalculoDiaria WHERE p1 != p2 AND p1.tipoDiaria == p2.tipoDiaria AND p1.ativo AND p2.ativo AND overlaps(p1.vigenciaInicio, p1.vigenciaFim, p2.vigenciaInicio, p2.vigenciaFim)"

invariants:
  - id: "INV001"
    rule: "TipoDiaria.valorUnitario > 0"
    description: "Valor unitario da diaria deve ser maior que zero."

  - id: "INV002"
    rule: "ParametroCalculoDiaria.distanciaMinimaKm IS NULL OR ParametroCalculoDiaria.distanciaMinimaKm >= 0"
    description: "Distancia minima, quando informada, deve ser maior ou igual a zero."

enums: {}
value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar os axioms."
    - "Nao permitir sobreposicao de vigencia ativa para o mesmo TipoDiaria ou ParametroCalculoDiaria."
    - "M003 consome TipoDiaria e ParametroCalculoDiaria por referencia e grava snapshots imutaveis na SolicitacaoDiaria."
    - "Distancia entre origem e destino e calculada pelo M003 via provedor externo no momento da criacao da solicitacao."
  notes:
    - "Campos opcionais de ParametroCalculoDiaria dependem da abrangencia — nao forcar preenchimento quando inaplicavel."
    - "estadoOrigemValido e parametrizavel para permitir mudancas sem deploy."
