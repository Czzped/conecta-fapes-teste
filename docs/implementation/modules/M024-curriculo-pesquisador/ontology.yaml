events:
  - name: "CurriculoSincronizado"
    description: "Emitido apos sincronizacao bem-sucedida do curriculo com a Plataforma Lattes."
    payload_entity: "post_award.curriculo.Curriculo"
    trigger: "Sincronizacao Lattes bem-sucedida via M023 adapter"
  - name: "NivelAcademicoAtualizado"
    description: "Emitido apos sincronizacao quando o nivel academico derivado da FormacaoAcademica mais alta concluida difere do nivel atual em PessoaFisica."
    payload_entity: "post_award.curriculo.Curriculo"
    trigger: "Curriculo.derivarNivelAcademico() detecta diferenca"

workflows: null

policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "M024 nao redefine entidades canonicas de M008 (PessoaFisica, Instituicao, AreaConhecimento, Cidade) — apenas referencia."
    - "Snapshots sao importados via adapter M023/lattes; dados nao mapeados seguem politica match-or-create de M008."
    - "Ao referenciar entidades de M008, usar o namespace do submodulo correto."
    - "Artigo e Projeto sao entidades compartilhadas — podem pertencer a multiplos curriculos; nao apagar se ainda referenciados."
    - "Periodico, NivelOrientacao e TipoProjeto sao cadastros locais compartilhados — nao apagar por reimportacao."
    - "FormacaoAcademica, Orientacao, Livro, ParticipacaoProjeto, ParticipacaoEvento, Premio, Idioma e FormaCitacao sao composicoes de Curriculo — apagados e recriados a cada reimportacao."
    - "FormaCitacao e a juncao entre Curriculo e Artigo — PessoaFisica e alcancada atraves do Curriculo, nao diretamente pelo artigo."
    - "Autores nao resolvidos para um Curriculo nao geram FormaCitacao — nunca armazenar referencia pendente."
    - "Nao criar entidade separada para Capitulo; usar campo tipo = Capitulo em Livro."
    - "Cada idioma deve aparecer uma unica vez por curriculo — deduplicar por nome normalizado durante importacao."
    - "local em ParticipacaoEvento e opcional — nao rejeitar importacao por ausencia."
    - "entidade em Premio e opcional — nao rejeitar importacao por ausencia."
    - "Valores iniciais de NivelOrientacao: IC (Iniciacao Cientifica), M (Mestrado), D (Doutorado), PD (Pos-Doutorado)."
    - "Valores iniciais de TipoProjeto: PESQUISA, EXTENSAO, DESENVOLVIMENTO, ENSINO, OUTRO."
    - "qualis em Periodico nao e dado canonico do Lattes; deixar vazio quando indisponivel."
  notes:
    - "NivelAcademico em PessoaFisica e derivado da FormacaoAcademica mais alta concluida e atualizado apos cada sincronizacao."
    - "O flag Pesquisador em PessoaFisica e derivado da existencia de um Curriculo vinculado — nao e entidade propria."
    - "Lattes adapter M023 normaliza snapshots XML; dados nao mapeados reconciliados via M008 match-or-create."
    - "Artigos sustentam o filtro producaoMinima usado por M011 na selecao de pareceristas Ad Hoc."
