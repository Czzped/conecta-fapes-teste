ontology: "Participacoes em Eventos"
namespace: "post_award.curriculo.eventos"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.curriculo
    path: path: "ontology.yaml"
metadata:
  module: "M024"
  source: "docs/implementation/modules/M024-curriculo-pesquisador/submodelos/07-eventos.md"
  version: "1.0.0"
  description: "Participacoes do pesquisador em eventos cientificos (congressos, simposios, workshops) com papel, ano e local quando inferivel."

entities:
  ParticipacaoEvento:
    description: "Participacao do pesquisador em evento cientifico registrada no curriculo Lattes; composicao de Curriculo."
    extends: "shared.Auditavel"
    fields:
      curriculoId:
        type: "Guid"
        required: true
        description: "FK para Curriculo ao qual a participacao pertence."
      nome:
        type: "string"
        required: true
        description: "Nome do evento cientifico."
        max_length: 500
      papel:
        type: "PapelEvento"
        required: true
        description: "Papel do pesquisador no evento."
      ano:
        type: "integer"
        required: true
        description: "Ano de realizacao do evento (4 digitos)."
      localId:
        type: "Guid"
        required: false
        description: "FK para Cidade (M008) onde o evento ocorreu; opcional pois o Lattes nem sempre informa cidade de forma estruturada."

relationships:
  - from: "post_award.curriculo.Curriculo"
    relation: "possui"
    to: "post_award.curriculo.eventos.ParticipacaoEvento"
    cardinality: "1:N"
  - from: "post_award.curriculo.eventos.ParticipacaoEvento"
    relation: "realizado em"
    to: "shared.geography.Cidade"
    cardinality: "N:1"
    optional: true

axioms:
  - id: "AX-M024-E01"
    natural_language: "Reimportacao apaga todas as ParticipacaoEvento anteriores do curriculo e recria a partir do snapshot atual."
    formal_rule: "ON reimportacao(curriculoId): DELETE ParticipacaoEvento WHERE curriculoId = :id THEN INSERT FROM snapshot"
  - id: "AX-M024-E02"
    natural_language: "local e opcional — nao bloquear importacao quando Lattes nao informar cidade estruturada."
    formal_rule: "ParticipacaoEvento.localId MAY BE NULL"

invariants:
  - id: "INV-M024-E01"
    rule: "ParticipacaoEvento.ano >= 1900 AND ParticipacaoEvento.ano <= CURRENT_YEAR + 1"
    description: "Ano do evento deve ser plausivel."

enums:
  PapelEvento:
    values:
      Apresentador: "Pesquisador apresentou trabalho no evento."
      Ouvinte: "Pesquisador participou como ouvinte."
      Organizador: "Pesquisador integrou a comissao organizadora do evento."
      Convidado: "Pesquisador participou como convidado ou palestrante especial."

value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "ParticipacaoEvento e composicao de Curriculo — apagada e recriada na reimportacao."
    - "local e opcional — nao rejeitar importacao por ausencia de cidade."
  notes: []
