ontology: "Projetos Academicos"
namespace: "post_award.curriculo.projetos"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.curriculo
    path: path: "ontology.yaml"
metadata:
  module: "M024"
  source: "docs/implementation/modules/M024-curriculo-pesquisador/submodelos/06-projetos.md"
  version: "1.0.0"
  description: "Projetos de pesquisa, extensao, desenvolvimento ou ensino registrados no curriculo Lattes; projetos sao entidades compartilhadas vinculadas por ParticipacaoProjeto."

entities:
  Projeto:
    description: "Projeto academico registrado no Lattes; entidade compartilhada que pode aparecer em multiplos curriculos via ParticipacaoProjeto, deduplicado por (titulo, dataInicio, tipo, financiador)."
    extends: "shared.Auditavel"
    fields:
      titulo:
        type: "string"
        required: true
        description: "Titulo do projeto de pesquisa."
        max_length: 500
      dataInicio:
        type: "Date"
        required: true
        description: "Data de inicio do projeto."
      dataFim:
        type: "Date"
        required: false
        description: "Data de encerramento — obrigatoria quando status = Concluido; vazia quando status = EmAndamento."
      status:
        type: "StatusProjeto"
        required: true
        description: "Estado atual do projeto."
      tipoProjetoId:
        type: "Guid"
        required: true
        description: "FK para TipoProjeto — cadastro local de tipos."
      financiadorId:
        type: "Guid"
        required: false
        description: "FK para Instituicao (M008) financiadora, quando declarada no Lattes."

  ParticipacaoProjeto:
    description: "Vinculo entre um Curriculo e um Projeto; carrega o papel exercido pelo pesquisador no projeto, pois pessoas diferentes podem ter papeis distintos no mesmo projeto."
    extends: "shared.Auditavel"
    fields:
      curriculoId:
        type: "Guid"
        required: true
        description: "FK para Curriculo ao qual a participacao pertence."
      projetoId:
        type: "Guid"
        required: true
        description: "FK para Projeto ao qual a participacao se refere."
      participanteId:
        type: "Guid"
        required: true
        description: "FK para PessoaFisica (M008) que exerce o papel no projeto; normalmente o titular do curriculo."
      papel:
        type: "PapelProjeto"
        required: true
        description: "Papel da pessoa no projeto."

  TipoProjeto:
    description: "Cadastro local de tipos de projeto academico; compartilhado entre curriculos, nao apagado por reimportacao."
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        description: "Codigo canonico do tipo de projeto (PESQUISA, EXTENSAO, DESENVOLVIMENTO, ENSINO, OUTRO)."
        max_length: 20
        unique: true
      nome:
        type: "string"
        required: true
        description: "Nome do tipo de projeto."
        max_length: 100
      descricao:
        type: "string"
        required: false
        description: "Descricao do tipo de projeto."
        max_length: 500

relationships:
  - from: "post_award.curriculo.Curriculo"
    relation: "participa de"
    to: "post_award.curriculo.projetos.ParticipacaoProjeto"
    cardinality: "1:N"
  - from: "post_award.curriculo.projetos.ParticipacaoProjeto"
    relation: "referencia"
    to: "post_award.curriculo.projetos.Projeto"
    cardinality: "N:1"
  - from: "post_award.curriculo.projetos.ParticipacaoProjeto"
    relation: "participante"
    to: "shared.people.PessoaFisica"
    cardinality: "N:1"
  - from: "post_award.curriculo.projetos.Projeto"
    relation: "tipo"
    to: "post_award.curriculo.projetos.TipoProjeto"
    cardinality: "N:1"
  - from: "post_award.curriculo.projetos.Projeto"
    relation: "financiado por"
    to: "corporativo.instituicoes.Instituicao"
    cardinality: "N:1"
    optional: true

axioms:
  - id: "AX-M024-P01"
    natural_language: "dataFim e obrigatoria quando status = Concluido; deve ser vazia quando status = EmAndamento."
    formal_rule: "Projeto.status = Concluido => dataFim IS NOT NULL; Projeto.status = EmAndamento => dataFim IS NULL"
  - id: "AX-M024-P02"
    natural_language: "Reimportacao apaga as ParticipacaoProjeto do curriculo sincronizado e recria a partir do snapshot; o registro de Projeto nao e apagado se vinculado a outro curriculo."
    formal_rule: "ON reimportacao(curriculoId): DELETE ParticipacaoProjeto WHERE curriculoId = :id THEN INSERT FROM snapshot; DELETE Projeto WHERE id NOT IN (SELECT projetoId FROM ParticipacaoProjeto)"
  - id: "AX-M024-P03"
    natural_language: "PapelProjeto pertence a ParticipacaoProjeto, nao a Projeto."
    formal_rule: "PapelProjeto IS ATTRIBUTE OF ParticipacaoProjeto NOT Projeto"
  - id: "AX-M024-P04"
    natural_language: "Projeto deve ser deduplicado por (titulo, dataInicio, tipo, financiador) quando nao houver identificador externo confiavel no Lattes."
    formal_rule: "DEDUP Projeto BY (normalize(titulo), dataInicio, tipoProjetoId, financiadorId)"

invariants:
  - id: "INV-M024-P01"
    rule: "Projeto.status = Concluido => Projeto.dataFim IS NOT NULL"
    description: "Projeto concluido deve ter data de encerramento preenchida."
  - id: "INV-M024-P02"
    rule: "Projeto.dataInicio <= COALESCE(Projeto.dataFim, Projeto.dataInicio)"
    description: "Data de inicio nao pode ser posterior a data de encerramento."

enums:
  PapelProjeto:
    values:
      Coordenador: "Pesquisador exerce papel de coordenador ou lider do projeto."
      Membro: "Pesquisador exerce papel de membro ou colaborador do projeto."

  StatusProjeto:
    values:
      EmAndamento: "Projeto em execucao, sem data de encerramento."
      Concluido: "Projeto finalizado com data de encerramento registrada."
      Suspenso: "Projeto temporariamente suspenso."

value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "Projeto e entidade compartilhada — pode pertencer a multiplos curriculos via ParticipacaoProjeto; nao apagar se ainda referenciado."
    - "ParticipacaoProjeto e composicao de Curriculo — apagada e recriada na reimportacao."
    - "TipoProjeto e cadastro local compartilhado — nao apagar por reimportacao."
    - "Valores iniciais de TipoProjeto: PESQUISA, EXTENSAO, DESENVOLVIMENTO, ENSINO, OUTRO."
  notes: []
