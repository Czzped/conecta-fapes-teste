ontology: "Orientacoes Academicas"
namespace: "post_award.curriculo.orientacoes"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.curriculo
    path: path: "ontology.yaml"
metadata:
  module: "M024"
  source: "docs/implementation/modules/M024-curriculo-pesquisador/submodelos/05-orientacoes.md"
  version: "1.0.0"
  description: "Orientacoes academicas concluidas ou em andamento registradas no curriculo Lattes, com nivel, orientando e instituicao."

entities:
  Orientacao:
    description: "Orientacao academica (IC, mestrado, doutorado, pos-doutorado) realizada pelo pesquisador; composicao de Curriculo."
    extends: "shared.Auditavel"
    fields:
      curriculoId:
        type: "Guid"
        required: true
        description: "FK para Curriculo ao qual a orientacao pertence."
      anoInicio:
        type: "integer"
        required: true
        description: "Ano de inicio da orientacao (4 digitos)."
      anoConclusao:
        type: "integer"
        required: false
        description: "Ano de conclusao — obrigatorio quando status = Concluida; vazio quando status = EmAndamento."
      status:
        type: "StatusOrientacao"
        required: true
        description: "Estado atual da orientacao."
      nivelOrientacaoId:
        type: "Guid"
        required: true
        description: "FK para NivelOrientacao — cadastro local de niveis."
      orientandoId:
        type: "Guid"
        required: true
        description: "FK para PessoaFisica (M008) do orientando."
      instituicaoId:
        type: "Guid"
        required: true
        description: "FK para Instituicao (M008) onde a orientacao ocorre."

  NivelOrientacao:
    description: "Cadastro local de niveis de orientacao academica; compartilhado entre curriculos, nao apagado por reimportacao."
    extends: "shared.Auditavel"
    fields:
      codigo:
        type: "string"
        required: true
        description: "Codigo canonico do nivel de orientacao (IC, M, D, PD)."
        max_length: 5
        unique: true
      nome:
        type: "string"
        required: true
        description: "Nome do nivel de orientacao."
        max_length: 100
      descricao:
        type: "string"
        required: false
        description: "Descricao do nivel de orientacao."
        max_length: 500

relationships:
  - from: "post_award.curriculo.Curriculo"
    relation: "possui"
    to: "post_award.curriculo.orientacoes.Orientacao"
    cardinality: "1:N"
  - from: "post_award.curriculo.orientacoes.Orientacao"
    relation: "nivel"
    to: "post_award.curriculo.orientacoes.NivelOrientacao"
    cardinality: "N:1"
  - from: "post_award.curriculo.orientacoes.Orientacao"
    relation: "orientando"
    to: "shared.people.PessoaFisica"
    cardinality: "N:1"
  - from: "post_award.curriculo.orientacoes.Orientacao"
    relation: "realizada em"
    to: "corporativo.instituicoes.Instituicao"
    cardinality: "N:1"

axioms:
  - id: "AX-M024-O01"
    natural_language: "anoConclusao e obrigatorio quando status = Concluida e deve ser vazio quando status = EmAndamento."
    formal_rule: "Orientacao.status = Concluida => anoConclusao IS NOT NULL; Orientacao.status = EmAndamento => anoConclusao IS NULL"
  - id: "AX-M024-O02"
    natural_language: "Reimportacao apaga todas as Orientacao anteriores do curriculo e recria a partir do snapshot atual."
    formal_rule: "ON reimportacao(curriculoId): DELETE Orientacao WHERE curriculoId = :id THEN INSERT FROM snapshot"
  - id: "AX-M024-O03"
    natural_language: "NivelOrientacao e cadastro local compartilhado — nao e composicao de Curriculo e nao e apagado por reimportacao."
    formal_rule: "NivelOrientacao persists independently of reimportacao"

invariants:
  - id: "INV-M024-O01"
    rule: "Orientacao.status = Concluida => Orientacao.anoConclusao IS NOT NULL"
    description: "Orientacao concluida deve ter ano de conclusao preenchido."
  - id: "INV-M024-O02"
    rule: "Orientacao.anoInicio <= COALESCE(Orientacao.anoConclusao, Orientacao.anoInicio)"
    description: "Ano de inicio nao pode ser posterior ao ano de conclusao."
  - id: "INV-M024-O03"
    rule: "NivelOrientacao.codigo IN ('IC', 'M', 'D', 'PD')"
    description: "Codigo do nivel de orientacao deve ser um dos valores canonicos iniciais."

enums:
  StatusOrientacao:
    values:
      Concluida: "Orientacao finalizada com ano de conclusao registrado."
      EmAndamento: "Orientacao em curso, sem ano de conclusao."

value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "Orientacao e composicao de Curriculo — apagada e recriada na reimportacao."
    - "NivelOrientacao e cadastro local compartilhado — nao apagar por reimportacao."
    - "Valores iniciais de NivelOrientacao: IC (Iniciacao Cientifica), M (Mestrado), D (Doutorado), PD (Pos-Doutorado)."
  notes: []
