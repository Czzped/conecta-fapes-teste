ontology: "Idiomas e Proficiencia"
namespace: "post_award.curriculo.idiomas"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.curriculo
    path: path: "ontology.yaml"
metadata:
  module: "M024"
  source: "docs/implementation/modules/M024-curriculo-pesquisador/submodelos/09-idiomas.md"
  version: "1.0.0"
  description: "Idiomas declarados pelo pesquisador no Lattes com niveis de proficiencia individuais por habilidade (compreensao, fala, leitura e escrita)."

entities:
  Idioma:
    description: "Idioma declarado pelo pesquisador no curriculo Lattes com proficiencia discriminada por habilidade; composicao de Curriculo — cada idioma deve aparecer uma unica vez por curriculo."
    extends: "shared.Auditavel"
    fields:
      curriculoId:
        type: "Guid"
        required: true
        description: "FK para Curriculo ao qual o idioma pertence."
      idioma:
        type: "string"
        required: true
        description: "Nome do idioma declarado no Lattes."
        max_length: 100
      compreensao:
        type: "NivelProficienciaIdioma"
        required: true
        description: "Nivel de proficiencia em compreensao oral."
      fala:
        type: "NivelProficienciaIdioma"
        required: true
        description: "Nivel de proficiencia na fala."
      leitura:
        type: "NivelProficienciaIdioma"
        required: true
        description: "Nivel de proficiencia na leitura."
      escrita:
        type: "NivelProficienciaIdioma"
        required: true
        description: "Nivel de proficiencia na escrita."

relationships:
  - from: "post_award.curriculo.Curriculo"
    relation: "possui"
    to: "post_award.curriculo.idiomas.Idioma"
    cardinality: "1:N"

axioms:
  - id: "AX-M024-I01"
    natural_language: "Reimportacao apaga todos os Idioma anteriores do curriculo e recria a partir do snapshot atual."
    formal_rule: "ON reimportacao(curriculoId): DELETE Idioma WHERE curriculoId = :id THEN INSERT FROM snapshot"
  - id: "AX-M024-I02"
    natural_language: "Cada idioma deve aparecer uma unica vez por curriculo."
    formal_rule: "UNIQUE(Idioma.curriculoId, normalize(Idioma.idioma))"

invariants:
  - id: "INV-M024-I01"
    rule: "UNIQUE(Idioma.curriculoId, Idioma.idioma)"
    description: "Um mesmo idioma nao pode aparecer duas vezes no mesmo curriculo."

enums:
  NivelProficienciaIdioma:
    values:
      Pouco: "Conhecimento basico ou elementar no idioma."
      Razoavel: "Conhecimento intermediario no idioma."
      Bom: "Bom dominio no idioma."
      Fluente: "Dominio pleno e fluente no idioma."

value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "Idioma e composicao de Curriculo — apagado e recriado na reimportacao."
    - "Cada idioma deve aparecer uma unica vez por curriculo — deduplicar por nome normalizado durante importacao."
    - "Um curriculo pode nao possuir idioma registrado."
  notes: []
