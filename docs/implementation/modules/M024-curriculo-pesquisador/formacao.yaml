ontology: "Formacao Academica"
namespace: "post_award.curriculo.formacao"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
  - namespace: post_award.curriculo
    path: path: "ontology.yaml"
metadata:
  module: "M024"
  source: "docs/implementation/modules/M024-curriculo-pesquisador/submodelos/02-formacao-academica.md"
  version: "1.0.0"
  description: "Titulacoes academicas do pesquisador — graduacao, especializacao, mestrado, doutorado e pos-doutorado — com nivel, instituicao e area de conhecimento."

entities:
  FormacaoAcademica:
    description: "Titulacao academica do pesquisador registrada no curriculo Lattes; alimenta elegibilidade, titulacao maxima e busca por expertise."
    extends: "shared.Auditavel"
    fields:
      curriculoId:
        type: "Guid"
        required: true
        description: "FK para Curriculo ao qual a formacao pertence."
      nivel:
        type: "NivelFormacao"
        required: true
        description: "Nivel da titulacao academica."
      curso:
        type: "string"
        required: true
        description: "Nome do curso ou programa de pos-graduacao."
        max_length: 300
      anoInicio:
        type: "integer"
        required: true
        description: "Ano de inicio da formacao (4 digitos)."
      anoConclusao:
        type: "integer"
        required: false
        description: "Ano de conclusao — obrigatorio quando status = Concluida; vazio quando status = EmAndamento."
      status:
        type: "StatusFormacao"
        required: true
        description: "Estado atual da formacao."
      instituicaoId:
        type: "Guid"
        required: true
        description: "FK para Instituicao (M008) onde a formacao foi realizada."
      areaConhecimentoId:
        type: "Guid"
        required: false
        description: "FK para AreaConhecimento (M008 CNPq) associada a formacao; vazio quando area nao mapeada."

relationships:
  - from: "post_award.curriculo.Curriculo"
    relation: "possui"
    to: "post_award.curriculo.formacao.FormacaoAcademica"
    cardinality: "1:N"
  - from: "post_award.curriculo.formacao.FormacaoAcademica"
    relation: "realizada em"
    to: "corporativo.instituicoes.Instituicao"
    cardinality: "N:1"
  - from: "post_award.curriculo.formacao.FormacaoAcademica"
    relation: "area de conhecimento"
    to: "shared.classifications.AreaConhecimento"
    cardinality: "N:1"
    optional: true

axioms:
  - id: "AX-M024-F01"
    natural_language: "anoConclusao e obrigatorio quando status = Concluida e deve ser vazio quando status = EmAndamento."
    formal_rule: "FormacaoAcademica.status = Concluida => anoConclusao IS NOT NULL; FormacaoAcademica.status = EmAndamento => anoConclusao IS NULL"
  - id: "AX-M024-F02"
    natural_language: "Reimportacao apaga todas as FormacaoAcademica anteriores do curriculo e recria a partir do snapshot atual."
    formal_rule: "ON reimportacao(curriculoId): DELETE FormacaoAcademica WHERE curriculoId = :id THEN INSERT FROM snapshot"
  - id: "AX-M024-F03"
    natural_language: "Areas de conhecimento nao mapeadas geram log de discrepancia e o campo areaConhecimentoId fica vazio, sem bloquear a sincronizacao."
    formal_rule: "areaCNPq NOT IN AreaConhecimento => LOG discrepancia AND areaConhecimentoId = NULL"

invariants:
  - id: "INV-M024-F01"
    rule: "FormacaoAcademica.status = Concluida => FormacaoAcademica.anoConclusao IS NOT NULL"
    description: "Formacao concluida deve ter ano de conclusao preenchido."
  - id: "INV-M024-F02"
    rule: "FormacaoAcademica.anoInicio <= COALESCE(FormacaoAcademica.anoConclusao, FormacaoAcademica.anoInicio)"
    description: "Ano de inicio nao pode ser posterior ao ano de conclusao."

enums:
  NivelFormacao:
    values:
      Graduacao: "Curso de graduacao de nivel superior."
      Especializacao: "Curso de especializacao lato sensu."
      Mestrado: "Programa de mestrado stricto sensu."
      Doutorado: "Programa de doutorado stricto sensu."
      PosDoutorado: "Estagio pos-doutoral."

  StatusFormacao:
    values:
      Concluida: "Formacao concluida com ano de conclusao registrado."
      EmAndamento: "Formacao em curso, sem ano de conclusao."

value_objects: {}
events: []
workflows: null
policies: null

agent_instructions:
  rules:
    - "Nao criar entidades fora da ontologia."
    - "Toda spec deve respeitar axioms."
    - "Toda implementacao deve seguir workflows definidos."
    - "FormacaoAcademica e composicao de Curriculo; apagada e recriada a cada reimportacao."
    - "Nao ha unicidade por nivel — o mesmo pesquisador pode ter mais de uma formacao no mesmo nivel."
    - "Unicidade recomendada no snapshot: (curriculoId, instituicaoId, curso, anoInicio)."
  notes:
    - "O nivel academico de PessoaFisica (M008) e derivado da FormacaoAcademica de nivel mais alto com status = Concluida."
