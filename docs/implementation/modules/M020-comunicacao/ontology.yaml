ontology: "Comunicação"
namespace: "suporte.comunicacao"
imports:
  - namespace: shared
    path: path: "../../../ontology/shared/base.yaml"
metadata:
  module: "M020"
  source: "modelo-estrutural.md + contrato.md + notificacoes/catalogo-eventos.md"
  version: "1.1.0"
  description: "Comunicacao com usuarios. Servico transversal que consome eventos de negocio dos demais modulos e gera notificacoes, emails, comunicados em massa e lembretes de prazo."
  todo: "Completar entities/relationships/invariants a partir de modelo-estrutural.md."
entities:
  todo: "Define from modelo-estrutural.md (Notificacao, TemplateNotificacao, HistoricoEnvio, ComunicadoMassa, LembretePrazo)."
relationships:
  todo: "Define from modelo-estrutural.md."
axioms:
  todo: "Define from modelo-estrutural.md."
invariants:
  todo: "Define from modelo-estrutural.md."
enums:
  TipoNotificacao:
    values: [MUDANCA_STATUS, LEMBRETE_PRAZO, SOLICITACAO_APROVACAO, PAGAMENTO, COMUNICADO, ALERTA]
  EstadoNotificacao:
    values: [PENDENTE, ENVIADA, ENTREGUE, FALHA, REENVIO]
  EstadoComunicado:
    values: [AGUARDANDO_APROVACAO, APROVADO, REJEITADO, EM_ENVIO, ENVIADO]
value_objects: {}
events:
  emitted:
    note: "Nenhum evento emitido foi estabilizado como interface publica (ver contrato.md)."
  consumed:
    note: >-
      M020 consome eventos de negocio de outros modulos via
      ReceberEventoDeNegocioParaNotificacao, identificados por eventoOrigem +
      moduloOrigem. Catalogo consolidado em notificacoes/catalogo-eventos.md.
    source_modules: [M003, M004, M009, M012, M014, M015, M016, M017, M019, M024]
    catalog: "notificacoes/catalogo-eventos.md"
