  todo: "Define from modelo-comportamental.md (ciclo de vida da Notificacao)."
policies:
  todo: "Define from README.md regras RN01-RN09."

agent_instructions:
  rules:
    - "modelo-estrutural.md disponivel. enums e eventos consumidos preenchidos; entities/relationships/invariants pendentes."
    - "Eventos consumidos: ver notificacoes/catalogo-eventos.md (fonte unica do mapeamento evento->notificacao)."
    - "Consultar arquitetura em docs/architecture/02-modulos-e-integracoes.md."
  notes:
