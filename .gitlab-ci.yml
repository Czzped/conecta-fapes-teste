image: node:21

cache:
  paths:
    - conectafapes-project/documentation/node_modules/
    - conectafapes-project/documentation/public/
    - conectafapes-project/documentation/.cache/

pages:
  stage: deploy
  script:
    - cd conectafapes-project/documentation
    - yarn install
    - yarn build:gitlab
  artifacts:
    paths:
      - conectafapes-project/documentation/public
  only:
    - main
