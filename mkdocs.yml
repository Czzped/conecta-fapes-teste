site_name: Conecta FAPES
site_description: Plataforma digital da agencia de fomento para gestao do ciclo completo de fomento a pesquisa, desenvolvimento e inovacao
site_url: ""

docs_dir: docs

exclude_docs: |
  deprecated/
  templates/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: README.md

  - Arquitetura:
      - Visao Geral: architecture/README.md
      - Visao do Sistema: architecture/01-visao-geral.md
      - Modulos e Integracoes: architecture/02-modulos-e-integracoes.md
      - Acesso e Seguranca: architecture/03-acesso-e-seguranca.md
      - Dados e Operacao: architecture/04-dados-e-operacao.md
      - ADR-001 Backend C# CQRS: architecture/adr/ADR-001-backend-csharp-clean-architecture-cqrs.md
      - ADR-002 Frontend Vue NuxtUI: architecture/adr/ADR-002-frontend-vue-nuxtui.md
      - ADR-003 Banco SQL Server: architecture/adr/ADR-003-banco-de-dados-sql-server.md
      - ADR-004 Docker Kubernetes: architecture/adr/ADR-004-infraestrutura-docker-kubernetes.md
      - ADR-005 Adocao BFF: architecture/adr/ADR-005-adocao-bff.md
      - ADR-006 Reconciliacao Pagamento: architecture/adr/ADR-006-reconciliacao-m004-pagamento-bolsista.md
      - ADR-007 Autorizacao OpenFGA: architecture/adr/ADR-007-autorizacao-openfga.md
      - ADR-008 Backend Separado M014: architecture/adr/ADR-008-backend-separado-m014.md
      - ADR-009 Hangfire Jobs: architecture/adr/ADR-009-hangfire-background-jobs.md
      - ADR-010 MinIO Storage: architecture/adr/ADR-010-minio-armazenamento-objetos.md

