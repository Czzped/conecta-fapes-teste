site_name: Conecta FAPES
site_description: Plataforma digital da agencia de fomento para gestao do ciclo completo de fomento a pesquisa, desenvolvimento e inovacao
site_url: "https://leds-conectafapes.github.io/conectafapes-project/"

docs_dir: docs

exclude_docs: |
  deprecated/
  templates/
  assets/*.tmpl.html

not_in_nav: |
  architecture/adr/template.md
  discovery/estornos-prestacao-contas.md
  discovery/regras-calculo-diarias-es.md
  discovery/regras-liberacao-parcelas.md
  discovery/regras-passagem-areas-fapes.md
  discovery/regras-saldo-alocado-disponivel.md
  discovery/integracoes/README.md
  discovery/integracoes/e-docs.md
  discovery/integracoes/organograma.md
  implementation/modules/M003-gestao-projetos-captados/epics/US-M003-042-acompanhamento-orcamentario-rubricas.md
  implementation/modules/M008-cadastros-corporativos/implementacao-backend-admin-instituicao.md
  implementation/modules/M014-prestacao-contas/epics/EPIC-M014-012.md
  implementation/modules/M014-prestacao-contas/epics/EPIC-M014-013.md
  implementation/modules/M023-integracoes/epics/EPIC-M023-001.md
  implementation/modules/M023-integracoes/epics/EPIC-M023-002.md
  implementation/modules/M023-integracoes/epics/EPIC-M023-003.md
  implementation/modules/M011-configuracao-captacao/anotacoes.md
  management/deliveries.md
  management/sprints/template-sprint.md

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      locale: pt
      fallback_to_build_date: true

extra:
  giscus:
    repo: leds-conectafapes/conectafapes-project
    repo_id: R_kgDON0TQIg
    category: General
    category_id: DIC_kwDON0TQIs4C7v4-
    mapping: pathname
    reactions_enabled: 1
    input_position: bottom
    lang: pt

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

