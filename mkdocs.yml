site_name: Conecta FAPES
site_description: Plataforma digital da agencia de fomento para gestao do ciclo completo de fomento a pesquisa, desenvolvimento e inovacao
site_url: "https://leds-conectafapes.github.io/conectafapes-project/"

docs_dir: docs

exclude_docs: |
  deprecated/
  templates/

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: pt

extra:
  giscus:
    repo: leds-conectafapes/conectafapes-project
    repo_id: R_kgDON0TQIg
    category: General
    category_id: DIC_kwDON0TQIs4C7v4-
    mapping: pathname
    reactions_enabled: 1
    input_position: bottom
    lang: pt

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

