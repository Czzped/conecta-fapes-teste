<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Fundo  Branco-->
    <rect x="0" y="0" width="600" height="500" fill="white"/>
    
    <!-- Client -->
    <rect x="250" y="20" width="120" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="285" y="55" font-family="Arial">Client</text>
    
    <!-- API Gateway -->
    <rect x="250" y="140" width="120" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="265" y="175" font-family="Arial">API Gateway</text>
    
    <!-- Services -->
    <rect x="100" y="260" width="120" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="130" y="295" font-family="Arial">Service 1</text>
    
    <rect x="250" y="260" width="120" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="280" y="295" font-family="Arial">Service 2</text>
    
    <rect x="400" y="260" width="120" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="430" y="295" font-family="Arial">Service 3</text>
    
    <!-- Conexões -->
    <line x1="310" y1="80" x2="310" y2="140" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
    
    <line x1="310" y1="200" x2="160" y2="260" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="310" y1="200" x2="310" y2="260" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="310" y1="200" x2="460" y2="260" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Legenda> -->
    <text x="20" y="380" font-family="Arial" font-size="12" fill="#333">
        <tspan x="20" dy="0">Legenda:</tspan>
        <tspan x="20" dy="20">- Caixas amarelas: Componentes do sistema</tspan>
        <tspan x="20" dy="20">- Linhas tracejadas: Roteamento de requisições e dependências</tspan>
    </text>
</svg>