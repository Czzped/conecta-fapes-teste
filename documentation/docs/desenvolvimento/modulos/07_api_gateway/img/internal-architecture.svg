<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Fundo Branco -->
    <rect x="0" y="0" width="600" height="600" fill="white"/>
    
    <!-- Container Principal -->
    <rect x="50" y="20" width="500" height="450" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-weight="bold">API Gateway</text>
    
    <!-- Container do Pipeline de Middleware -->
    <rect x="75" y="70" width="450" height="220" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="85" y="95" font-family="Arial">Pipeline de Middleware</text>
    
    <!-- Componentes do Middleware -->
    <rect x="100" y="120" width="400" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="110" y="155" font-family="Arial">Filtro de IP</text>
    
    <rect x="100" y="210" width="400" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="110" y="245" font-family="Arial">Filtro de rota</text>
    
    <!-- Roteador (fora do pipeline) -->
    <rect x="75" y="310" width="450" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="85" y="345" font-family="Arial">Ocelot Gateway</text>
    
    <!-- Auxiliares (fora do pipeline) -->
    <rect x="75" y="390" width="450" height="60" fill="#FFFACD" stroke="black" stroke-width="2"/>
    <text x="85" y="425" font-family="Arial">Helpers (Classes Auxiliares)</text>
    
    <!-- Setas de Fluxo -->
    <line x1="300" y1="180" x2="300" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="300" y1="270" x2="300" y2="310" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Dependências dos Auxiliares -->
    <line x1="150" y1="390" x2="150" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="390" x2="250" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Definição da Seta -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
        </marker>
    </defs>
    
    <!-- Legenda -->
    <text x="20" y="520" font-family="Arial" font-size="12" fill="#333">
        <tspan x="20" dy="0">Legenda:</tspan>
        <tspan x="20" dy="20">- Caixas amarelas aninhadas: Hierarquia dos componentes</tspan>
        <tspan x="20" dy="20">- Setas sólidas: Fluxo de processamento das requisições</tspan>
        <tspan x="20" dy="20">- Linhas pontilhadas: Uso das classes auxiliares pelos componentes</tspan>
    </text>
</svg>