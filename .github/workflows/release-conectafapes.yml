name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Detectar versao
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_TAGS=""
          for REPO in \
            leds-conectafapes-backend-admin \
            leds-conectafapes-frontend-backoffice \
            leds-conectafapes-frontoffice-backend \
            leds-conectafapes-frontoffice-frontend \
            leds-conectafapes-prestacao-de-contas; do
            TAG=$(gh release list --repo "leds-conectafapes/$REPO" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null)
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
              ALL_TAGS="$ALL_TAGS $TAG"
            fi
          done

          if [ -z "$ALL_TAGS" ]; then
            VERSION="v1.0"
          else
            LATEST=$(echo "$ALL_TAGS" | tr ' ' '\n' | sort -V | tail -1)
            VERSION=$(echo "$LATEST" | awk -F. '{print "v" $1+0 "." $2+1}')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versao detectada: $VERSION"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          if ${{ inputs.backend_admin }}; then
            REPOS="$REPOS leds-conectafapes-backend-admin"
          fi
          if ${{ inputs.frontend_backoffice }}; then
            REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          fi
          if ${{ inputs.frontoffice_backend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          fi
          if ${{ inputs.frontoffice_frontend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          fi
          if ${{ inputs.prestacao_de_contas }}; then
            REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          fi

          if [ -z "$REPOS" ]; then
            echo "Selecione ao menos um repositorio"
            exit 1
          fi

          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "  RELEASE $VERSION"
          echo "============================================"
          echo ""
          echo "Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN (nada sera alterado)' }}"
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi
            echo "  [$REPO]"
            echo "    Branch: release/$VERSION (de develop)"
            echo "    PR:     release/$VERSION -> $PROD"
            echo ""
          done

      - name: Executar
        if: ${{ inputs.execute }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Executando release $VERSION..."
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"
            BRANCH="release/$VERSION"

            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi

            sha=$(gh api "repos/$FULL/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null)
            if [ -z "$sha" ]; then
              echo "ERRO: develop nao encontrado em $REPO"
              continue
            fi

            gh api "repos/$FULL/git/refs" \
              --field ref="refs/heads/$BRANCH" \
              --field sha="$sha" \
              --silent 2>/dev/null && echo "Branch $BRANCH criada" || echo "Branch $BRANCH ja existe"

            PR=$(gh api "repos/$FULL/pulls" \
              --field title="Release $VERSION" \
              --field head="$BRANCH" \
              --field base="$PROD" \
              --field body="Release automatica $VERSION de develop para $PROD." \
              --jq '.html_url' 2>/dev/null)

            if [ -n "$PR" ]; then
              echo "PR: $PR"
            else
              PR=$(gh pr list --repo "$FULL" --head "$BRANCH" --base "$PROD" --state open --json url -q '.[0].url' 2>/dev/null || echo "-")
              echo "PR (existente): $PR"
            fi

            echo "---"
          done

          echo ""
          echo "Pronto! A tag $VERSION sera criada automaticamente apos o merge em producao."
