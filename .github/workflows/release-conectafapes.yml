name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versao
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="v1.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          if ${{ inputs.backend_admin }}; then REPOS="$REPOS leds-conectafapes-backend-admin"; fi
          if ${{ inputs.frontend_backoffice }}; then REPOS="$REPOS leds-conectafapes-frontend-backoffice"; fi
          if ${{ inputs.frontoffice_backend }}; then REPOS="$REPOS leds-conectafapes-frontoffice-backend"; fi
          if ${{ inputs.frontoffice_frontend }}; then REPOS="$REPOS leds-conectafapes-frontoffice-frontend"; fi
          if ${{ inputs.prestacao_de_contas }}; then REPOS="$REPOS leds-conectafapes-prestacao-de-contas"; fi
          if [ -z "$REPOS" ]; then echo "Selecione ao menos um repositorio"; exit 1; fi
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "RELEASE $V  —  ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN' }}"
          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            echo "  [$REPO] release/$V -> $PROD"
          done

      - name: Executar
        if: ${{ inputs.execute }}
        env:
          REPO_TOKEN: ${{ secrets.PROJECTS_PAT }}
        run: |
          set +e
          VERSION="${{ steps.version.outputs.version }}"

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            BRANCH="release/$VERSION"
            URL="https://x-access-token:$REPO_TOKEN@github.com/$FULL.git"

            echo ">>> $REPO"

            # Criar branch: fetch develop + push para novo branch
            TMP=$(mktemp -d)
            git -C "$TMP" init -q
            FETCH_OUT=$(git -C "$TMP" fetch --depth=1 "$URL" develop 2>&1 || true)
            if echo "$FETCH_OUT" | grep -q 'fatal'; then
              echo "  FAIL (fetch): $(echo "$FETCH_OUT" | tail -1)"
              rm -rf "$TMP"
              echo ""
              continue
            fi

            PUSH_OUT=$(git -C "$TMP" push "$URL" FETCH_HEAD:refs/heads/$BRANCH 2>&1 || true)
            if echo "$PUSH_OUT" | grep -q 'new branch'; then
              echo "  Branch $BRANCH criada"
            elif echo "$PUSH_OUT" | grep -q ' up to date'; then
              echo "  Branch $BRANCH ja existe"
            else
              echo "  FAIL (push): $(echo "$PUSH_OUT" | tail -1)"
              rm -rf "$TMP"
              echo ""
              continue
            fi

            rm -rf "$TMP"

            # Abrir PR via REST
            PR_RESP=$(gh api "repos/$FULL/pulls" \
              -f title="Release $VERSION" \
              -f head="$BRANCH" \
              -f base="$PROD" \
              -f body="Release automatica $VERSION de develop para $PROD." 2>&1)

            if echo "$PR_RESP" | grep -q '"html_url"'; then
              PR_URL=$(echo "$PR_RESP" | grep -oP '"html_url"\s*:\s*"\K[^"]+')
              echo "  PR: $PR_URL"
            else
              echo "  FAIL (PR): $(echo "$PR_RESP" | grep -oP '"message"\s*:\s*"[^"]+"' | head -1)"
            fi

            echo ""
          done

          echo "Feito."
