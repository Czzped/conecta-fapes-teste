name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: false
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: false
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: false
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: false
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false
      backend_pagamento_bolsistas:
        description: "backend-pagamento-bolsistas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_PAT }}

jobs:
  release:
    # Runner self-hosted da organizacao: nao consome a cota de Actions (esgotada
    # em jul/2026). Dependencias validadas em execucao real neste runner:
    # checkout+sparse-checkout (git 2.54), setup-node, `npm install -g` e egress
    # para api.github.com, registry.npmjs.org e gitlab.com.
    #
    # CHAVE DE TROCA: criar a variavel RUNNER_LABELS com `["ubuntu-latest"]` (JSON)
    # devolve todos estes workflows ao runner hospedado, sem alterar codigo.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    defaults:
      run:
        working-directory: tools/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Garantir o gh CLI
        # O runner self-hosted nao traz o `gh`, e o release.mjs depende dele.
        # Instala sem sudo, no diretorio temporario do job, e so quando ausente
        # (no runner hospedado o `gh` ja vem instalado).
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "gh ja presente: $(gh --version | head -1)"
            exit 0
          fi
          versao=2.96.0
          url="https://github.com/cli/cli/releases/download/v${versao}/gh_${versao}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/gh.tar.gz"
          mkdir -p "$RUNNER_TEMP/gh"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/gh" --strip-components=1
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version | head -1

      - name: Montar argumentos do release
        id: args
        run: |
          REPOS=""
          ${{ inputs.backend_admin }} && REPOS="$REPOS,backend-admin"
          ${{ inputs.frontend_backoffice }} && REPOS="$REPOS,frontend-backoffice"
          ${{ inputs.frontoffice_backend }} && REPOS="$REPOS,frontoffice-backend"
          ${{ inputs.frontoffice_frontend }} && REPOS="$REPOS,frontoffice-frontend"
          ${{ inputs.prestacao_de_contas }} && REPOS="$REPOS,prestacao-de-contas"
          ${{ inputs.backend_pagamento_bolsistas }} && REPOS="$REPOS,backend-pagamento-bolsistas"
          REPOS="${REPOS#,}"  # remove leading comma

          MODE="${{ inputs.execute && '--execute' || '--dry-run' }}"

          echo "args=$MODE --repos $REPOS" >> "$GITHUB_OUTPUT"
          echo "Repos: $REPOS | $MODE"

      - name: Release
        run: |
          echo "Args: ${{ steps.args.outputs.args }}"
          node release.mjs ${{ steps.args.outputs.args }}
