name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versao
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v1.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versao: $V"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          if ${{ inputs.backend_admin }}; then
            REPOS="$REPOS leds-conectafapes-backend-admin"
          fi
          if ${{ inputs.frontend_backoffice }}; then
            REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          fi
          if ${{ inputs.frontoffice_backend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          fi
          if ${{ inputs.frontoffice_frontend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          fi
          if ${{ inputs.prestacao_de_contas }}; then
            REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          fi

          if [ -z "$REPOS" ]; then
            echo "Selecione ao menos um repositorio"
            exit 1
          fi

          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "  RELEASE $VERSION"
          echo "============================================"
          echo ""
          echo "Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN (nada sera alterado)' }}"
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi
            echo "  [$REPO]"
            echo "    Branch: release/$VERSION (de develop)"
            echo "    PR:     release/$VERSION -> $PROD"
            echo ""
          done

      - name: Executar
        if: ${{ inputs.execute }}
        run: |
          set +e

          VERSION="${{ steps.version.outputs.version }}"
          echo "Lançando release $VERSION..."
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"

            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi

            BRANCH="release/$VERSION"

            echo ">>> $REPO"

            # 1. Pegar SHA do develop
            DEVELOP=$(gh api "repos/$FULL/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null)
            if [ -z "$DEVELOP" ] || [ "$DEVELOP" = "null" ]; then
              echo "  FAIL: develop nao encontrado"
              echo ""
              continue
            fi

            # 2. Criar branch (idempotente)
            HTTP_CODE=$(gh api -X POST "repos/$FULL/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$DEVELOP" \
              -i 2>/dev/null | head -1 | grep -oP '\d{3}')

            case "$HTTP_CODE" in
              201) echo "  Branch $BRANCH criada" ;;
              422) echo "  Branch $BRANCH ja existe" ;;
              *)   echo "  FAIL: HTTP $HTTP_CODE ao criar branch" ;;
            esac

            # 3. Abrir PR via REST
            PR_RESP=$(gh api "repos/$FULL/pulls" \
              -f title="Release $VERSION" \
              -f head="$BRANCH" \
              -f base="$PROD" \
              -f body="Release automatica $VERSION de develop para $PROD." 2>&1)
            PR_URL=$(echo "$PR_RESP" | grep -oP '"html_url"\s*:\s*"\K[^"]+')

            if [ -n "$PR_URL" ]; then
              echo "  PR: $PR_URL"
            elif echo "$PR_RESP" | grep -qi "already exists"; then
              echo "  PR ja existe"
            else
              echo "  FAIL (PR): $(echo "$PR_RESP" | tr '\n' ' ' | head -c 200)"
            fi

            echo ""
          done

          echo "Feito."
