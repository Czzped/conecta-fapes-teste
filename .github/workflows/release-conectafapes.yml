name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versao
        id: version
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="v1.0"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          ${{ inputs.backend_admin }} && REPOS="$REPOS leds-conectafapes-backend-admin"
          ${{ inputs.frontend_backoffice }} && REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          ${{ inputs.frontoffice_backend }} && REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          ${{ inputs.frontoffice_frontend }} && REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          ${{ inputs.prestacao_de_contas }} && REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          [ -z "$REPOS" ] && { echo "Selecione ao menos um repositorio"; exit 1; }
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "=== RELEASE $V  —  ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN' }} ==="
          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            echo "  $REPO  →  release/$V -> $PROD"
          done
          echo ""

      - name: Executar
        if: ${{ inputs.execute }}
        env:
          REPO_TOKEN: ${{ secrets.PROJECTS_PAT }}
        run: |
          set -e  # falhar em erros inesperados
          VERSION="${{ steps.version.outputs.version }}"

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            BRANCH="release/$VERSION"
            URL="https://x-access-token:$REPO_TOKEN@github.com/$FULL.git"

            echo ">>> $REPO"

            # 1. Criar branch (idempotente)
            TMP=$(mktemp -d)
            git -C "$TMP" init -q
            git -C "$TMP" fetch -q --depth=1 --no-tags "$URL" develop || { echo "  FAIL: fetch develop"; rm -rf "$TMP"; continue; }
            PUSH=$(git -C "$TMP" push "$URL" FETCH_HEAD:refs/heads/$BRANCH 2>&1 || true)
            rm -rf "$TMP"

            if   echo "$PUSH" | grep -q 'new branch';      then echo "  ✓ Branch $BRANCH"
            elif echo "$PUSH" | grep -q 'up-to-date\|up to date'; then echo "  = Branch $BRANCH (existe)"
            elif echo "$PUSH" | grep -q 'remote rejected';  then echo "  ✗ $PUSH" | tr '\n' ' '; echo; continue
            else  echo "  ? $PUSH"
            fi

            # 2. Abrir PR
            PR=$(gh api "repos/$FULL/pulls" \
              -f title="Release $VERSION" \
              -f head="$BRANCH" \
              -f base="$PROD" \
              -f body="Release $VERSION: integra develop em $PROD." 2>&1 || true)

            URL=$(echo "$PR" | grep -oP '"html_url"\s*:\s*"\K[^"]+')
            if [ -n "$URL" ]; then
              echo "  ✓ PR $URL"
            elif echo "$PR" | grep -q 'already exists'; then
              echo "  = PR ja existe"
            else
              echo "  ✗ $(echo "$PR" | tr '\n' ' ' | head -c 300)"
            fi

            echo ""
          done
          echo "OK"
