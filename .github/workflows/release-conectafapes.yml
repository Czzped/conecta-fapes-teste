name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          ${{ inputs.backend_admin }} && REPOS="$REPOS leds-conectafapes-backend-admin"
          ${{ inputs.frontend_backoffice }} && REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          ${{ inputs.frontoffice_backend }} && REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          ${{ inputs.frontoffice_frontend }} && REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          ${{ inputs.prestacao_de_contas }} && REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          [ -z "$REPOS" ] && { echo "Selecione ao menos um repositorio"; exit 1; }
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Detectar versao automatica
        id: version
        run: |
          MANUAL="${{ inputs.version }}"
          if [ -n "$MANUAL" ]; then
            echo "version=$MANUAL" >> "$GITHUB_OUTPUT"
            echo "Versao manual: $MANUAL"
            exit 0
          fi

          # Buscar maior tag vX.Y.Z entre todos os repos selecionados
          LATEST_MAJOR=0; LATEST_MINOR=0; LATEST_PATCH=0; LATEST_TAG=""
          for REPO in ${{ steps.repos.outputs.repos }}; do
            TAGS=$(gh api "repos/leds-conectafapes/$REPO/git/refs/tags" --jq '.[].ref | sub("refs/tags/"; "")' 2>/dev/null || true)
            for TAG in $TAGS; do
              if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                M=${BASH_REMATCH[1]}; m=${BASH_REMATCH[2]}; p=${BASH_REMATCH[3]}
                if [ "$M" -gt "$LATEST_MAJOR" ] || { [ "$M" -eq "$LATEST_MAJOR" ] && [ "$m" -gt "$LATEST_MINOR" ]; } || { [ "$M" -eq "$LATEST_MAJOR" ] && [ "$m" -eq "$LATEST_MINOR" ] && [ "$p" -gt "$LATEST_PATCH" ]; }; then
                  LATEST_MAJOR=$M; LATEST_MINOR=$m; LATEST_PATCH=$p; LATEST_TAG="$TAG"
                fi
              elif [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
                M=${BASH_REMATCH[1]}; m=${BASH_REMATCH[2]}
                if [ "$M" -gt "$LATEST_MAJOR" ] || { [ "$M" -eq "$LATEST_MAJOR" ] && [ "$m" -gt "$LATEST_MINOR" ]; }; then
                  LATEST_MAJOR=$M; LATEST_MINOR=$m; LATEST_PATCH=0; LATEST_TAG="$TAG"
                fi
              fi
            done
          done

          echo "Maior tag encontrada: $LATEST_TAG"

          # Determinar tipo de bump analisando commits desde a ultima tag
          BUMP="patch"
          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ -n "$LATEST_TAG" ]; then
              COMMITS=$(gh api "repos/leds-conectafapes/$REPO/compare/$LATEST_TAG...develop" --jq '.commits[].commit.message' 2>/dev/null || true)
            else
              COMMITS=$(gh api "repos/leds-conectafapes/$REPO/commits?sha=develop&per_page=50" --jq '.[].commit.message' 2>/dev/null || true)
            fi
            for MSG in $COMMITS; do
              MSG=$(echo "$MSG" | head -1)  # primeira linha
              if echo "$MSG" | grep -qiE '^(feat|feature)'; then
                [ "$BUMP" != "major" ] && BUMP="minor"
              elif echo "$MSG" | grep -qi 'BREAKING CHANGE\|^BREAKING\|!:'; then
                BUMP="major"
              fi
            done
          done

          # Calcular proxima versao
          case "$BUMP" in
            major) NEXT="v$((LATEST_MAJOR+1)).0.0" ;;
            minor) NEXT="v$LATEST_MAJOR.$((LATEST_MINOR+1)).0" ;;
            *)     NEXT="v$LATEST_MAJOR.$LATEST_MINOR.$((LATEST_PATCH+1))" ;;
          esac

          echo "Bump: $BUMP | Proxima versao: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Gerar changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.last_tag }}"
          echo "## Commits desde $TAG" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md

          for REPO in ${{ steps.repos.outputs.repos }}; do
            echo "### $REPO" >> /tmp/changelog.md
            if [ -n "$TAG" ] && [ "$TAG" != "v0.0.0" ]; then
              gh api "repos/leds-conectafapes/$REPO/compare/$TAG...develop" --jq '.commits[] | "- \(.commit.message | split("\n")[0])"' 2>/dev/null >> /tmp/changelog.md || echo "  (sem commits novos)" >> /tmp/changelog.md
            else
              gh api "repos/leds-conectafapes/$REPO/commits?sha=develop&per_page=50" --jq '.[].commit.message | split("\n")[0] | "- \(.)"' 2>/dev/null | head -20 >> /tmp/changelog.md || echo "  (sem commits)" >> /tmp/changelog.md
            fi
            echo "" >> /tmp/changelog.md
          done
          cat /tmp/changelog.md

      - name: Mostrar plano
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "  RELEASE $V  (bump: ${{ steps.version.outputs.type }})"
          echo "  Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN' }}"
          echo "============================================"
          echo ""
          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            echo "  [$REPO]  release/$V -> $PROD"
          done
          echo ""

      - name: Executar
        if: ${{ inputs.execute }}
        env:
          REPO_TOKEN: ${{ secrets.PROJECTS_PAT }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then PROD="master"; else PROD="main"; fi
            BRANCH="release/$VERSION"
            URL="https://x-access-token:$REPO_TOKEN@github.com/$FULL.git"

            echo ">>> $REPO"

            # Branch
            TMP=$(mktemp -d)
            git -C "$TMP" init -q
            git -C "$TMP" fetch -q --depth=1 --no-tags "$URL" develop || { echo "  FAIL: fetch"; rm -rf "$TMP"; continue; }
            PUSH=$(git -C "$TMP" push "$URL" FETCH_HEAD:refs/heads/$BRANCH 2>&1 || true)
            rm -rf "$TMP"

            if   echo "$PUSH" | grep -q 'new branch';      then echo "  ✓ Branch $BRANCH"
            elif echo "$PUSH" | grep -q 'up-to-date\|up to date'; then echo "  = Branch $BRANCH (existe)"
            elif echo "$PUSH" | grep -q 'remote rejected';  then echo "  ✗ $PUSH"; continue
            else  echo "  ? $PUSH"
            fi

            # PR com changelog
            BODY=$(cat /tmp/changelog.md | head -c 60000)  # limite da API
            PR=$(gh api "repos/$FULL/pulls" \
              -f title="Release $VERSION" \
              -f head="$BRANCH" \
              -f base="$PROD" \
              -f body="$BODY" 2>&1 || true)

            PR_URL=$(echo "$PR" | grep -oP '"html_url"\s*:\s*"\K[^"]+' || true)
            if [ -n "$PR_URL" ]; then
              echo "  ✓ PR $PR_URL"
            elif echo "$PR" | grep -qi 'already exists'; then
              echo "  = PR ja existe"
            else
              echo "  ✗ $(echo "$PR" | tr '\n' ' ' | head -c 300 || true)"
            fi

            echo ""
          done
          echo "OK"
