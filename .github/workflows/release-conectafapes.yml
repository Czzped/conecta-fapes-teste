name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      repos:
        description: "Repos (virgula). 'all' = todos"
        required: false
        default: "all"
        type: string
      execute:
        description: "Executar (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_LEDS }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Detectar versao
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for REPO in \
            leds-conectafapes-backend-admin \
            leds-conectafapes-frontend-backoffice \
            leds-conectafapes-frontoffice-backend \
            leds-conectafapes-frontoffice-frontend \
            leds-conectafapes-prestacao-de-contas; do
            TAG=$(gh release list --repo "leds-conectafapes/$REPO" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null)
            if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              CANDIDATE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              if [ -z "$LATEST" ] || [ "${BASH_REMATCH[1]}" -gt "${LATEST%.*}" ] || { [ "${BASH_REMATCH[1]}" -eq "${LATEST%.*}" ] && [ "${BASH_REMATCH[2]}" -gt "${LATEST##*.}" ]; }; then
                LATEST="$CANDIDATE"
              fi
            fi
          done

          if [ -z "$LATEST" ]; then
            VERSION="v1.0"
          else
            VERSION="v${LATEST%.*}.$((LATEST##*. + 1))"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versao detectada: $VERSION"

      - name: Resolver repositorios
        id: repos
        run: |
          ALL="leds-conectafapes-backend-admin leds-conectafapes-frontend-backoffice leds-conectafapes-frontoffice-backend leds-conectafapes-frontoffice-frontend leds-conectafapes-prestacao-de-contas"

          if [ "${{ inputs.repos }}" = "all" ]; then
            SELECTED="$ALL"
          else
            SELECTED=$(echo "${{ inputs.repos }}" | tr ',' ' ')
          fi

          VALID=""
          for REPO in $SELECTED; do
            REPO=$(echo "$REPO" | xargs)
            if echo "$ALL" | tr ' ' '\n' | grep -qx "$REPO"; then
              VALID="$VALID $REPO"
            else
              echo "Ignorado (nao reconhecido): $REPO"
            fi
          done

          if [ -z "$VALID" ]; then
            echo "Nenhum repositorio valido selecionado"
            exit 1
          fi

          echo "repos=$VALID" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "========== PLANO DA RELEASE $VERSION =========="
          echo ""
          echo "Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN (nada sera alterado)' }}"
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi
            echo "  [$REPO]"
            echo "    Branch: release/$VERSION (de develop)"
            echo "    PR:     release/$VERSION -> $PROD"
            echo ""
          done

      - name: Executar
        if: ${{ inputs.execute }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Executando release $VERSION..."
          echo ""

          echo "Repo | Branch | PR"
          echo "-----|--------|----"

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"
            BRANCH="release/$VERSION"

            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi

            # Buscar SHA do develop
            SHA=$(gh api "repos/$FULL/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null)
            if [ -z "$SHA" ]; then
              echo "ERRO: nao foi possivel ler develop em $REPO"
              continue
            fi

            # Criar branch release
            gh api "repos/$FULL/git/refs" \
              --field ref="refs/heads/$BRANCH" \
              --field sha="$SHA" \
              --silent 2>/dev/null && echo "Branch $BRANCH criada em $REPO" || echo "Branch $BRANCH ja existe em $REPO"

            # Abrir PR
            PR=$(gh api "repos/$FULL/pulls" \
              --field title="Release $VERSION" \
              --field head="$BRANCH" \
              --field base="$PROD" \
              --field body="Release automatica $VERSION de develop para $PROD." \
              --jq '.html_url' 2>/dev/null)

            if [ -n "$PR" ]; then
              echo "PR: $PR"
            else
              PR=$(gh pr list --repo "$FULL" --head "$BRANCH" --base "$PROD" --state open --json url -q '.[0].url' 2>/dev/null || echo "-")
              echo "PR (existente): $PR"
            fi

            echo "---"
          done

          echo ""
          echo "Pronto! A tag $VERSION sera criada automaticamente apos o merge em producao."
