name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versao
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v1.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versao: $V"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          if ${{ inputs.backend_admin }}; then
            REPOS="$REPOS leds-conectafapes-backend-admin"
          fi
          if ${{ inputs.frontend_backoffice }}; then
            REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          fi
          if ${{ inputs.frontoffice_backend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          fi
          if ${{ inputs.frontoffice_frontend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          fi
          if ${{ inputs.prestacao_de_contas }}; then
            REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          fi

          if [ -z "$REPOS" ]; then
            echo "Selecione ao menos um repositorio"
            exit 1
          fi

          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "  RELEASE $VERSION"
          echo "============================================"
          echo ""
          echo "Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN (nada sera alterado)' }}"
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi
            echo "  [$REPO]"
            echo "    Branch: release/$VERSION (de develop)"
            echo "    PR:     release/$VERSION -> $PROD"
            echo ""
          done

      - name: Executar
        if: ${{ inputs.execute }}
        run: |
          set +e

          VERSION="${{ steps.version.outputs.version }}"
          echo "Lançando release $VERSION..."
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"

            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi

            BRANCH="release/$VERSION"

            echo ">>> $REPO"

            # Ler SHA do develop
            DEVELOP_SHA=$(gh api "repos/$FULL/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$DEVELOP_SHA" ]; then
              echo "  FAIL: nao foi possivel ler develop (PAT sem acesso ao repo?)"
              echo ""
              continue
            fi

            # Criar branch release
            CREATE_OUT=$(gh api "repos/$FULL/git/refs" \
              --field ref="refs/heads/$BRANCH" \
              --field sha="$DEVELOP_SHA" 2>&1 || true)
            if echo "$CREATE_OUT" | grep -qi "error\|not found\|bad credentials\|forbidden"; then
              echo "  FAIL ao criar branch: $(echo "$CREATE_OUT" | tr '\n' ' ')"
              echo ""
              continue
            fi
            if echo "$CREATE_OUT" | grep -qi "already exists"; then
              echo "  Branch $BRANCH ja existe"
            else
              echo "  Branch $BRANCH criada"
            fi

            # Abrir PR
            PR_OUT=$(gh pr create \
              --repo "$FULL" \
              --head "$BRANCH" \
              --base "$PROD" \
              --title "Release $VERSION" \
              --body "Release automatica $VERSION de develop para $PROD." 2>&1 || true)

            PR_URL=$(echo "$PR_OUT" | grep -oP 'https://github\.com/[^\s]+/pull/\d+')
            if [ -n "$PR_URL" ]; then
              echo "  PR criado: $PR_URL"
            elif [ -z "$PR_OUT" ]; then
              echo "  FAIL ao criar PR (sem saida)"
            elif echo "$PR_OUT" | grep -qi "already exists\|existing\|já existe\|ya existe"; then
              echo "  PR ja existe"
            else
              echo "  AVISO (PR): $(echo "$PR_OUT" | tr '\n' ' ')"
            fi

            echo ""
          done

          echo "Feito."
