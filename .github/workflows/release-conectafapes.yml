name: Release ConectaFapes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: v1.5). Vazio = detectar automatico"
        required: false
        type: string
      execute:
        description: "EXECUTAR (desmarcado = dry-run)"
        required: false
        type: boolean
        default: false
      backend_admin:
        description: "backend-admin"
        required: false
        type: boolean
        default: true
      frontend_backoffice:
        description: "frontend-backoffice"
        required: false
        type: boolean
        default: true
      frontoffice_backend:
        description: "frontoffice-backend"
        required: false
        type: boolean
        default: true
      frontoffice_frontend:
        description: "frontoffice-frontend"
        required: false
        type: boolean
        default: true
      prestacao_de_contas:
        description: "prestacao-de-contas"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versao
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v1.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versao: $V"

      - name: Montar lista de repositorios
        id: repos
        run: |
          REPOS=""
          if ${{ inputs.backend_admin }}; then
            REPOS="$REPOS leds-conectafapes-backend-admin"
          fi
          if ${{ inputs.frontend_backoffice }}; then
            REPOS="$REPOS leds-conectafapes-frontend-backoffice"
          fi
          if ${{ inputs.frontoffice_backend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-backend"
          fi
          if ${{ inputs.frontoffice_frontend }}; then
            REPOS="$REPOS leds-conectafapes-frontoffice-frontend"
          fi
          if ${{ inputs.prestacao_de_contas }}; then
            REPOS="$REPOS leds-conectafapes-prestacao-de-contas"
          fi

          if [ -z "$REPOS" ]; then
            echo "Selecione ao menos um repositorio"
            exit 1
          fi

          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mostrar plano
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "============================================"
          echo "  RELEASE $VERSION"
          echo "============================================"
          echo ""
          echo "Modo: ${{ inputs.execute && 'EXECUTAR' || 'DRY-RUN (nada sera alterado)' }}"
          echo ""

          for REPO in ${{ steps.repos.outputs.repos }}; do
            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi
            echo "  [$REPO]"
            echo "    Branch: release/$VERSION (de develop)"
            echo "    PR:     release/$VERSION -> $PROD"
            echo ""
          done

      - name: Executar
        if: ${{ inputs.execute }}
        run: |
          set +e

          VERSION="${{ steps.version.outputs.version }}"
          echo "Lançando release $VERSION..."
          echo ""

          not_null() {
            # jq .field em resposta 404 retorna a string literal "null"
            [ -n "$1" ] && [ "$1" != "null" ]
          }

          for REPO in ${{ steps.repos.outputs.repos }}; do
            FULL="leds-conectafapes/$REPO"

            if [ "$REPO" = "leds-conectafapes-prestacao-de-contas" ]; then
              PROD="master"
            else
              PROD="main"
            fi

            BRANCH="release/$VERSION"

            echo ">>> $REPO"

            # 1. develop existe?
            DEVELOP_SHA=$(gh api "repos/$FULL/git/refs/heads/develop" --jq '.object.sha' 2>/dev/null || true)
            if ! not_null "$DEVELOP_SHA"; then
              echo "  FAIL: develop nao encontrado"
              echo ""
              continue
            fi

            # 2. branch ja existe?
            EXISTING=$(gh api "repos/$FULL/git/refs/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true)
            if not_null "$EXISTING"; then
              echo "  Branch $BRANCH ja existe"
            else
              # 3. criar branch
              gh api "repos/$FULL/git/refs" \
                --field ref="refs/heads/$BRANCH" \
                --field sha="$DEVELOP_SHA" --silent 2>/dev/null || true
              # 4. confirmar
              CONFIRM=$(gh api "repos/$FULL/git/refs/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true)
              if not_null "$CONFIRM"; then
                echo "  Branch $BRANCH criada"
              else
                echo "  FAIL: nao foi possivel criar branch (PAT sem permissao de escrita?)"
                echo ""
                continue
              fi
            fi

            # 5. abrir PR
            PR_OUT=$(gh pr create \
              --repo "$FULL" \
              --head "$BRANCH" \
              --base "$PROD" \
              --title "Release $VERSION" \
              --body "Release automatica $VERSION de develop para $PROD." 2>&1 || true)

            if echo "$PR_OUT" | grep -q '^https://github.com/'; then
              echo "  PR criado: $(echo "$PR_OUT" | grep -oP 'https://github\.com/[^\s]+/pull/\d+')"
            else
              echo "  FAIL (PR): $(echo "$PR_OUT" | tr '\n' ' ' | head -c 250)"
            fi

            echo ""
          done

          echo "Feito."
