name: Estável · front-office

# Ambiente ESTÁVEL ("pronto para desenvolvimento"): publica quando uma alteração
# é promovida para a `main` via Pull Request aprovado.
#
# GATE DE APROVAÇÃO = branch protection da `main` (PR + 2 aprovações). Ele não
# fica aqui: em repositório privado, "required reviewers" de Environment exige
# GitHub Enterprise (o plano da org é Team). Ao mergear, este workflow publica.

on:
  push:
    branches:
      - main
    paths:
      - "prototype/frontOffice/**"
  workflow_dispatch:

permissions:
  contents: read

# Publicação no estável não é cancelada no meio: cada promoção deve concluir.
concurrency:
  group: estavel-frontoffice
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-vercel.yml
    secrets: inherit
    with:
      app_name: front-office (estável)
      working_directory: prototype/frontOffice
      environment: estavel
      vercel_org_id: team_pmJ76UeUWi1GzgY4VnYAyeaQ
      vercel_project_id: prj_fg6NqzdJI2h8gdup4UPUck6TXHww
      token_secret: VERCEL_TOKEN_ESTAVEL
