name: Project 43 Automation

on:
  pull_request:
    paths:
      - ".github/workflows/project43-automation.yml"
      - ".github/workflows/project43-sprint-rollover.yml"
      - "tools/project43-automation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/project43-automation.yml"
      - ".github/workflows/project43-sprint-rollover.yml"
      - "tools/project43-automation/**"

jobs:
  test:
    # Runner self-hosted da organizacao: nao consome a cota de Actions (esgotada
    # em jul/2026). Dependencias validadas em execucao real neste runner:
    # checkout+sparse-checkout (git 2.54), setup-node, `npm install -g` e egress
    # para api.github.com, registry.npmjs.org e gitlab.com.
    #
    # CHAVE DE TROCA: criar a variavel RUNNER_LABELS com `["ubuntu-latest"]` (JSON)
    # devolve todos estes workflows ao runner hospedado, sem alterar codigo.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    defaults:
      run:
        working-directory: tools/project43-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/project43-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
