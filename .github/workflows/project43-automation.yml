name: Project 43 Automation

on:
  pull_request:
    paths:
      - ".github/workflows/project43-automation.yml"
      - ".github/workflows/project43-sprint-rollover.yml"
      - "tools/project43-automation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/project43-automation.yml"
      - ".github/workflows/project43-sprint-rollover.yml"
      - "tools/project43-automation/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/project43-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/project43-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
