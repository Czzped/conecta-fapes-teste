name: Deploy Estável (com aprovação)

# Ambiente ESTÁVEL ("pronto para desenvolvimento"): só é atualizado quando uma
# alteração é promovida para a `main` via Pull Request aprovado.
#
# GATE DE APROVAÇÃO = branch protection da `main` (PR + 2 aprovações).
# Ele NÃO fica neste workflow: em repositório privado, "required reviewers" de
# Environment exige GitHub Enterprise (o plano da org é Team), então a aprovação
# é feita no Pull Request. Ao mergear, este workflow publica direto.
# O Environment `estavel` é usado para restringir o deploy à branch `main` e para
# escopar os secrets da conta Vercel do estável.
# Publica em PROJETOS VERCEL SEPARADOS (URLs estáveis), em uma CONTA VERCEL
# PRÓPRIA (token + org id vêm de secrets `*_ESTAVEL`), independente da conta usada
# pelo ambiente de protótipo. A conta do estável NÃO precisa ter acesso ao
# repositório: o deploy é feito pela CLI daqui, sem conexão Git no Vercel.
#
# POR QUE O ESTÁVEL USA CLI E O PROTÓTIPO USA DEPLOY NATIVO DO VERCEL:
# - a integração nativa do Vercel com Git exige plano Pro para repositório privado
#   de organização; a conta do estável está no plano Hobby. A CLI não tem essa
#   restrição, então o estável sai daqui sem custo de assinatura.
# - o protótipo publica a cada push (dezenas por dia); fazer isso no Actions
#   consumiria a cota da org (plano Team, 3.000 min/mês, já estourada em jul/2026).
#   Por isso ele usa o deploy nativo do Vercel, na conta que já é paga.
# - o estável só publica em promoções aprovadas (raras), então o custo de Actions
#   aqui é pequeno. Ver docs/management/ambientes-prototipo.md
#
# Secrets necessários (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN_ESTAVEL                  token da conta do estável
#   VERCEL_ORG_ID_ESTAVEL                 Team ID (team_...) ou Account ID (usr_...)
#   VERCEL_PROJECT_ID_FRONTOFFICE_ESTAVEL prj_... do projeto front-office estável
#   VERCEL_PROJECT_ID_BACKOFFICE_ESTAVEL  prj_... do projeto backoffice estável

on:
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-estavel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-estavel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.app_name }} (estável)
    runs-on: ubuntu-latest
    # Environment `estavel`: restringe o deploy à branch `main` e permite guardar
    # os secrets da conta Vercel do estável com escopo próprio.
    # (A aprovação humana acontece antes, no PR — ver comentário no topo.)
    environment: estavel
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: backoffice
            working_directory: prototype/backoffice
            vercel_project_id_secret: VERCEL_PROJECT_ID_BACKOFFICE_ESTAVEL
          - app_name: front-office
            working_directory: prototype/frontOffice
            vercel_project_id_secret: VERCEL_PROJECT_ID_FRONTOFFICE_ESTAVEL

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_ESTAVEL }}
      # Acesso dinâmico ao secret cujo nome está na matriz (suportado pelo contexto `secrets`).
      VERCEL_PROJECT_ID: ${{ secrets[matrix.vercel_project_id_secret] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Conferir secrets da conta do estável
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN_ESTAVEL }}
        run: |
          faltando=""
          [ -n "$TOKEN" ] || faltando="$faltando VERCEL_TOKEN_ESTAVEL"
          [ -n "$VERCEL_ORG_ID" ] || faltando="$faltando VERCEL_ORG_ID_ESTAVEL"
          [ -n "$VERCEL_PROJECT_ID" ] || faltando="$faltando ${{ matrix.vercel_project_id_secret }}"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando — configure em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secrets da conta do estável presentes."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_ESTAVEL }}

      - name: Build production bundle
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_ESTAVEL }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_ESTAVEL }}
