name: (reutilizável) Deploy Vercel

# Lógica de deploy compartilhada pelos 4 workflows de publicação dos protótipos
# (2 apps × 2 ambientes). Mantida em um só lugar: corrigir aqui vale para todos.
#
# Publica pela CLI do Vercel. Motivo de não usar a integração nativa do Vercel:
# ela exige plano Pro para repositório privado de organização, e as contas usadas
# estão no plano Hobby. A CLI não tem essa restrição.
#
# Cada workflow chamador tem seu próprio filtro de `paths`, então o GitHub só
# inicia o job do app que realmente mudou — o app intocado não consome minutos.
# Ver docs/management/ambientes-prototipo.md

on:
  workflow_call:
    inputs:
      app_name:
        description: "Nome do app, para exibição"
        required: true
        type: string
      working_directory:
        description: "Pasta do app no repositório"
        required: true
        type: string
      environment:
        description: "GitHub Environment (restringe a branch e escopa segredos)"
        required: true
        type: string
      vercel_org_id:
        description: "Identificador da conta/time no Vercel (não é segredo)"
        required: true
        type: string
      vercel_project_id:
        description: "Identificador do projeto no Vercel (não é segredo)"
        required: true
        type: string
      token_secret:
        description: "NOME do secret que guarda o token do Vercel"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }}
    # Runner self-hosted da organizacao: nao consome a cota de Actions (esgotada
    # em jul/2026). Dependencias validadas em execucao real neste runner:
    # checkout+sparse-checkout (git 2.54), setup-node, `npm install -g` e egress
    # para api.github.com, registry.npmjs.org e gitlab.com.
    #
    # CHAVE DE TROCA: criar a variavel RUNNER_LABELS com `["ubuntu-latest"]` (JSON)
    # devolve todos estes workflows ao runner hospedado, sem alterar codigo.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","k8s-runners"]') }}
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
      VERCEL_TOKEN: ${{ secrets[inputs.token_secret] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Conferir token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret '${{ inputs.token_secret }}' está vazio ou não existe. Cadastre em Settings > Environments > ${{ inputs.environment }}."
            exit 1
          fi
          echo "Token presente."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Reaproveita o cache do npm entre execuções para encurtar o install que o
      # `vercel build` faz internamente. Chaveado por package.json porque o
      # backoffice não versiona package-lock.json.
      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ inputs.app_name }}-${{ hashFiles(format('{0}/package.json', inputs.working_directory)) }}
          restore-keys: |
            npm-${{ inputs.app_name }}-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Publica de FORA do repositorio, de proposito.
      #
      # A Vercel identifica o autor do commit e recusa o deployment se essa pessoa nao
      # tiver assento no time, deixando-o em BLOCKED (`TEAM_ACCESS_REQUIRED`) - a CLI
      # entao fica esperando indefinidamente. Aconteceu em 04/08/2026 com um commit da
      # equipe de design, travando os dois ambientes.
      #
      # Adicionar todo mundo aos times exigiria plano Pro nas duas contas. Como o build
      # ja esta pronto em `.vercel/output`, o deploy nao precisa do contexto Git:
      # copiando para um diretorio sem `.git`, a Vercel atribui o deployment ao dono do
      # token, que e membro. Assim qualquer pessoa pode commitar sem travar a publicacao.
      - name: Deploy to Vercel production
        run: |
          area="$RUNNER_TEMP/deploy-vercel"
          rm -rf "$area" && mkdir -p "$area"
          cp -r .vercel "$area/"
          cd "$area"
          # `--yes` evita qualquer pergunta interativa, ja que o diretorio e novo.
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
