name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    # Só reconstrói o site quando alguma ENTRADA da documentação muda. Antes rodava
    # em todo push na `main`: em jul/2026 foram 36 execuções (81 min) para apenas ~13
    # commits que mexeram em docs — o resto era build descartável, num recurso que
    # estourou a cota da organização.
    #
    # A lista abaixo é o conjunto real de entradas do `mkdocs build`:
    #   docs/            -> docs_dir
    #   overrides/       -> theme.custom_dir
    #   mkdocs.yml       -> configuração e nav
    #   requirements.txt -> versões do mkdocs e plugins
    #   tools/mkdocs_hooks.py + tools/build_capacidades.py -> hook on_pre_build que
    #                       regenera o Mapa de Capacidades a cada build
    # Ao criar uma nova entrada (plugin, hook, pasta de tema), acrescente aqui.
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "tools/mkdocs_hooks.py"
      - "tools/build_capacidades.py"
      - ".github/workflows/docs-pages.yml"
  # Continua disponível para forçar uma republicação a qualquer momento.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Build documentation site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
