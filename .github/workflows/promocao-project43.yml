name: Promoção → Project 43

# Quando um PR de promoção (prototipagem -> main) que altera o protótipo é
# MERGEADO, cria uma issue "Pronto para Desenvolvimento" no Project 43,
# já com Repositório (repo de produto alvo) e Area=Frontend, e a auditoria
# (corpo do PR) no corpo da issue. Usa PROJECTS_PAT (mesmo secret do release).
#
# Os DEPLOYS não passam por aqui: são feitos nativamente pelo Vercel a partir
# das branches (`prototipagem` -> protótipo, `main` -> estável), para não
# consumir minutos de GitHub Actions. Ver docs/management/ambientes-prototipo.md
#
# Este job é de propósito enxuto (sem build, sem setup-node, checkout parcial):
# roda em ~30s para pesar o mínimo possível na cota de Actions.

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "prototype/**"

permissions:
  contents: read

jobs:
  pronto-para-dev:
    if: github.event.pull_request.merged == true
    # Runner self-hosted da organizacao: nao consome a cota de Actions (esgotada
    # em jul/2026). Dependencias validadas em execucao real neste runner:
    # checkout+sparse-checkout (git 2.54), setup-node, `npm install -g` e egress
    # para api.github.com, registry.npmjs.org e gitlab.com.
    #
    # CHAVE DE TROCA: criar a variavel RUNNER_LABELS com `["ubuntu-latest"]` (JSON)
    # devolve todos estes workflows ao runner hospedado, sem alterar codigo.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    steps:
      - name: Checkout (apenas a ferramenta)
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools/promote-prototype
          sparse-checkout-cone-mode: true

      - name: Criar issue "Pronto para Desenvolvimento" no Project 43
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Deixe DRY_RUN=true para validar a resolução de campos antes de criar de verdade.
          DRY_RUN: ${{ vars.PROMOCAO_DRY_RUN || 'false' }}
        run: node tools/promote-prototype/create-ready-for-dev.mjs
